        }
        /* 演示占位 Tab：点选后勾选态落在该项，并走原 toast */
        tabs.querySelectorAll('button').forEach((b) => {
          b.classList.remove('active');
          b.removeAttribute('aria-current');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-current', 'page');
        syncRailProductLabel();
        const toastMsg = btn.getAttribute('data-toast');
        if (toastMsg && typeof toast === 'function') toast(toastMsg);
        else btn.click();
      });
      document.addEventListener('click', () => setOpen(false));
    })();

    /**
     * 同步侧栏产品下拉的当前选中文案与菜单勾选。
     */
    function syncRailProductLabel() {
      const label = document.getElementById('libraRailProductLabel');
      const menu = document.getElementById('libraRailProductMenu');
      const tabs = document.getElementById('headerTabs');
      if (!label || !tabs) return;
      const active = /** @type {HTMLElement|null} */ (
        tabs.querySelector('button.active, button[aria-current="page"]')
        || tabs.querySelector('button[data-view="contracts"]')
      );
      const text = (active?.textContent || '协议').trim();
      label.textContent = text;
      if (menu) {
        menu.querySelectorAll('[data-rail-tab-index]').forEach((item) => {
          const idx = item.getAttribute('data-rail-tab-index');
          const btn = tabs.querySelectorAll('button')[Number(idx)];
          const on = btn === active;
          item.classList.toggle('is-selected', on);
          item.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }
    }

    /**
     * 将顶栏 Logo / 右侧工具迁入或迁出侧栏；一级导航改为侧栏下拉。
     * @param {boolean} enabled
     */
    function syncLibraRailChrome(enabled) {
      const header = document.querySelector('.app-header');
      const headerLeft = document.querySelector('.app-header .header-left');
      const railHead = document.getElementById('libraRailHead');
      const railPrimary = document.getElementById('libraRailPrimary');
      const railFoot = document.getElementById('libraRailFoot');
      const railSep = document.getElementById('libraRailSep');
      if (!header || !headerLeft || !railHead || !railPrimary || !railFoot) return;

      if (enabled) {
        const brandEl = headerLeft.querySelector('.brand') || railHead.querySelector('.brand');
        const rightEl = header.querySelector('.header-right') || railFoot.querySelector('.header-right');
        if (brandEl) railHead.appendChild(brandEl);
        if (rightEl) railFoot.appendChild(rightEl);
        railHead.setAttribute('aria-hidden', 'false');
        railPrimary.setAttribute('aria-hidden', 'false');
        railFoot.setAttribute('aria-hidden', 'false');
        if (railSep) railSep.setAttribute('aria-hidden', 'false');
        syncRailProductLabel();
      } else {
        const brandEl = railHead.querySelector('.brand') || headerLeft.querySelector('.brand');
        const rightEl = railFoot.querySelector('.header-right') || header.querySelector('.header-right');
        if (brandEl) headerLeft.insertBefore(brandEl, headerLeft.firstChild);
        if (rightEl) header.appendChild(rightEl);
        railHead.setAttribute('aria-hidden', 'true');
        railPrimary.setAttribute('aria-hidden', 'true');
        railFoot.setAttribute('aria-hidden', 'true');
        if (railSep) railSep.setAttribute('aria-hidden', 'true');
        const menu = document.getElementById('libraRailProductMenu');
        const trigger = document.getElementById('libraRailProductTrigger');
        if (menu) menu.hidden = true;
        if (trigger) {
          trigger.classList.remove('is-open');
          trigger.setAttribute('aria-expanded', 'false');
        }
      }
    }

    /**
     * 切换视觉皮肤（同结构，仅视觉层）。
     * 本页仅启用 libra-top；其余皮肤入口已注释。
     * // - docusign：DocuSign 风
     * // - notasign：LibraTech 悬浮卡片，顶栏仍为通栏产品导航
     * - libra-top：LibraTech 卡片 + 顶栏悬浮条适配（保留一级导航结构）
     * // - libra-rail：顶栏收纳进左侧，纯左右形态
     * @param {'libra-top'|string} skin
     */
    function applySkin(skin) {
      /* 仅保留 Libra · 顶栏 */
      const next = 'libra-top';
      const root = document.documentElement;
      const prev = root.getAttribute('data-skin') || 'libra-top';
      if (prev === 'libra-rail') {
        syncLibraRailChrome(false);
      }
      root.setAttribute('data-skin', next);
      root.setAttribute('data-shell', 'libra');
      /*
      const allowed = new Set(['docusign', 'notasign', 'libra-top', 'libra-rail']);
      const next = allowed.has(skin) ? skin : 'docusign';
      if (next === 'notasign' || next === 'libra-top' || next === 'libra-rail') {
        root.setAttribute('data-shell', 'libra');
      } else {
        root.removeAttribute('data-shell');
      }
      if (next === 'libra-rail') {
        syncLibraRailChrome(true);
      }
      */
      try { localStorage.setItem(SKIN_KEY, next); } catch (_) { /* ignore */ }
      document.querySelectorAll('#skinSwitcher [data-skin-set]').forEach((btn) => {
        btn.classList.toggle('is-on', btn.getAttribute('data-skin-set') === next);
      });
    }

    /* 面板由 CSS :hover 驱动滑出，无需 JS 展开/收起 */

    (function bindSkinSwitcher() {
      /* 强制 Libra · 顶栏；忽略 localStorage 中的其它皮肤 */
      applySkin('libra-top');
      /*
      let saved = 'docusign';
      try { saved = localStorage.getItem(SKIN_KEY) || 'docusign'; } catch (_) {}
      applySkin(saved);
      document.getElementById('skinSwitcher')?.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-skin-set]');
        if (!btn) return;
        applySkin(btn.getAttribute('data-skin-set') || 'docusign');
      });
      */
    })();

    /** 列表筛选：触发器 → 浮窗（应用才查询）→ 已应用标签（PRD 4.1/4.3/4.4） */
    (function bindListFilters() {
      const root = document.getElementById('envelopeFilters');
      if (!root) return;

      function closeAll(except) {
        closeSharedDateCalFloat();
        root.querySelectorAll('.filter-field').forEach((field) => {
          if (field === except) return;
          field.classList.remove('is-open');
          const trigger = field.querySelector('.filter-trigger');
          const pop = field.querySelector('.filter-popover');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
          if (pop) {
            pop.hidden = true;
            pop.style.left = '';
            pop.style.right = '';
            pop.style.top = '';
            pop.style.bottom = '';
            pop.removeAttribute('data-place-x');
            pop.removeAttribute('data-place-y');
            const opMenu = pop.querySelector('[data-date-op-menu]');
            if (opMenu) /** @type {HTMLElement} */ (opMenu).hidden = true;
            pop.querySelector('[data-date-op-trigger]')?.classList.remove('is-open');
          }
        });
        const exportMenu = document.getElementById('exportMenu');
        if (exportMenu) exportMenu.hidden = true;
      }
      window.__closeFilterPops = closeAll;

      /**
       * 筛选浮窗边界自适应：右溢出左贴齐；下溢出向上展开。
       * @param {HTMLElement} field
       * @param {HTMLElement} pop
       */
      function positionFilterPopover(field, pop) {
        pop.style.left = '';
        pop.style.right = '';
        pop.style.top = '';
        pop.style.bottom = '';
        pop.removeAttribute('data-place-x');
        pop.removeAttribute('data-place-y');
        const margin = 8;
        const fr = field.getBoundingClientRect();
        const pr = pop.getBoundingClientRect();
        if (pr.right > window.innerWidth - margin) {
          pop.style.left = 'auto';
          pop.style.right = '0';
          pop.setAttribute('data-place-x', 'end');
        } else if (pr.left < margin) {
          pop.style.left = `${margin - pr.left}px`;
          pop.setAttribute('data-place-x', 'shift');
        }
        const pr2 = pop.getBoundingClientRect();
        if (pr2.bottom > window.innerHeight - margin && fr.top > pr2.height + 20) {
          pop.style.top = 'auto';
          pop.style.bottom = 'calc(100% + 10px)';
          pop.setAttribute('data-place-y', 'above');
        }
      }
      window.__positionFilterPopover = positionFilterPopover;

      root.querySelectorAll('.filter-field').forEach((field) => {
        const key = field.getAttribute('data-filter') || '';
        const trigger = field.querySelector('.filter-trigger');
        const pop = field.querySelector('.filter-popover');
        if (!trigger || !pop) return;

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = !field.classList.contains('is-open');
          closeAll(open ? field : null);
          field.classList.toggle('is-open', open);
          trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
          pop.hidden = !open;
          if (open) {
            const checked = pop.querySelector(`input[name="filter-${key}"]:checked`);
            const applied = activeFilters[key];
            if (key === 'date') {
              const wrap = /** @type {HTMLElement|null} */ (pop.querySelector('[data-date-op-wrap]'));
              const op = applied?.op || 'eq';
              if (wrap && typeof wrap._applyDateOp === 'function') wrap._applyDateOp(op);
              if (op === 'eq') {
                if (applied?.value) {
                  const input = /** @type {HTMLInputElement|null} */ (pop.querySelector(`input[name="filter-date"][value="${CSS.escape(applied.value)}"]`));
                  if (input) input.checked = true;
                } else if (checked) /** @type {HTMLInputElement} */ (checked).checked = false;
              } else if (op === 'between' && applied?.value) {
                const [a, b] = String(applied.value).split('~');
                const start = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-start]'));
                const end = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-end]'));
                if (start && a) { start.dataset.iso = a; start.value = formatDateDisplay(a); }
                if (end && b) { end.dataset.iso = b; end.value = formatDateDisplay(b); }
              } else if (applied?.value) {
                const one = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-one]'));
                if (one) { one.dataset.iso = applied.value; one.value = formatDateDisplay(applied.value); }
              }
            } else if (applied) {
              const input = pop.querySelector(`input[name="filter-${key}"][value="${applied.value}"]`);
              if (input) input.checked = true;
            } else if (checked) checked.checked = false;
            requestAnimationFrame(() => positionFilterPopover(field, /** @type {HTMLElement} */ (pop)));
          }
        });

        pop.addEventListener('click', (e) => e.stopPropagation());

        if (key === 'date') bindDateOpUI(pop);

        pop.querySelector('.filter-popover__cancel')?.addEventListener('click', () => closeAll(null));
        pop.querySelector('.filter-popover__clear')?.addEventListener('click', () => {
          activeFilters[key] = null;
          closeAll(null);
          toast(`已清除「${FILTER_TITLES[key]}」筛选`);
          render();
        });
        pop.querySelector('.filter-popover__apply')?.addEventListener('click', () => {
          if (key === 'date') {
            const wrap = pop.querySelector('[data-date-op-wrap]');
            const op = wrap?.getAttribute('data-op') || 'eq';
            const opLabel = wrap?.querySelector('[data-date-op-label]')?.textContent || '=';
            if (op === 'eq') {
              const checked = /** @type {HTMLInputElement|null} */ (pop.querySelector('input[name="filter-date"]:checked'));
              if (!checked) return;
              const label = checked.getAttribute('data-label') || checked.value;
              activeFilters.date = { value: checked.value, op: 'eq', label: `日期：${label}` };
              toast(`已应用「日期：${label}」`);
            } else if (op === 'between') {
              const start = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-start]'));
              const end = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-end]'));
              const a = start?.dataset.iso || '';
              const b = end?.dataset.iso || '';
              if (!a || !b) { toast('请选择开始与结束日期'); return; }
              activeFilters.date = { value: `${a}~${b}`, op: 'between', label: `日期：介于 ${formatDateDisplay(a)} ~ ${formatDateDisplay(b)}` };
              toast(`已应用「${activeFilters.date.label}」`);
            } else {
              const one = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-one]'));
              const iso = one?.dataset.iso || '';
              if (!iso) { toast('请选择日期'); return; }
              activeFilters.date = { value: iso, op, label: `日期：${opLabel} ${formatDateDisplay(iso)}` };
              toast(`已应用「${activeFilters.date.label}」`);
            }
            closeAll(null);
            selectedIds.clear();
        pageState.page = 1;
            render();
            return;
          }
          const checked = /** @type {HTMLInputElement|null} */ (pop.querySelector(`input[name="filter-${key}"]:checked`));
          closeAll(null);
          if (!checked) return;
          const label = checked.getAttribute('data-label') || checked.value;
          activeFilters[key] = { value: checked.value, label: `${FILTER_TITLES[key]}：${label}` };
          toast(`已应用「${FILTER_TITLES[key]}：${label}」`);
          selectedIds.clear();
        pageState.page = 1;
          render();
        });
      });

      document.addEventListener('click', () => {
        closeSharedDateCalFloat();
        document.querySelectorAll('[data-date-op-menu]').forEach((m) => { /** @type {HTMLElement} */ (m).hidden = true; });
        document.querySelectorAll('[data-date-op-trigger]').forEach((t) => {
          t.classList.remove('is-open');
          t.setAttribute('aria-expanded', 'false');
        });
        closeAll(null);
      });
    })();

    /** 已应用条件 → 左侧 chip；未应用 → 右侧下拉；超宽从右往左折进「筛选条件」（DocuSign 式） */
    function renderAppliedRow() {
      const row = document.getElementById('appliedRow');
      const chipsBox = document.getElementById('filterChips');
      const sep = document.getElementById('filterSep');
      /* 当前视图不支持的附加条件直接清掉（PRD 4.6 切列表规则） */
      const allowMap = {
        all: ['date', 'status', 'sender', 'quick'],
        draft: ['date'],
        active: ['date', 'sender', 'quick'],
        completed: ['date', 'sender'],
        folder: ['date', 'status'],
      };
      const allow = allowMap[currentFolder ? 'folder' : currentNav] || ['date'];
      Object.keys(activeFilters).forEach((key) => {
        if (!allow.includes(key)) activeFilters[key] = null;
      });

      const defaultLabels = { date: '日期', status: '状态', sender: '发起人', quick: '快速视图' };
      const order = ['date', 'status', 'sender', 'quick'];

      /* 已应用 → chip；对应下拉从行内移除（避免与 chip /「筛选条件」重复） */
      if (chipsBox) {
        chipsBox.innerHTML = '';
        order.forEach((key) => {
          const applied = activeFilters[key];
          if (!applied || !allow.includes(key)) return;
          const chip = document.createElement('span');
          chip.className = 'filter-chip';
          chip.setAttribute('data-filter-chip', key);
          chip.innerHTML = `<span class="filter-chip__label">${applied.label}</span>`;
          const rm = document.createElement('button');
          rm.type = 'button';
          rm.className = 'filter-chip__remove';
          rm.setAttribute('aria-label', `清除${FILTER_TITLES[key]}`);
          rm.innerHTML = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg>';
          rm.addEventListener('click', (e) => {
            e.stopPropagation();
            activeFilters[key] = null;
            toast(`已清除「${FILTER_TITLES[key]}」筛选`);
            render();
          });
          chip.appendChild(rm);
          chipsBox.appendChild(chip);
        });
      }

      document.querySelectorAll('#filterTriggers .filter-field').forEach((field) => {
        const key = field.getAttribute('data-filter');
        const trigger = field.querySelector('.filter-trigger');
        if (!trigger) return;
        const applied = activeFilters[key];
        /* 已应用改走 chip，行内只保留未应用下拉 */
        field.hidden = !allow.includes(key) || !!applied;
        field.classList.remove('is-applied', 'is-collapsed');
        let labelEl = trigger.querySelector('.filter-trigger__label');
        if (!labelEl) {
          const textNode = [...trigger.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim());
          labelEl = document.createElement('span');
          labelEl.className = 'filter-trigger__label';
          if (textNode) {
            trigger.insertBefore(labelEl, textNode);
            labelEl.appendChild(textNode);
          } else {
            trigger.insertBefore(labelEl, trigger.firstChild);
          }
        }
        labelEl.textContent = defaultLabels[key];
        const clearEl = trigger.querySelector('.filter-trigger__clear');
        if (clearEl) clearEl.hidden = true;
        const caret = trigger.querySelector('.aip-icon');
        if (caret) caret.hidden = false;
      });

      /* 清除所有：放进筛选行尾部，有任一条件时出现 */
      const count = Object.keys(activeFilters).filter((k) => activeFilters[k]).length;
      let clearAll = document.getElementById('appliedClearAll');
      if (!clearAll) {
        clearAll = document.createElement('button');
        clearAll.type = 'button';
        clearAll.className = 'applied-clearall';
        clearAll.id = 'appliedClearAll';
        clearAll.textContent = '清除所有';
        document.getElementById('filterTriggers').appendChild(clearAll);
      }
      clearAll.hidden = count === 0;
      if (row) row.innerHTML = '';

      /* chip 与未应用下拉之间的分隔线 */
      const hasChips = !!(chipsBox && chipsBox.childElementCount);
      const hasOpenFields = [...document.querySelectorAll('#filterTriggers .filter-field')]
        .some((f) => !f.hidden);
      if (sep) sep.classList.toggle('is-on', hasChips && hasOpenFields);

      /* 去掉旧版「已应用按钮」分隔线残留 */
      document.getElementById('filterSepApplied')?.remove();

      requestAnimationFrame(() => updateFilterCollapse());
    }

    /**
     * DocuSign 式收纳：空间不够时从右往左依次折进「筛选条件」弹窗：
     * 1) 未应用下拉 → 2)「清除所有」→ 3) 已应用 chip。
     * 徽标 = 被收纳的下拉数 + 被收纳的 chip 数。
     */
    function updateFilterCollapse() {
      const collapseBtn = document.getElementById('filterCollapseBtn');
      const search = document.querySelector('.envelope-search');
      const controls = document.querySelector('.envelope-controls');
      const chipsBox = document.getElementById('filterChips');
      const sep = document.getElementById('filterSep');
      if (!collapseBtn || !search || !controls) return;

      const fields = [...document.querySelectorAll('#filterTriggers .filter-field')].filter((f) => !f.hidden);
      const clearAll = document.getElementById('appliedClearAll');
      const chips = chipsBox ? [...chipsBox.querySelectorAll('.filter-chip')] : [];

      /* 重置折叠态，再按预算重算 */
      fields.forEach((f) => f.classList.remove('is-collapsed'));
      chips.forEach((c) => c.classList.remove('is-collapsed'));
      if (chipsBox) chipsBox.classList.remove('is-fully-collapsed');
      if (clearAll) clearAll.classList.remove('is-collapsed');
      collapseBtn.hidden = false;
      if (sep) {
        sep.classList.toggle('is-on', chips.length > 0 && fields.length > 0);
      }

      /**
       * @returns {number} 搜索 / 导出 / 收纳按钮之外的可用宽度
       */
      const measureBudget = () => {
        const controlsWidth = controls.getBoundingClientRect().width;
        const searchW = search.getBoundingClientRect().width + 16;
        let rightGroupW = 0;
        const exportWrap = document.querySelector('.export-wrap');
        if (exportWrap && exportWrap.offsetParent !== null) {
          rightGroupW += exportWrap.getBoundingClientRect().width + 8;
        }
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn && refreshBtn.offsetParent !== null) {
          rightGroupW += refreshBtn.getBoundingClientRect().width + 8;
        }
        const collapseW = collapseBtn.getBoundingClientRect().width + 8;
        return Math.max(0, controlsWidth - searchW - rightGroupW - collapseW - 16);
      };

      /**
       * @returns {number} 当前行内筛选相关占用宽度
       */
      const usedWidth = () => {
        let w = 0;
        fields.forEach((f) => {
          if (f.classList.contains('is-collapsed')) return;
          const t = f.querySelector('.filter-trigger');
          if (t) w += t.getBoundingClientRect().width + 8;
        });
        chips.forEach((c) => {
          if (c.classList.contains('is-collapsed')) return;
          w += c.getBoundingClientRect().width + 8;
        });
        if (sep && sep.classList.contains('is-on') && sep.offsetParent !== null) {
          w += sep.getBoundingClientRect().width + 8;
        }
        if (clearAll && !clearAll.hidden && !clearAll.classList.contains('is-collapsed') && clearAll.offsetParent !== null) {
          w += clearAll.getBoundingClientRect().width + 8;
        }
        return w;
      };

      /**
       * 同步分隔线显隐（chip 与下拉都还有可见项时才显示）
       */
      const syncSep = () => {
        if (!sep) return;
        const stillOpen = fields.some((f) => !f.classList.contains('is-collapsed'));
        const visibleChips = chips.some((c) => !c.classList.contains('is-collapsed'));
        sep.classList.toggle('is-on', stillOpen && visibleChips);
      };

      const budget = measureBudget();
      let collapsedFields = 0;
      let collapsedChips = 0;

      /* ① 先收未应用下拉（从右往左） */
      for (let i = fields.length - 1; i >= 0 && usedWidth() > budget; i--) {
        if (fields[i].classList.contains('is-collapsed')) continue;
        fields[i].classList.add('is-collapsed');
        collapsedFields++;
        syncSep();
      }

      /* ② 再收「清除所有」（弹窗内已有全部清除） */
      if (clearAll && !clearAll.hidden && usedWidth() > budget) {
        clearAll.classList.add('is-collapsed');
      }

      /* ③ 最后收已应用 chip（从右往左） */
      for (let i = chips.length - 1; i >= 0 && usedWidth() > budget; i--) {
        if (chips[i].classList.contains('is-collapsed')) continue;
        chips[i].classList.add('is-collapsed');
        collapsedChips++;
        syncSep();
      }
      if (chipsBox && chips.length > 0 && chips.every((c) => c.classList.contains('is-collapsed'))) {
        chipsBox.classList.add('is-fully-collapsed');
        if (sep) sep.classList.remove('is-on');
      }

      /* 仍溢出则强制隐藏清除所有，避免竖排挤爆 */
      if (clearAll && !clearAll.hidden && usedWidth() > budget) {
        clearAll.classList.add('is-collapsed');
      }

      const cb = document.getElementById('filterCollapseCount');
      if (cb) {
        const badge = collapsedFields + collapsedChips;
        cb.hidden = badge === 0;
        cb.textContent = badge ? String(badge) : '';
        cb.style.fontWeight = '600';
      }
    }

    window.addEventListener('resize', () => updateFilterCollapse());
    if (typeof ResizeObserver !== 'undefined') {
      const controlsEl = document.querySelector('.envelope-controls');
      if (controlsEl) new ResizeObserver(() => updateFilterCollapse()).observe(controlsEl);
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      openMenuId = null;
      openPop = null;
      selectedIds.clear();
        pageState.page = 1;
      render();
    });

    document.addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      if (t.closest('#appliedClearAll')) {
        ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
        toast('已清除所有可编辑筛选（保留关键词与当前范围）');
        render();
      }

        if (activeFilters.quick) {

      if (!list.length) return '<small>暂无收件人</small>';
      const first = list.slice(0, 2).join('、');
      if (list.length <= 2) return `<small>收件人：${first}</small>`;
      const rest = list.length - 2;
      return `<small>收件人：${first} <button type="button" class="party-more-btn" data-pop="parties" data-task="${task.id}" aria-haspopup="dialog">+${rest}</button></small>`;
    }

    /** 状态列：业务状态 + 当前待办说明 + 进度（PRD 5.2/5.3/5.4） */
    function stateCellHtml(task) {
      const statusText = STATUS_TEXT[task.statusCode] || '状态更新中';
      let todoHtml = '';
      if (task.todo) {
        if (task.todo.kind === 'mine') {
          todoHtml = `<span class="todo-text todo-text--mine">${task.todo.text}</span>`;
        } else if (task.todo.kind === 'waiting') {
          todoHtml = `<button type="button" class="todo-text todo-text--waiting" data-pop="waiting" data-task="${task.id}">${task.todo.text}</button>`;
        } else {
          todoHtml = `<span class="todo-text todo-text--plain">${task.todo.text}</span>`;
        }
      }
      if (task.statusCode === 'completed') {
        return `<div class="envelope-state is-completed">
          <svg class="status-check" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="currentColor" focusable="false">
            <path d="M8.39 12.74 6 10.35l1.34-1.34L9 10.67l3.66-3.66L14 8.35l-4.39 4.39c-.17.17-.39.26-.61.26s-.44-.1-.61-.26"/>
            <path d="M10 3.9c3.36 0 6.1 2.74 6.1 6.1s-2.74 6.1-6.1 6.1-6.1-2.74-6.1-6.1S6.64 3.9 10 3.9M10 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8"/>
          </svg>
          <span class="todo-text">${statusText}</span>
        </div>`;
      }
      const progressHtml = task.progress
        ? `<span class="envelope-track"><i style="width:${Math.round((task.progress.done / task.progress.total) * 100)}%"></i></span>`
        : '';
      const statusLine = task.progress
        ? `<span class="todo-text todo-text--plain">${statusText} <span style="color:var(--fdd-ink-3)">${task.progress.done}/${task.progress.total}</span></span>`
        : `<span class="todo-text todo-text--plain">${statusText}</span>`;
      return `<div class="envelope-state">${statusLine}${progressHtml}${todoHtml}</div>`;
    }

    /** 文件夹列：点击目录进入对应任务文件夹页；无归属显示未归类（PRD 5.1） */
    function folderCellHtml(task) {
      if (!task.folder) return '<span class="todo-text todo-text--plain">未归类</span>';
      return `<button type="button" class="folder-link" data-goto-folder="${task.folder}">${FOLDER_NAME_MAP[task.folder] || '文件夹'}</button>`;
    }

    /** 单元格渲染器（除主题/状态/更新/文件夹/操作外的可选列） */
    function cellHtml(task, colId) {
      const t = task;
      switch (colId) {
        case 'subject':
          return `<button class="envelope-name" type="button" data-toast="打开任务详情：${t.subject || '未命名签署任务'}（原有详情页）">${t.subject || '未命名签署任务'}</button>${partiesSummaryHtml(t)}`;
        case 'status': return stateCellHtml(t);
        case 'updatedAt': return `<span class="time-cell"><span>${t.date}</span><small>${t.time}</small></span>`;
        case 'folder': return folderCellHtml(t);
        case 'taskNo': return `<span class="col-aux">${t.id}</span>`;
        case 'approval': return `<span class="col-aux">${t.approvalStatus || '—'}</span>`;
        case 'initiator': return `<span class="col-aux">${t.initiatorName || '—'}</span>`;
        case 'recipients': return `<span class="col-aux">${(t.parties || []).slice(0, 2).join('、') || '—'}${(t.parties || []).length > 2 ? ` +${t.parties.length - 2}` : ''}</span>`;
        case 'finishedAt': return `<span class="col-aux">${t.statusCode === 'completed' ? t.date : '—'}</span>`;
        case 'deadline': return `<span class="col-aux">${t.deadline || '长期有效'}</span>`;
        case 'createdAt': return `<span class="col-aux">${t.createdAt || '—'}</span>`;
        case 'creator': return `<span class="col-aux">${t.creator || '—'}</span>`;
        case 'signTemplateId': return `<span class="col-aux">${t.signTemplateId || '—'}</span>`;
        case 'batchId': return `<span class="col-aux">${t.batchId || '—'}</span>`;
        case 'actions':
          return `<div class="row-actions">
            ${t.primary ? `<button class="resend-button${['签署', '填写', '定稿'].includes(t.primary) ? ' is-solid' : ''}" type="button" data-primary="${t.id}">${t.primary}</button>` : ''}
            ${(t.more && t.more.length) ? `
            <span class="more-wrap">
              <button class="more-button" type="button" aria-label="更多操作" data-more="${t.id}">
                <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m2-10c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2m0 16c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2"/></svg>
              </button>

            </span>` : ''}
          </div>`;
        default: return '—';
      }
    }

    function renderHead() {
      const head = document.getElementById('taskHead');
      const ths = activeCols.map((id) => {
        const def = COL_DEFS.find((d) => d.id === id);
        if (id === 'subject') {
          return `<th><input id="checkAll" type="checkbox" aria-label="选择所有行" /></th><th>${def.label}</th>`;
        }
        if (id === 'actions') {
          return `<th class="col-settings-th" aria-label="操作与列设置">
            <button type="button" class="col-settings-btn" id="colSettingsBtn" aria-label="设置列表列" aria-haspopup="dialog">
              <svg class="ico" width="17" height="17" viewBox="0 0 20 20" fill="currentColor"><path d="M8 5.18V2H6v3.18A2.996 2.996 0 0 0 7 11c1.66 0 3-1.34 3-3 0-1.3-.84-2.4-2-2.82M7 9.1c-.61 0-1.1-.49-1.1-1.1S6.39 6.9 7 6.9s1.1.49 1.1 1.1S7.61 9.1 7 9.1m9 2.9c0-1.66-1.34-3-3-3s-3 1.34-3 3c0 1.3.84 2.4 2 2.82V18h2v-3.18c1.16-.41 2-1.51 2-2.82m-3 1.1c-.61 0-1.1-.49-1.1-1.1s.49-1.1 1.1-1.1 1.1.49 1.1 1.1-.49 1.1-1.1 1.1M8 18H6v-6h2zm6-10h-2V2h2z"/></svg>
            </button>
          </th>`;
        }
        const sortable = def.sortable;
        const isSortCol = sortState.field === id;
        const ico = isSortCol ? (sortState.dir === 'asc' ? '↑' : '↓') : '';
        const minW = { subject: 220, status: 150, updatedAt: 130, folder: 110, taskNo: 170, approval: 90, initiator: 90, recipients: 150, finishedAt: 110, deadline: 110, createdAt: 110, creator: 90, signTemplateId: 140, batchId: 110 }[id] || 100;
        return `<th${sortable ? ` data-sort="${id}" class="is-sortable"` : ''} style="min-width:${minW}px">${def.label}${sortable ? ` <span class="sort-ico">${ico}</span>` : ''}</th>`;
      }).join('');
      head.innerHTML = `<tr>${ths}</tr>`;
      /* 表头排序 */
      head.querySelectorAll('[data-sort]').forEach((th) => {
        th.addEventListener('click', () => {
          const field = th.getAttribute('data-sort');
          if (sortState.field === field) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
          else sortState = { field, dir: 'asc' };
          selectedIds.clear();
        pageState.page = 1;
          render();
        });
      });
      head.querySelector('#colSettingsBtn')?.addEventListener('click', () => openColSettings());
      head.querySelector('#checkAll')?.addEventListener('change', (e) => {
        const on = e.target.checked;
        document.querySelectorAll('#taskBody [data-row-check]').forEach((c) => {
          c.checked = on;
          const rid = c.getAttribute('data-row-check');
          if (on) selectedIds.add(rid); else selectedIds.delete(rid);
        });
        syncBatchBar();
      });
    }

    function sortRows(rows) {
      const arr = rows.slice();
      const { field, dir } = sortState;
      arr.sort((a, b) => {
        const va = a[field] || a.date || '';
        const vb = b[field] || b.date || '';
        if (va === vb) return a.id < b.id ? -1 : 1;
        return (va < vb ? -1 : 1) * (dir === 'asc' ? 1 : -1);
      });
      return arr;
    }

    function render() {
      const rows = sortRows(filteredTasks());
      const body = document.getElementById('taskBody');
      let title = TITLE_MAP[currentNav] || '全部任务';
      if (currentFolder) title = FOLDER_NAME_MAP[currentFolder] || '任务文件夹';
      document.getElementById('pageTitle').textContent = title;

      /* 范围选择器：任务文件夹页不显示（PRD 2.1） */
      const scopeSwitch = document.getElementById('scopeSwitch');
      if (scopeSwitch) {
        scopeSwitch.hidden = !!currentFolder;
        scopeSwitch.querySelectorAll('[data-scope]').forEach((b) => {
          b.classList.toggle('is-on', b.getAttribute('data-scope') === currentScope);
        });
      }
      /* 搜索占位随列表变化 */
      const searchInput = /** @type {HTMLInputElement} */ (document.getElementById('searchInput'));
      searchInput.placeholder = currentFolder ? VIEW_SEARCH_PH.folder : (VIEW_SEARCH_PH[currentNav] || '搜索签署任务');

      const pages = Math.max(1, Math.ceil(rows.length / pageState.pageSize));
      if (pageState.page > pages) pageState.page = pages;
      if (pageState.page < 1) pageState.page = 1;
      const start = (pageState.page - 1) * pageState.pageSize;
      const pageRows = rows.slice(start, start + pageState.pageSize);

      document.getElementById('pageTotal').textContent = `共 ${rows.length} 条`;
      const pageInfo = document.getElementById('pageInfo');
      if (pageInfo) pageInfo.innerHTML = `第 <b>${pageState.page}</b> 页`;
      const prev = document.getElementById('pagePrev');
      const next = document.getElementById('pageNext');
      if (prev) prev.disabled = pageState.page <= 1;
      if (next) next.disabled = pageState.page >= pages;
      syncSidebarActive();
      renderAppliedRow();
      syncBatchBar();
      renderHead();

      body.innerHTML = pageRows.map((task) => `
        <tr data-id="${task.id}">
          ${activeCols.map((id) => {
            if (id === 'subject') return `<td><input type="checkbox" data-row-check="${task.id}" ${selectedIds.has(task.id) ? 'checked' : ''} aria-label="选择 ${task.subject || '未命名签署任务'}" /></td><td>${cellHtml(task, id)}</td>`;
            return `<td>${cellHtml(task, id)}</td>`;
          }).join('')}
        </tr>
      `).join('') || `<tr><td colspan="${activeCols.length + 1}" style="text-align:center;color:var(--fdd-ink-3);height:120px">没有符合条件的任务</td></tr>`;
      /* 行重渲染后同步表头全选勾选态（仅当前页） */
      const allChecked = pageRows.length > 0 && pageRows.every((t) => selectedIds.has(t.id));
      const headCheck = document.getElementById('checkAll');
      if (headCheck) headCheck.checked = allChecked;
    }

    /** 批量选择（PRD 6.1：本页选择，不跨页累计；未勾选不显示提示） */
    function syncBatchBar() {
      const bar = document.getElementById('batchBar');
      if (!bar) return;
      const n = selectedIds.size;
      bar.classList.toggle('is-on', n > 0);
      document.getElementById('batchCount').textContent = `${n} 已选定`;
      const expSel = document.getElementById('exportSelected');
      if (expSel) expSel.disabled = n === 0;
      if (n === 0) {
        const moreMenu = document.getElementById('batchMoreMenu');
        const moreBtn = document.getElementById('batchMoreBtn');
        if (moreMenu) moreMenu.hidden = true;
        if (moreBtn) moreBtn.setAttribute('aria-expanded', 'false');
      }
    }

    /** 批量条「更多」菜单 */
    (function bindBatchMore() {
      const btn = document.getElementById('batchMoreBtn');
      const menu = document.getElementById('batchMoreMenu');
      if (!btn || !menu) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = menu.hidden;
        menu.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      menu.addEventListener('click', (e) => {
        if (/** @type {HTMLElement} */ (e.target).closest('button')) {
          menu.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('click', (e) => {
        if (!/** @type {HTMLElement} */ (e.target).closest('.batch-more-wrap')) {
          menu.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    })();

    document.getElementById('taskBody').addEventListener('change', (e) => {
      const cb = /** @type {HTMLElement} */ (e.target).closest('[data-row-check]');
      if (!cb) return;
      const id = cb.getAttribute('data-row-check');
      if (/** @type {HTMLInputElement} */ (cb).checked) selectedIds.add(id); else selectedIds.delete(id);
      syncBatchBar();
    });

    /** 列表切换（PRD 4.6：切状态列表保留关键词与日期，清附加状态 / 发起人 / 快捷） */
    document.querySelectorAll('[data-nav]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-nav') || 'all';
        if (currentFolder) {
          /* 从任务文件夹回固定列表：恢复进入前的人员范围（PRD 4.6） */
          currentScope = scopeBeforeFolder;
        }
        currentNav = target;
        currentFolder = null;
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        openMenuId = null;
        openPop = null;
        selectedIds.clear();
        pageState.page = 1;
        /* 切列表清空筛选状态（PRD 4.6：主动切换清空旧筛选） */
        ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
        render();
      });
    });

    /** 访问范围切换：进入目标范围全部任务，清空旧筛选（PRD 4.6） */
    document.getElementById('scopeSwitch').addEventListener('click', (e) => {
      const btn = /** @type {HTMLElement} */ (e.target).closest('[data-scope]');
      if (!btn) return;
      const scope = btn.getAttribute('data-scope');
      if (scope === currentScope) return;
      currentScope = scope;
      currentNav = 'all';
      currentFolder = null;
      currentLegacy = null;
      document.body.removeAttribute('data-page-mode');
      ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
      selectedIds.clear();
        pageState.page = 1;
      toast(scope === 'corp' ? '已切换：全部签署（清空旧筛选，默认过去 6 个月）' : '已切换：我的签署');
      render();
    });

    /** 任务文件夹（PRD 6.2：独立页面，无人员范围；目录切换保留关键词 / 日期 / 状态） */
    (function bindFolderModule() {
      const moduleEl = document.getElementById('folderModule');
      const moduleToggle = document.getElementById('folderModuleToggle');
      if (!moduleEl || !moduleToggle) return;

      moduleToggle.addEventListener('click', () => {
        const willOpen = !moduleEl.classList.contains('is-open');
        moduleEl.classList.toggle('is-open', willOpen);
        moduleToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        syncCollapseAllLabel();
        /* 展开 / 收起只改侧栏树状态，不换页（PRD 6.2） */
      });

      const moreBtn = document.getElementById('folderMoreBtn');
      const moreMenu = document.getElementById('folderMoreMenu');
      const collapseAllBtn = document.getElementById('folderCollapseAllBtn');

      /* 菜单首项文案随模块展开状态切换：收起态显示「全部展开」，展开态显示「全部收起」 */
      function syncCollapseAllLabel() {
        if (!collapseAllBtn) return;
        const moduleOpen = moduleEl.classList.contains('is-open');
        collapseAllBtn.textContent = moduleOpen ? '全部收起' : '全部展开';
      }

      /* 展开整棵目录树（含模块本身） */
      function expandAllFolders() {
        moduleEl.classList.add('is-open');
        moduleToggle.setAttribute('aria-expanded', 'true');
        (function collect(nodes) {
          nodes.forEach((n) => {
            if (n.children && n.children.length) {
              openFolderIds.add(n.id);
              collect(n.children);
            }
          });
        })(FOLDER_TREE);
        rebuildFolderTree();
      }

      syncCollapseAllLabel();

      moreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        syncCollapseAllLabel();
        moreMenu.hidden = !moreMenu.hidden;
      });
      document.addEventListener('click', (e) => {
        if (!moreMenu.hidden && !moreMenu.contains(/** @type {Node} */ (e.target)) && e.target !== moreBtn) moreMenu.hidden = true;
      });

      /* 全部收起 / 全部展开：按当前模块状态执行对应动作 */
      if (collapseAllBtn) {
        collapseAllBtn.removeAttribute('data-toast');
        collapseAllBtn.addEventListener('click', () => {
          moreMenu.hidden = true;
          if (moduleEl.classList.contains('is-open')) {
            /* 全部收起：折叠整棵目录树，并连同「任务文件夹」模块一并收起 */
            openFolderIds.clear();
            rebuildFolderTree();
            moduleEl.classList.remove('is-open');
            moduleToggle.setAttribute('aria-expanded', 'false');
            toast('已收起全部文件夹');
          } else {
            expandAllFolders();
            toast('已展开全部文件夹');
          }
          syncCollapseAllLabel();
        });
      }

      /* 新建文件夹：打开新建弹窗 */
      moreMenu.querySelectorAll('[data-toast="演示：新建文件夹（原有流程）"]').forEach((b) => {
        b.removeAttribute('data-toast');
        b.addEventListener('click', () => {
          moreMenu.hidden = true;
          openNewFolderModal();
        });
      });

      /* 查找文件夹：打开"选择要查看的文件夹"弹窗 */
      document.getElementById('folderSearchBtn').addEventListener('click', () => {
        moreMenu.hidden = true;
        openFolderPicker();
      });
      document.getElementById('folderSearchInput').addEventListener('input', (e) => {
        const q = /** @type {HTMLInputElement} */ (e.target).value.trim();
        const body = document.getElementById('folderModuleBody');
        if (!q) { rebuildFolderTree(); return; }
        body.innerHTML = '';
        const flat = [];
        (function walk(nodes, path) {
          nodes.forEach((n) => {
            const full = path ? `${path} / ${n.name}` : n.name;
            if (n.name.includes(q)) flat.push({ ...n, full });
            if (n.children) walk(n.children, full);
          });
        })(FOLDER_TREE, '');
        if (!flat.length) {
          body.innerHTML = '<p class="folder-tree-empty">没有符合条件的文件夹</p>';
          return;
        }
        flat.forEach((n) => {
          const row = document.createElement('div');
          row.className = 'folder-tree-row';
          row.setAttribute('data-folder-row', n.id);
          row.style.paddingLeft = '23px';
          row.innerHTML = `<button class="folder-tree-item" type="button" data-folder="${n.id}" title="${n.full}"><span>${n.full}</span><b>${n.count}</b></button>`;
          body.appendChild(row);
        });
      });

      document.getElementById('folderModuleBody').addEventListener('click', (e) => {
        const t = /** @type {HTMLElement} */ (e.target);
        const caret = t.closest('[data-caret]');
        if (caret) {
          e.stopPropagation();
          const id = caret.getAttribute('data-caret');
          if (openFolderIds.has(id)) openFolderIds.delete(id); else openFolderIds.add(id);
          rebuildFolderTree();
          return;
        }
        const nodeMore = t.closest('[data-node-more]');
        if (nodeMore) {
          e.stopPropagation();
          openFolderNodeMenu(nodeMore, nodeMore.getAttribute('data-node-more'));
          return;
        }
        const item = t.closest('[data-folder]');
        if (!item) return;
        enterFolder(item.getAttribute('data-folder'));
      });

      /* 节点操作菜单（重命名 / 删除 / 移动 / 新子文件夹） */
      let openNodeMenu = null;
      function openFolderNodeMenu(btn, folderId) {
        closeNodeMenu();
        const name = FOLDER_NAME_MAP[folderId] || '文件夹';
        const menu = document.createElement('div');
        menu.className = 'folder-node-menu';
        menu.id = 'folderNodeMenu';
        menu.setAttribute('role', 'menu');
        menu.innerHTML = `
          <button type="button" role="menuitem" data-node-act="rename">重命名</button>
          <button type="button" role="menuitem" data-node-act="delete">删除</button>
          <button type="button" role="menuitem" data-node-act="move">移动</button>
          <button type="button" role="menuitem" data-node-act="new-sub">新子文件夹</button>`;
        document.body.appendChild(menu);
        const rect = btn.getBoundingClientRect();
        menu.style.top = `${Math.min(rect.bottom + 4, window.innerHeight - menu.offsetHeight - 12)}px`;
        menu.style.left = `${Math.min(rect.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 12)}px`;
        btn.classList.add('is-open');
        openNodeMenu = { btn, menu };
        menu.addEventListener('click', (ev) => {
          const actBtn = /** @type {HTMLElement} */ (ev.target).closest('[data-node-act]');
          if (!actBtn) return;
          const act = actBtn.getAttribute('data-node-act');
          const labels = { rename: '重命名', delete: '删除', move: '移动', 'new-sub': '新子文件夹' };
          toast(`演示：${labels[act]}「${name}」（原有目录管理流程，资格由服务端裁决）`);
          closeNodeMenu();
        });
        /* 点外部 / Esc 关闭 */
        setTimeout(() => {
          document.addEventListener('click', nodeMenuOutside, { capture: true });
          document.addEventListener('keydown', nodeMenuEsc);
        }, 0);
      }
      function nodeMenuOutside(ev) {
        if (openNodeMenu && !openNodeMenu.menu.contains(/** @type {Node} */ (ev.target)) && ev.target !== openNodeMenu.btn && !openNodeMenu.btn.contains(/** @type {Node} */ (ev.target))) {
          closeNodeMenu();
        }
      }
      function nodeMenuEsc(ev) {
        if (ev.key === 'Escape') closeNodeMenu();
      }
      function closeNodeMenu() {
        if (!openNodeMenu) return;
        openNodeMenu.btn.classList.remove('is-open');
        openNodeMenu.menu.remove();
        openNodeMenu = null;
        document.removeEventListener('click', nodeMenuOutside, { capture: true });
        document.removeEventListener('keydown', nodeMenuEsc);
      }

      function enterFolder(id) {
        if (!currentFolder) scopeBeforeFolder = currentScope;
        currentFolder = id;
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        openMenuId = null;
        openPop = null;
        selectedIds.clear();
        pageState.page = 1;

    /** 发起签署：hover 展开原菜单分支（PRD 2.4：直接 / 模板 / 批量创建） */
    (function bindLaunchMenu() {
      const wrap = document.getElementById('launchWrap');
      const btn = document.getElementById('launchBtn');
      if (!wrap || !btn) return;

          btn.setAttribute('aria-expanded', 'false');

      });

          btn.setAttribute('aria-expanded', 'false');

    /** 行内小浮层（收件人 +N / 等待名单）：fixed 定位，不被行投影遮挡 */
    let miniPopEl = null;
    function closeMiniPop() {
      if (miniPopEl) { miniPopEl.remove(); miniPopEl = null; }
      openPop = null;
    }
    function openMiniPop(btn, key, taskId) {
      closeMiniPop();
      openPop = { key, taskId };
      const task = TASKS.find((x) => x.id === taskId);
      if (!task) return;
      let title = '', items = '';
      if (key === 'parties') {
        title = '收件人';
        items = (task.parties || []).map((n) => `<div class="mini-popover__item"><span class="p-name">${n}</span></div>`).join('');
      } else if (key === 'waiting') {
        title = '等待处理';
        items = ((task.todo && task.todo.waiting) || []).map((w) => `<div class="mini-popover__item"><span class="p-name">${w.name}</span><span class="p-time">发送于 ${w.time}</span></div>`).join('');
      } else return;
      const pop = document.createElement('div');
      pop.className = 'mini-popover';
      pop.setAttribute('role', 'dialog');
      pop.innerHTML = `
        <div class="mini-popover__head">${title}
          <button type="button" class="mini-popover__close" data-pop-close aria-label="关闭">×</button>
        </div>
        <div class="mini-popover__list">${items}</div>`;
      document.body.appendChild(pop);
      miniPopEl = pop;
      const rect = btn.getBoundingClientRect();
      const ph = pop.offsetHeight, pw = pop.offsetWidth;
      let top = rect.bottom + 6;
      if (top + ph > window.innerHeight - 12) top = rect.top - ph - 6;
      let left = rect.left;
      if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
      pop.style.top = Math.max(12, top) + 'px';
      pop.style.left = Math.max(12, left) + 'px';
      pop.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (/** @type {HTMLElement} */ (ev.target).closest('[data-pop-close]')) closeMiniPop();
      });
    }

    /** 行更多菜单：fixed 定位锚定 ⋯ 按钮（不被 sticky 操作列遮挡/裁剪） */
    let rowMenuEl = null;
    function closeRowMenu() {
      if (rowMenuEl) { rowMenuEl.remove(); rowMenuEl = null; }
      openMenuId = null;
      const shell = document.querySelector('.envelope-table-shell');
      if (shell) shell.classList.remove('is-pop-locked');
      document.removeEventListener('click', rowMenuOutside, true);
      document.removeEventListener('keydown', rowMenuEsc);
    }
    function rowMenuOutside(ev) {
      if (rowMenuEl && !rowMenuEl.contains(/** @type {Node} */ (ev.target)) && !ev.target.closest('[data-more]')) closeRowMenu();
    }
    function rowMenuEsc(ev) { if (ev.key === 'Escape') closeRowMenu(); }
    function openRowMenu(btn, taskId) {
      closeRowMenu();
      openMenuId = taskId;
      const shell = document.querySelector('.envelope-table-shell');
      if (shell) shell.classList.add('is-pop-locked');
      const task = TASKS.find((x) => x.id === taskId);
      if (!task || !task.more || !task.more.length) return;
      const menu = document.createElement('span');
      menu.className = 'row-menu';
      menu.setAttribute('role', 'menu');
      menu.innerHTML = task.more.map((m) => `<button type="button" class="${m === '删除' ? 'danger' : ''}" data-toast="演示：${m}（原有流程，资格由服务端裁决）">${m}</button>`).join('');
      document.body.appendChild(menu);
      rowMenuEl = menu;
      const rect = btn.getBoundingClientRect();
      const mh = menu.offsetHeight, mw = menu.offsetWidth;
      let top = rect.bottom + 4;
      if (top + mh > window.innerHeight - 12) top = rect.top - mh - 4;
      menu.style.top = `${Math.max(12, top)}px`;
      menu.style.left = `${Math.max(12, Math.min(rect.right - mw, window.innerWidth - mw - 12))}px`;
      menu.addEventListener('click', () => closeRowMenu());
      setTimeout(() => {
        document.addEventListener('click', rowMenuOutside, true);
        document.addEventListener('keydown', rowMenuEsc);
      }, 0);
    }

    /** 行内交互统一委托（PRD 5.1/5.3/5.4/5.5） */
    document.getElementById('taskBody').addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      const popBtn = t.closest('[data-pop]');
      if (popBtn) {
        e.stopPropagation();
        const key = popBtn.getAttribute('data-pop');
        const taskId = popBtn.getAttribute('data-task');
        if (openPop && openPop.taskId === taskId && openPop.key === key) { closeMiniPop(); }
        else openMiniPop(popBtn, key, taskId);
        return;
      }
      if (t.closest('[data-pop-close]')) {
        closeMiniPop();
        return;
      }
      const goto = t.closest('[data-goto-folder]');
      if (goto) {
        if (!currentFolder) scopeBeforeFolder = currentScope;
        currentFolder = goto.getAttribute('data-goto-folder');
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        selectedIds.clear();
        pageState.page = 1;
        openFolderIds.add('group');
        const moduleEl = document.getElementById('folderModule');
        moduleEl.classList.add('is-open');
        rebuildFolderTree();
        render();
        return;
      }
      const moreBtn = t.closest('[data-more]');
      if (moreBtn) {
        const id = moreBtn.getAttribute('data-more');
        if (openMenuId === id) { closeRowMenu(); return; }
        openRowMenu(moreBtn, id);
        return;
      }
      const primaryBtn = t.closest('[data-primary]');
      if (primaryBtn) {
        const id = primaryBtn.getAttribute('data-primary');
        const task = TASKS.find((x) => x.id === id);
        if (!task) return;
        if (task.candidates && task.candidates.length >= 2) {
          openPartyDialog(task);
          return;
        }
        toast(`${task.primary}：${task.subject || '未命名签署任务'}（原有流程）`);
        return;
      }
      /* 点浮层外部关闭 */
      if (!t.closest('.mini-popover') && openPop) {
        closeMiniPop();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (openPop) closeMiniPop();
      if (openMenuId) closeRowMenu();
    });

    /** 选择收件人对话框（默认不选、保存禁用；取消不改变列表） */

    /** 筛选汇总（PRD 4.5：查找筛选项 + 已应用 + 可用项；内层编辑写草稿，外层保存一次查询） */
    (function bindFilterSummary() {

      const appliedBox = document.getElementById('filterSummaryApplied');
      const appliedCount = document.getElementById('filterSummaryAppliedCount');
      const availBox = document.getElementById('filterSummaryAvailable');

      /** 各列表允许的汇总字段（PRD 3.1-3.6）；key、显示名、描述 */
      function availableFields() {
        const caret = '<span class="aip-icon aip-icon--sm" aria-hidden="true"><img class="aip-icon__svg" src="assets/icons/phosphor/regular/caret-down.svg" alt="" /></span>';
        const base = [
          ['date', '日期', '签署任务日期筛选'],
          ['status', '状态', '签署任务状态筛选'],
          ['sender', '发起人', '签署任务发件人筛选'],
          ['quick', '快速视图', '按待办对象与紧急程度查看'],
          ['created-at', '发起时间', '按发起时间筛选'],
          ['deadline', '截止时间', '按截止时间筛选'],
          ['finished-at', '完成时间', '按完成时间筛选'],
          ['subject', '任务主题', '任务主题包含关键词'],
          ['task-id', '任务编号', '任务编号完整匹配'],
          ['biz-type', '业务类型', '按业务类型筛选'],
          ['recipient', '收件人', '按收件人筛选'],
          ['creator', '创建成员', '按创建成员 / 姓名筛选'],
          ['sign-template', '关联签署模板 ID', '签署模板 ID 完整匹配'],
        ];
        const caretPill = (label) => `${label} ${caret}`;
        const rows = base.map(([k, label, desc]) => [k, caretPill(label), desc]);
        if (currentNav === 'draft' || currentNav === 'completed') {
          /* 草稿 / 已完成：去掉状态与快捷 */
          return rows.filter(([k]) => !['status', 'quick'].includes(k));
        }
        if (currentNav === 'active') return rows.filter(([k]) => k !== 'status');
        if (currentNav === 'folder') return rows.filter(([k]) => !['sender', 'quick'].includes(k));
        return rows;
      }

      function renderSummary() {
        const q = /** @type {HTMLInputElement} */ (document.getElementById('filterSummarySearch')).value.trim();
        /* 已应用 chips */
        const appliedEntries = Object.keys(summaryDraft).filter((k) => summaryDraft[k]);
        appliedCard.hidden = appliedEntries.length === 0;
        appliedCount.textContent = `已应用的数量 (${appliedEntries.length})`;
        appliedBox.innerHTML = appliedEntries.map((k) => `
          <span class="filter-applied-chip" data-chip-field="${k}">
            <span>${summaryDraft[k].label}</span>
            <button type="button" data-remove-chip="${k}" aria-label="清除${FILTER_TITLES[k] || k}"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
          </span>`).join('');
        /* 可用项：已应用到卡片里的基础字段不再重复出现在列表 */
        const baseKeys = ['date', 'status', 'sender', 'quick'];
        const fields = availableFields().filter(([k, pill, desc]) => {
          if (summaryDraft[k] && baseKeys.includes(k)) return false;
          if (!q) return true;
          const text = (pill + desc).replace(/<[^>]+>/g, '');
          return text.includes(q);
        });
        availBox.innerHTML = `<h3 style="margin:0 0 6px;font-size:13px;font-weight:600;color:var(--fdd-ink-3)">可用 (${fields.length})</h3>` + (fields.length

            <div class="filter-avail-row" data-avail-field="${k}">

              <span class="filter-avail-row__desc">${desc}</span>
            </div>`).join('')
          : '<p class="filter-modal-empty" style="margin:8px 0">没有匹配的筛选项</p>');
      }

      openBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeInnerPop();
        summaryDraft = JSON.parse(JSON.stringify(activeFilters));
        document.getElementById('filterSummarySearch').value = '';
        renderSummary();
        modal.hidden = false;
        syncModalScrollLock();
      });

      document.getElementById('filterSummarySearch').addEventListener('input', renderSummary);

      /* 已应用 chip 单独删除 */
      appliedBox.addEventListener('click', (e) => {

      /* 可用项行点击：打开该字段的内层编辑浮层（应用写入草稿，外层保存统一查询） */
      let innerPop = null;
      /** @type {((ev: MouseEvent) => void) | null} */
      let innerDocClose = null;
      function closeInnerPop() {
        closeSharedDateCalFloat();
        if (innerPop) { innerPop.remove(); innerPop = null; }
        if (innerDocClose) {
          document.removeEventListener('click', innerDocClose);
          innerDocClose = null;
        }
      }
      const FIELD_OPTS = {
        date: { title: '日期', type: 'radio' },
        status: { title: '状态', type: 'radio' },
        sender: { title: '发起人', type: 'radio' },
        quick: { title: '快速视图', type: 'radio' },
        'created-at': { title: '发起时间', type: 'date' },
        'deadline': { title: '截止时间', type: 'date' },
        'finished-at': { title: '完成时间', type: 'date' },
        'subject': { title: '任务主题', type: 'text', ph: '主题包含关键词' },
        'task-id': { title: '任务编号', type: 'text', ph: '完整任务编号' },
        'biz-type': { title: '业务类型', type: 'text', ph: '业务类型' },
        'recipient': { title: '收件人', type: 'text', ph: '名称 / 手机号 / 证件号' },
        'creator': { title: '创建成员', type: 'text', ph: '成员姓名' },
        'sign-template': { title: '关联签署模板 ID', type: 'text', ph: '签署模板 ID' },
      };
      /**
       * @param {string} key
       */
      function fieldOpts(key) {
        return FIELD_OPTS[key] || null;
      }
      /**
       * 从工具栏默认筛选下拉克隆选项区 HTML，保证「可用」内层与外层内容一致。
       * @param {string} key date|status|sender|quick

       */
      function cloneOuterFilterOptionsHtml(key) {
        const outer = document.querySelector(`#filterTriggers .filter-field[data-filter="${key}"] .filter-popover`);
        if (!outer) return '';
        const clone = /** @type {HTMLElement} */ (outer.cloneNode(true));
        clone.querySelector('.filter-popover__title')?.remove();

        clone.querySelectorAll('input[type="radio"]').forEach((inp) => {

        clone.querySelectorAll('[data-scope-opt]').forEach((el) => {

        /* 允许在内层弹窗重新绑定通栏条件 */
        const opWrap = clone.querySelector('[data-date-op-wrap]');
        if (opWrap) /** @type {HTMLElement} */ (opWrap).dataset.bound = '';
        return clone.innerHTML;
      }
      /**
       * 挂载日期输入（发起时间等）：点击后弹出共享日历浮窗，选中即写入。
       * @param {HTMLElement} root 内层筛选弹窗
       * @param {string} initialISO 初始 ISO 日期
       */
      function mountLibraDatePicker(root, initialISO) {
        const field = /** @type {HTMLElement} */ (root.querySelector('.libra-dp__field'));
        const input = /** @type {HTMLInputElement} */ (root.querySelector('.libra-dp__input'));
        const hidden = /** @type {HTMLInputElement} */ (root.querySelector('#innerInput'));
        if (!field || !input || !hidden) return;
        if (initialISO) {
          hidden.value = initialISO;
          input.dataset.iso = initialISO;
          input.value = formatDateDisplay(initialISO);
        }
        const open = (e) => {
          e.stopPropagation();
          if (sharedDateCalFloat && field.classList.contains('is-open')) {
            closeSharedDateCalFloat();
            return;
          }
          openSharedDateCal(field, input);
          /* 同步 hidden，供应用写入 summaryDraft */
          const sync = () => { hidden.value = input.dataset.iso || ''; };
          input.addEventListener('change', sync);
          const obs = new MutationObserver(sync);
          obs.observe(input, { attributes: true, attributeFilter: ['data-iso'] });
        };
        field.addEventListener('click', open);
      }

      /**
       * 在可用筛选项旁打开内层编辑浮层。

      function openInnerPop(row, key) {
        closeInnerPop();
        const f = fieldOpts(key);
        if (!f) { toast(`编辑「${row.querySelector('.filter-avail-row__desc').textContent}」（原有字段编辑器）`); return; }
        const pop = document.createElement('div');
        pop.className = 'filter-inner-pop' + (f.type === 'date' ? ' filter-inner-pop--date' : '');
        const applied = summaryDraft[key];
        let body = `<h4 class="filter-inner-pop__title">${f.title}</h4>`;
        const toolbarKeys = ['date', 'status', 'sender', 'quick'];
        if (toolbarKeys.includes(key) && f.type === 'radio') {
          /* 与工具栏默认筛选下拉共用同一份选项 DOM，避免两套内容漂移 */

          body += `
