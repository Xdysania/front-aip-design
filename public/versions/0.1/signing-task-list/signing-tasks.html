      margin: 0 0 12px; padding: 10px 14px;
      border: 1px solid var(--fdd-line); border-radius: 10px;
      background: #fff; color: var(--fdd-ink); font-size: 13px;
      box-shadow: var(--fdd-shadow-menu);
      animation: nsBatchIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes nsBatchIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .batch-bar.is-on { display: flex; }
    #batchCount {
      color: var(--fdd-ink-2); font-weight: 500; margin-right: 4px;
      white-space: nowrap; flex-shrink: 0;
    }
    .batch-bar__actions {
      display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
    }
    .batch-bar .batch-btn {
      height: 32px; padding: 0 12px;
      border: 0; border-radius: 8px;
      background: var(--fdd-bg-muted); color: var(--fdd-ink);
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    }
    .batch-bar .batch-btn:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .batch-bar .batch-btn--more {
      width: 32px; padding: 0;
      display: inline-grid; place-items: center;
      color: var(--fdd-ink-2);
    }
    .batch-bar .batch-btn--more:hover { color: var(--fdd-ink); }
    .batch-more-wrap { position: relative; display: inline-flex; }
    .batch-more-menu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
      min-width: 160px; padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 8px;
      background: #fff; box-shadow: var(--fdd-shadow-menu);
    }
    .batch-more-menu[hidden] { display: none !important; }
    .batch-more-menu button {
      width: 100%; height: 32px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; border-radius: 6px; background: transparent;
      text-align: left; font-size: 13px; color: var(--fdd-ink); cursor: pointer;
    }
    .batch-more-menu button:hover { background: var(--fdd-bg-hover); }

    /* —— AIP 0.1：状态列待办 / 等待 / 进度 —— */
    .envelope-state { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .todo-text {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 12px; line-height: 17px;
    }
    .todo-text--mine { color: var(--fdd-brand); font-weight: 600; }
    .todo-text--waiting {
      color: var(--fdd-brand);
      border-bottom: 1px dashed rgba(0, 89, 239, 0.5); cursor: pointer;
    }
    .todo-text--plain { color: var(--fdd-ink-2); }
    .envelope-progress-label {
      display: flex; justify-content: space-between; width: 100%;
      color: var(--fdd-ink-3); font-size: 11px; line-height: 14px;
    }
    .envelope-state.is-completed .status-check {
      flex-shrink: 0; width: 20px; height: 20px; color: var(--fdd-success);
    }
    .envelope-state.is-completed .todo-text { border-bottom: 0; font-size: 14px; line-height: 20px; }

    /* —— AIP 0.1：行内浮层（收件人名单 / 等待名单） —— */
    .pop-wrap { position: relative; display: inline-block; max-width: 100%; z-index: 5; }
    .mini-popover {
      position: fixed; z-index: 95;
      display: flex; flex-direction: column;
      box-sizing: border-box;
      width: 280px;
      /* 根节点统一左右内边距，标题与列表共用，避免贴边 */
      padding: 12px 20px 10px;
      border: 1px solid var(--fdd-line-strong); border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(28, 43, 51, 0.08), 0 12px 32px rgba(28, 43, 51, 0.18), 0 28px 72px rgba(28, 43, 51, 0.14);
      animation: nsPopoverIn 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: top left;
    }
    @keyframes nsPopoverIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .mini-popover[hidden] { display: none !important; }
    .mini-popover__head {
      display: flex; align-items: center; justify-content: space-between;
      box-sizing: border-box;
      margin: 0 -20px 0; padding: 0 20px 15px;
      border-bottom: 1px solid var(--fdd-line-soft);
      font-size: 13px; font-weight: 600; color: var(--fdd-ink);
    }
    .mini-popover__close {
      width: 24px; height: 24px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-3); font-size: 14px; cursor: pointer;
      flex-shrink: 0;
    }
    .mini-popover__close:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .mini-popover__list {
      display: block; box-sizing: border-box;
      max-height: 260px; overflow: auto;
      margin: 0; padding: 4px 0 0;
      scrollbar-width: thin; scrollbar-color: rgba(28, 43, 51, 0.18) transparent;
    }
    .mini-popover__item {
      display: block; box-sizing: border-box;
      padding: 10px 0;
      border-bottom: 1px solid var(--fdd-line-soft);
    }
    .mini-popover__item:last-child { border-bottom: 0; }
    .mini-popover__item .p-name { display: block; color: var(--fdd-ink); font-size: 13px; line-height: 18px; }
    .mini-popover__item .p-time { display: block; color: var(--fdd-ink-3); font-size: 12px; line-height: 16px; margin-top: 2px; }
    .party-more-btn {
      padding: 0 2px; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .party-more-btn:hover { text-decoration: underline; }
    .folder-link {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink-2); font-size: 14px; cursor: pointer;
    }
    .folder-link:hover { color: var(--fdd-brand); text-decoration: underline; }

    /* —— AIP 0.1：筛选汇总模态 / 选择收件人 / 原有页面承载 —— */
    body.is-modal-open { overflow: hidden; }
    .envelope-table-shell.is-pop-locked { overflow: hidden !important; }
    .ns-modal-mask {
      position: fixed; inset: 0; z-index: 80;
      display: grid; place-items: center;
      background: rgba(28, 43, 51, 0.42);
      animation: nsMaskIn 0.16s ease;
    }
    .ns-modal-mask[hidden] { display: none !important; }
    @keyframes nsMaskIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .ns-modal {
      width: 560px; max-width: calc(100vw - 48px); max-height: calc(100vh - 96px);
      display: flex; flex-direction: column;
      border-radius: 8px; background: #fff;
      box-shadow: 0 12px 40px rgba(28, 43, 51, 0.24);
      animation: nsModalIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes nsModalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ns-modal--wide { width: 640px; }
    .ns-modal__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .ns-modal__head h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 26px; }
    .ns-modal__close {
      width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .ns-modal__close svg { display: block; width: 14px; height: 14px; }
    .ns-modal__close:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .ns-modal__body { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 8px; }
    .ns-modal__foot {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px;
      padding: 12px 20px 16px; border-top: 1px solid var(--fdd-line-soft);
    }
    .ns-modal__foot--split { justify-content: space-between; }
    .ns-modal__foot-right { display: inline-flex; gap: 8px; }
    .ns-modal__foot .btn-ghost {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-bg-muted); color: var(--fdd-ink); font-size: 14px; font-weight: 600;
    }
    .ns-modal__foot .btn-ghost:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .ns-modal__foot .btn-solid {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-brand); color: #fff; font-size: 14px; font-weight: 600;
    }
    .ns-modal__foot .btn-solid:hover { background: var(--fdd-brand-hover); }
    .ns-modal__foot .btn-solid:disabled { opacity: 0.45; cursor: not-allowed; }

    .ns-modal--filter { width: 480px; }
    .filter-applied-card {
      margin-bottom: 14px; padding: 12px 14px;
      border-radius: 8px; background: var(--fdd-bg-muted);
    }
    .filter-applied-card__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; font-size: 14px; font-weight: 600; color: var(--fdd-ink);
    }
    .filter-applied-card__clearall {
      /* 幽灵按钮：去边框、透明底、文字弱化，hover 浅灰底 */
      height: 30px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink); font-size: 13px; cursor: pointer;
      font-weight: 400;
    }
    .filter-applied-card__clearall:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .filter-applied-card__clearall .aip-icon { color: inherit; }
    .filter-applied-card__chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-applied-chip {
      height: 30px; padding: 0 0 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: var(--fdd-radius); background: #fff;
      border: 1px solid var(--fdd-line); color: var(--fdd-ink); font-size: 13px;
      overflow: hidden;
    }
    .filter-applied-chip button {
      width: 28px; height: 100%; border: 0; border-radius: 0;
      background: transparent; color: var(--fdd-ink); cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
      border-left: 1px solid var(--fdd-line);
    }
    .filter-applied-chip button svg { display: block; width: 12px; height: 12px; }
    .filter-applied-chip button:hover { background: var(--fdd-bg-hover-strong, #e8ebef); color: var(--fdd-ink); }
    .filter-avail-row {
      width: 100%; padding: 6px 10px;
      display: flex; align-items: center; gap: 14px;
      background: transparent;
    }
    .filter-avail-row__pill {
      flex-shrink: 0; height: 32px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 13px; cursor: pointer;
    }
    .filter-avail-row__pill:hover { background: var(--fdd-bg-hover); border-color: var(--fdd-line-strong); }
    .filter-avail-row__pill .aip-icon { color: var(--fdd-ink-2); }
    .filter-avail-row__desc { color: var(--fdd-ink-3); font-size: 13px; }
    /* 筛选面板内层编辑浮层（需高于 .ns-modal-mask:z-index 80，否则会被遮罩挡住） */
    .filter-inner-pop {
      position: fixed; z-index: 100;
      min-width: 240px; padding: 14px 14px 10px;
      border: 1px solid var(--fdd-line); border-radius: 8px;
      background: #fff; box-shadow: 0 8px 28px rgba(28, 43, 51, 0.2);
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .filter-inner-pop[hidden] { display: none !important; }
    .filter-inner-pop__title { margin: 0 0 16px; font-size: 15px; font-weight: 700; }
    .filter-inner-pop .filter-popover__options { margin-bottom: 12px; }
    .filter-inner-pop__input {
      width: 100%; height: 34px; padding: 0 10px; box-sizing: border-box;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      font-size: 14px; color: var(--fdd-ink); outline: none; margin-bottom: 12px;
    }
    .filter-inner-pop__input:focus { border-color: var(--fdd-brand); box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16); }
    .filter-inner-pop__actions { display: flex; justify-content: flex-end; gap: 8px; }
    .filter-inner-pop__actions button {
      height: 30px; padding: 0 12px; border: 0; border-radius: var(--fdd-radius);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .filter-inner-pop__cancel { background: var(--fdd-bg-muted); color: var(--fdd-ink); }
    .filter-inner-pop__apply { background: var(--fdd-brand); color: #fff; }
    .filter-inner-pop__apply:hover { background: var(--fdd-brand-hover); }

    /*
     * 日期筛选：内层弹窗沿用 .filter-inner-pop 下拉样式；
     * 点输入后再弹出日历浮窗（形态同 .filter-popover），选中即写入。
     */
    .filter-inner-pop--date { width: 320px !important; }
    .filter-inner-pop--date .libra-dp { margin-bottom: 12px; }
    .libra-dp__field {
      position: relative; display: flex; align-items: center;
      height: 34px; padding: 0 6px 0 10px; box-sizing: border-box;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; cursor: pointer;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .libra-dp__field:hover { border-color: var(--fdd-ink-3); }
    .libra-dp__field.is-open,
    .libra-dp__field:focus-within {
      border-color: var(--fdd-brand);
      box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16);
    }
    .libra-dp__field input {
      flex: 1; min-width: 0; height: 100%; border: 0; outline: 0;
      background: transparent; color: var(--fdd-ink); font-size: 14px; cursor: pointer;
    }
    .libra-dp__field input::placeholder { color: var(--fdd-ink-3); }
    .libra-dp__cal-ico {
      flex-shrink: 0; width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-2); cursor: pointer;
      display: grid; place-items: center;
    }
    .libra-dp__cal-ico:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    /* 日历浮窗：对齐筛选下拉 .filter-popover */
    .libra-dp__float {
      position: fixed; z-index: 200;
      width: 280px; padding: 12px;
      border-radius: 6px; background: #fff;
      box-shadow: 0 4px 16px rgba(28, 43, 51, 0.18);
      color: var(--fdd-ink);
      isolation: isolate;
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .libra-dp__float[hidden] { display: none !important; }
    /* 范围选择：必须盖过单月 width:280，容纳双月历 */
    .libra-dp__float.libra-dp__float--range {
      width: 552px;
      max-width: calc(100vw - 16px);
      padding: 12px 14px 10px;
      background: #fff;
      overflow: visible;
    }
    .libra-dp__range-panels {
      display: flex; flex-direction: row; flex-wrap: nowrap;
      gap: 16px; align-items: flex-start;
    }
    .libra-dp__panel {
      width: 252px; flex: 0 0 252px; min-width: 252px;
      background: #fff;
    }
    .libra-dp__panel .libra-dp__nav { margin-bottom: 6px; }
    .libra-dp__float[data-place="below"]::before,
    .libra-dp__float[data-place="above"]::before {
      content: ""; position: absolute; left: 22px;
      width: 10px; height: 10px; background: #fff;
      border-left: 1px solid rgba(28, 43, 51, 0.08);
      border-top: 1px solid rgba(28, 43, 51, 0.08);
    }
    .libra-dp__float[data-place="below"]::before {
      top: -5px; transform: rotate(45deg);
    }
    .libra-dp__float[data-place="above"]::before {
      bottom: -5px; transform: rotate(225deg);
    }
    .libra-dp__float--range[data-place="below"]::before,
    .libra-dp__float--range[data-place="above"]::before {
      left: 28px;
    }
    .libra-dp__nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .libra-dp__month {
      border: 0; background: transparent; padding: 2px 0;
      font-size: 14px; font-weight: 600; color: var(--fdd-ink); cursor: default;
    }
    .libra-dp__nav-btns { display: inline-flex; gap: 2px; }
    .libra-dp__nav-btn {
      width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-2); cursor: pointer;
      display: grid; place-items: center;
    }
    .libra-dp__nav-btn:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .libra-dp__week {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      margin-bottom: 2px;
    }
    .libra-dp__week span {
      height: 28px; display: grid; place-items: center;
      font-size: 12px; color: var(--fdd-ink-3); font-weight: 500;
    }
    .libra-dp__grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      background: #fff;
    }
    .libra-dp__day {
      height: 32px; border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 13px; cursor: pointer;
    }
    .libra-dp__day:hover { background: var(--fdd-bg-hover); }
    .libra-dp__day.is-muted { color: var(--fdd-ink-3); }
    .libra-dp__day.is-today { box-shadow: inset 0 0 0 1px var(--fdd-brand); color: var(--fdd-brand); }
    /* 图1规范：选中日为品牌蓝描边，非实心填充 */
    .libra-dp__day.is-selected {
      background: transparent; color: var(--fdd-brand); font-weight: 600;
      box-shadow: inset 0 0 0 1.5px var(--fdd-brand);
    }
    .libra-dp__day.is-selected:hover { background: var(--fdd-brand-soft); color: var(--fdd-brand); }
    .libra-dp__foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--fdd-line-soft);
      background: #fff;
    }
    .libra-dp__foot button {
      height: 28px; padding: 0 8px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-brand); font-size: 13px;
      font-weight: 500; cursor: pointer;
    }
    .libra-dp__foot button:hover { background: var(--fdd-brand-soft); }
    html[data-shell="libra"] .libra-dp__float {
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--lt-shadow-button, 0 4px 16px rgba(28, 43, 51, 0.18));
    }
    html[data-shell="libra"] .libra-dp__field,
    html[data-shell="libra"] .libra-dp__day,
    html[data-shell="libra"] .libra-dp__nav-btn,
    html[data-shell="libra"] .libra-dp__cal-ico,
    html[data-shell="libra"] .libra-dp__foot button { border-radius: 8px; }
    html[data-shell="libra"] .libra-dp__day.is-in-range { border-radius: 0; }
    @media (max-width: 640px) {
      .libra-dp__float.libra-dp__float--range {
        width: min(294px, calc(100vw - 16px));
      }
      .libra-dp__range-panels { flex-direction: column; gap: 10px; }
      .libra-dp__panel { width: 100%; flex: none; min-width: 0; }
    }
    .filter-modal-search {
      position: relative; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 10px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
    }
    .filter-modal-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }
    .filter-modal-group { margin-bottom: 12px; }
    .filter-modal-group > h3 {
      margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--fdd-ink-3);
    }
    .filter-modal-item {
      width: 100%; min-height: 34px; height: auto; padding: 6px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 14px; text-align: left; cursor: pointer;
    }
    .filter-modal-item:hover { background: var(--fdd-bg-hover); }
    .filter-modal-item .val { color: var(--fdd-ink-3); font-size: 13px; }
    .filter-modal-empty { margin: 24px 0; text-align: center; color: var(--fdd-ink-3); font-size: 13px; }
    .filter-modal-clearall {
      border: 0; background: transparent; color: var(--fdd-brand);
      font-size: 13px; cursor: pointer; padding: 0;
    }
    .filter-modal-clearall:hover { text-decoration: underline; }

    .party-dialog-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .party-dialog-table th, .party-dialog-table td {
      padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--fdd-line-soft);
    }
    .party-dialog-table th { color: var(--fdd-ink-3); font-weight: 500; }
    .party-dialog-table input { width: 16px; height: 16px; margin: 0; accent-color: var(--fdd-brand); }
    .party-dialog-scroll { max-height: 320px; overflow: auto; }

    .legacy-page {
      display: none; padding: 64px 0; text-align: center;
    }
    body[data-page-mode="legacy"] .contracts-workspace { display: none; }
    .legacy-page.is-on { display: block; }
    .legacy-page h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; color: var(--fdd-ink); }
    .legacy-page p { margin: 0 auto 20px; max-width: 520px; color: var(--fdd-ink-3); font-size: 14px; line-height: 22px; }
    .legacy-page .legacy-back {
      height: 32px; padding: 0 14px; border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 14px; font-weight: 600;
    }
    .legacy-page .legacy-back:hover { background: var(--fdd-bg-hover); }
    #pageTotal { color: var(--fdd-ink-3); margin-right: 8px; }
    #pageInfo { color: var(--fdd-ink); margin-right: 4px; }
    #pageInfo b { font-weight: 600; }
    /* —— 列设置（PRD 5.6） —— */
    .col-settings-th { text-align: right; }
    .col-settings-btn {
      width: 32px; height: 32px; margin-left: auto;
      display: inline-grid; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink-2);
      cursor: pointer;
    }
    .col-settings-btn:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .ns-modal--col { width: 460px; }
    .col-modal-tip { margin: 0 0 12px; color: var(--fdd-ink-3); font-size: 13px; line-height: 20px; }
    .ns-modal--sm { width: 420px; }
    .ns-field { display: block; margin-bottom: 14px; }
    .ns-field__label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--fdd-ink-2); }
    .ns-field__input {
      width: 100%; height: 36px; padding: 0 10px; box-sizing: border-box;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      font-size: 14px; color: var(--fdd-ink); background: #fff; outline: none;
    }
    .ns-field__input:focus { border-color: var(--fdd-brand); box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16); }
    .ns-field__error { margin: 4px 0 0; color: var(--fdd-danger); font-size: 12px; }

    /* —— LibraTech 风：新建文件夹弹窗 & 自定义下拉（参考 app.libratech.ai） —— */
    #newFolderModal {
      --libra-ink: #161a1b;
      --libra-ink-2: #57514b;
      --libra-placeholder: #888989;
      --libra-bg-layer: #ffffff;
      --libra-bg-sunken: #f4f4f4;
      --libra-bg-hover: #e9eaea;
      --libra-line: #e9eaea;
      --libra-radius: 8px;
      --libra-font: "Fakt Pro", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #newFolderModal .ns-modal {
      border-radius: 12px; background: var(--libra-bg-layer);
      box-shadow: 0 4px 16px rgba(22, 26, 27, 0.12), 0 0 0 0.5px var(--libra-line);
      font-family: var(--libra-font);
    }
    #newFolderModal .ns-modal__head { padding: 18px 20px 4px; }
    #newFolderModal .ns-modal__head h2 { font-size: 16px; font-weight: 600; color: var(--libra-ink); }
    #newFolderModal .ns-modal__body { padding: 8px 20px 12px; }
    #newFolderModal .ns-field__label { font-size: 13px; font-weight: 500; color: var(--libra-ink); margin-bottom: 6px; }
    /* 输入框：灰底无边框，focus 出 ring（libra input） */
    #newFolderModal .ns-field__input {
      height: 36px; border: 0; border-radius: var(--libra-radius);
      background: var(--libra-bg-sunken); color: var(--libra-ink); font-size: 14px;
      padding: 0 12px; transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    #newFolderModal .ns-field__input:hover { background: var(--libra-bg-hover); }
    #newFolderModal .ns-field__input:focus {
      background: var(--libra-bg-layer);
      box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.28);
    }
    #newFolderModal .ns-field__input::placeholder { color: var(--libra-placeholder); }
    #newFolderModal .ns-modal__foot { border-top: 0; padding: 8px 20px 18px; }
    #newFolderModal .ns-modal__foot .btn-ghost,
    #newFolderModal .ns-modal__foot .btn-solid {
      height: 32px; padding: 0 14px; border-radius: var(--libra-radius);
      font-size: 14px; font-weight: 500; border: 0; cursor: pointer;
      transition: background 0.12s ease;
    }
    #newFolderModal .ns-modal__foot .btn-ghost { background: transparent; color: var(--libra-ink); }
    #newFolderModal .ns-modal__foot .btn-ghost:hover { background: var(--libra-bg-sunken); }
    /* 主按钮：法大大品牌蓝（AIP 主色，覆盖原 Libra 纯黑） */
    #newFolderModal .ns-modal__foot .btn-solid { background: var(--fdd-brand); color: #fff; }
    #newFolderModal .ns-modal__foot .btn-solid:hover { background: var(--fdd-brand-hover); }
    #newFolderModal .ns-modal__foot .btn-solid:disabled { background: var(--libra-bg-sunken); color: var(--libra-placeholder); opacity: 1; }

    /* 自定义下拉（libra dropdown）：Trigger + 弹层 */
    .libra-select { position: relative; }
    .libra-select__trigger {
      width: 100%; height: 36px; padding: 0 8px 0 12px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border: 0; border-radius: var(--libra-radius); background: var(--libra-bg-sunken);
      color: var(--libra-ink); font-size: 14px; font-family: var(--libra-font);
      cursor: pointer; outline: none; text-align: left;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .libra-select__trigger:hover { background: var(--libra-bg-hover); }
    .libra-select__trigger:focus-visible,
    .libra-select.is-open .libra-select__trigger {
      background: var(--libra-bg-layer);
      box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.28);
    }
    .libra-select__value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .libra-select__value.is-placeholder { color: var(--libra-placeholder); }
    .libra-select__caret { flex-shrink: 0; color: var(--libra-ink-2); display: grid; place-items: center; transition: transform 0.15s ease; }
    .libra-select.is-open .libra-select__caret { transform: rotate(180deg); }
    .libra-select__pop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
      min-width: 140px; max-height: min(70vh, 320px); overflow-y: auto;
      display: flex; flex-direction: column; padding: 4px;
      border: 0.5px solid var(--libra-line); border-radius: var(--libra-radius);
      background: var(--libra-bg-layer); box-shadow: 0 4px 16px rgba(22, 26, 27, 0.09);
      animation: libraSelectIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .libra-select__pop[hidden] { display: none !important; }
    @keyframes libraSelectIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .libra-select__opt {
      width: 100%; min-height: 36px; height: 36px; padding: 8px; box-sizing: border-box;
      display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--libra-radius); background: transparent;
      color: var(--libra-ink); font-size: 14px; font-family: var(--libra-font);
      text-align: left; cursor: pointer; outline: none;
    }
    .libra-select__opt:hover,
    .libra-select__opt.is-active { background: var(--libra-bg-sunken); }
    .libra-select__opt .aip-icon { color: var(--libra-ink-2); flex-shrink: 0; }
    .libra-select__opt .opt-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .libra-select__opt .opt-check { flex-shrink: 0; color: var(--libra-ink); display: none; place-items: center; }
    .libra-select__opt.is-selected .opt-check { display: grid; }

    .folder-picker-tree {
      max-height: 300px; overflow: auto; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: rgba(28, 43, 51, 0.18) transparent;
    }
    .folder-picker-item {
      width: 100%; height: 36px; padding: 0 8px;
      display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 14px; text-align: left; cursor: pointer;
    }
    .folder-picker-item:hover { background: var(--fdd-bg-hover); }
    .folder-picker-item.is-selected { background: rgba(0, 89, 239, 0.1); color: var(--fdd-brand); font-weight: 600; }
    .folder-picker-item .aip-icon { color: var(--fdd-ink-3); flex-shrink: 0; }
    .folder-picker-item.is-selected .aip-icon { color: var(--fdd-brand); }
    .folder-picker-empty { padding: 24px 0; text-align: center; color: var(--fdd-ink-3); font-size: 13px; }
    .col-modal-search { margin-bottom: 10px; }
    .col-modal-list { list-style: none; margin: 0; padding: 0; }
    .col-modal-item {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 8px;
      border-radius: var(--fdd-radius);
    }
    .col-modal-item:hover { background: var(--fdd-bg-hover); }
    .col-modal-item input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--fdd-brand); }
    .col-modal-item .col-name { flex: 1; font-size: 14px; color: var(--fdd-ink); }
    .col-modal-item .col-fixed-note { font-size: 12px; color: var(--fdd-ink-3); }
    .col-modal-drag {
      width: 24px; height: 24px; margin-left: auto; flex-shrink: 0;
      display: inline-grid; place-items: center;
      border: 0; background: transparent; color: var(--fdd-ink-3);
      cursor: grab; border-radius: var(--fdd-radius);
      touch-action: none;
    }
    .col-modal-item:hover .col-modal-drag { color: var(--fdd-ink); }
    .col-modal-drag:active { cursor: grabbing; }
    .col-modal-item.is-dragging { opacity: 0.35; }
    /* 落点指示：伪元素画通栏直线，避免 inset box-shadow 贴圆角变成弯钩 */
    .col-modal-item.is-drop-target,
    .col-modal-item.is-drop-target-below {
      position: relative;
      box-shadow: none;
    }
    .col-modal-item.is-drop-target::before,
    .col-modal-item.is-drop-target-below::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 1px;
      background: var(--fdd-brand);
      pointer-events: none;
      z-index: 1;
    }
    .col-modal-item.is-drop-target::before { top: 0; }
    .col-modal-item.is-drop-target-below::after { bottom: 0; }
    /* 拖拽幽灵预览：跟随指针的整行卡片 */
    .col-modal-drag-ghost {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 8px; box-sizing: border-box;
      border-radius: 8px; background: #fff;
      border: 1px solid var(--fdd-line-strong, var(--fdd-line));
      box-shadow: 0 8px 24px rgba(28, 43, 51, 0.14), 0 2px 6px rgba(28, 43, 51, 0.08);
      opacity: 0.96;
      pointer-events: none;
    }
    .col-modal-drag-ghost input { accent-color: var(--fdd-brand); }
    .col-modal-drag-ghost .col-name { flex: 1; font-size: 14px; color: var(--fdd-ink); }
    .col-modal-drag-ghost .col-modal-drag { color: var(--fdd-ink-2); }
    /* 禁止文本/链接被当成拖拽内容（避免文字重影） */
    .col-modal-item, .col-modal-item * { user-select: none; -webkit-user-drag: none; }
    .col-modal-item[draggable="true"] { -webkit-user-drag: element; }
    .col-modal-reset {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; cursor: pointer;
    }
    .col-modal-reset:hover { text-decoration: underline; }
    .col-aux { color: var(--fdd-ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 160px; }
    th.is-sortable { cursor: pointer; user-select: none; }
    th .sort-ico { display: inline-block; width: 12px; font-size: 10px; color: var(--fdd-ink-3); }

    /* —— Table：贴合 DocuSign 列表，无投影、无卡片圆角 —— */
    .envelope-table-shell {
      position: relative;
      width: 100%;
      border: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: none;
      overflow: auto;
      max-height: clamp(300px, calc(100vh - 320px), 620px);
      border-bottom: 1px solid var(--fdd-line);
    }
    .envelope-table {
      width: 100%; min-width: 100%; border-collapse: separate; border-spacing: 0;
      background: #fff; font-size: 14px; line-height: 19.6px;
    }
    /* 表头纵向置顶，层级必须高于操作列 sticky，避免上下滚动时操作按钮盖过表头 */
    .envelope-table thead { position: sticky; top: 0; z-index: 5; background: #fff; }
    .envelope-table th,
    .envelope-table td {
      padding: 0 16px; text-align: left;
      border-bottom: 1px solid var(--fdd-line);
      vertical-align: middle;
    }
    .envelope-table thead tr { height: var(--fdd-table-head-h); }
    .envelope-table tbody tr { height: var(--fdd-table-row-h); }
    /* 行 hover：整行（含 sticky 操作列）统一浅底 */
    .envelope-table tbody tr { transition: background-color 0.12s; }
    .envelope-table tbody tr:hover td,
    .envelope-table tbody tr:hover td:last-child {
      background: var(--fdd-bg-hover);
    }
    .envelope-table th {
      font-weight: 500; color: var(--fdd-table-head-color, var(--fdd-ink)); background: #fff;
    }
    .envelope-table th:first-child,
    .envelope-table td:first-child { width: 48px; min-width: 48px; }
    /*
     * 操作列 sticky：左侧立面用 ::before。
     * 注意：tbody td 默认 overflow:hidden 会裁掉伸出的 ::before，故操作列必须 visible，
     * 否则「投影」只在表头（th 无 overflow:hidden）看得见。
     */
    .envelope-table th:last-child,
    .envelope-table td:last-child {
      width: 148px; min-width: 148px; max-width: 200px; text-align: right;
      position: sticky; right: 0;
      background: #fff;
      box-shadow: none;
      overflow: visible;
    }
    .envelope-table td:last-child { z-index: 1; }
    .envelope-table th:last-child {
      z-index: 6;
      /* 仅靠 border-bottom 画分隔线；勿再叠 0 1px box-shadow，否则表头底线会变粗 */
    }
    .envelope-table th:last-child::before,
    .envelope-table td:last-child::before {
      content: "";
      position: absolute;
      /* 上下贴齐单元格内沿，避免与 border-bottom 叠色变粗 */
      top: 0;
      bottom: 0;
      left: -12px;
      width: 12px;
      background: linear-gradient(to right, rgba(28, 43, 51, 0), rgba(28, 43, 51, 0.1));
      pointer-events: none;
      z-index: 0;
    }
    .envelope-table-shell:not(.is-scrolled-x) .envelope-table th:last-child::before,
    .envelope-table-shell:not(.is-scrolled-x) .envelope-table td:last-child::before {
      opacity: 0.35;
    }
    .envelope-table-shell.is-scrolled-x .envelope-table th:last-child::before,
    .envelope-table-shell.is-scrolled-x .envelope-table td:last-child::before {
      opacity: 1;
    }
    .envelope-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .envelope-table td:last-child {
      overflow: visible;
      text-overflow: clip;
    }
    .envelope-table td:nth-child(2) { white-space: normal; }

    .envelope-name {
      max-width: 100%; padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-weight: 500; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .envelope-name:hover { text-decoration: underline; }
    .envelope-table td small {
      display: block; margin-top: 2px;
      color: var(--fdd-ink-muted); font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .envelope-state { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .envelope-track {
      position: relative; width: 100%; height: var(--fdd-progress-h);
      border-radius: var(--fdd-progress-radius); background: rgba(28, 43, 51, 0.24); overflow: hidden;
    }
    .envelope-track i {
      position: absolute; inset: 0 auto 0 0; background: var(--fdd-brand);
    }
    .envelope-state button {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 12px; line-height: 17px;
      border-bottom: 1px dashed rgba(28, 43, 51, 0.5);
    }
    .time-cell span { display: block; }
    .time-cell small { margin-top: 0; }
    .row-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 0; }
    /* 默认：空心（催办 / 继续编辑 / 查看） */
    .resend-button {
      height: 32px; padding: 0 12px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-weight: 600; font-size: 14px;
    }
    .resend-button:hover { background: var(--fdd-bg-hover); }
    /* 仅「处理」：实心主按钮 */
    .resend-button.is-solid {
      border-color: var(--fdd-brand);
      background: var(--fdd-brand); color: #fff;
    }
    .resend-button.is-solid:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }
    /* 状态列：已完成（对齐 agreements.html：绿勾 + 文案，无进度条） */
    .envelope-state.is-completed {
      flex-direction: row; align-items: center; gap: 8px;
    }
    .envelope-state.is-completed .status-check {
      flex-shrink: 0; width: 20px; height: 20px; color: var(--fdd-success);
    }
    .envelope-state.is-completed button {
      border-bottom: 0; font-size: 14px; line-height: 20px; font-weight: 400;
    }
    .more-wrap { position: relative; }
    .more-button {
      width: 32px; height: 32px; margin-left: 4px;
      display: inline-grid; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink);
    }
    .more-button:hover { background: var(--fdd-bg-hover); }
    .row-menu {
      position: fixed; z-index: 90;
      width: max-content; min-width: 0; max-width: min(240px, calc(100vw - 24px)); padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 6px;
      background: #fff;
      box-shadow: var(--fdd-shadow-menu);
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .row-menu button {
      width: 100%; height: 32px; padding: 0 12px;
      display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; font-size: 13px; white-space: nowrap;
    }
    .row-menu button:hover { background: #f1f4f6; }
    .row-menu button.danger { color: var(--fdd-danger); }

    .envelope-pagination {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; color: var(--fdd-ink); font-size: 13px;
    }
    /* 分页下拉：缩小，放左侧 */
    .page-size {
      position: relative; display: inline-flex; align-items: center; order: 0;
    }
    .page-size-trigger {
      appearance: none; -webkit-appearance: none;
      height: 28px; min-width: 84px; margin: 0;
      padding: 0 28px 0 10px;
      display: inline-flex; align-items: center;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink);
      font-size: 13px; font-weight: 400; line-height: 20px;
      white-space: nowrap; cursor: pointer; text-align: left;
    }
    .page-size-trigger:hover { border-color: var(--fdd-ink); }
    .page-size-trigger:focus-visible {
      outline: 2px solid var(--fdd-brand); outline-offset: 2px;
    }
    .page-size > .caret {
      position: absolute; right: 6px; top: 50%;
      width: 16px; height: 16px; margin-top: -8px;
      color: var(--fdd-ink); pointer-events: none;
    }
    .page-size.is-open .page-size-trigger {
      border-color: var(--fdd-brand);
      box-shadow: var(--fdd-shadow-dropdown);
    }
    .page-size-menu {
      position: absolute; left: 0; right: auto; bottom: calc(100% + 4px); z-index: 30;
      min-width: 100%; padding: 4px 0;
      border: 1px solid var(--fdd-line); border-radius: var(--fdd-radius);
      background: #fff;
      box-shadow: var(--fdd-shadow-menu);
      display: none;
    }
    .page-size.is-open .page-size-menu { display: block; }
    .page-size-menu button {
      width: 100%; height: 28px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 13px; line-height: 20px; text-align: left;
      white-space: nowrap; cursor: pointer;
    }
    .page-size-menu button:hover { background: var(--fdd-brand-soft); }
    .page-size-menu button.is-selected { background: var(--fdd-brand-soft); font-weight: 500; }
    .pager-btns { display: inline-flex; gap: 4px; align-items: center; order: 0; margin-left: auto; }
    .pager-btns button {
      width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink);
    }
    .pager-btns button:disabled { opacity: 0.25; cursor: not-allowed; }
    .pager-btns button:not(:disabled):hover { background: var(--fdd-bg-hover); }

    .toast {
      /* LibraTech 风：底部居中深色 pill，白字，从下方滑入 */
      position: fixed; left: 50%; bottom: 24px; z-index: 120;
      padding: 10px 18px; border-radius: 8px; border: 0;
      background: #161a1b; color: #fff; font-size: 14px; font-weight: 500;
      box-shadow: 0 12px 28px 0 rgba(22, 26, 27, 0.14);
      opacity: 0; transform: translate(-50%, 8px);
      transition: opacity 0.18s ease, transform 0.18s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* —— 皮肤比对切换器 —— */
    /* —— 皮肤 / 场景切换：吸附屏幕左缘的把手，悬浮滑出面板 —— */
    .dev-switchers {
      position: fixed; left: 0; bottom: 88px; z-index: 60;
    }
    .dev-handle {
      width: 22px; height: 64px;
      display: grid; place-items: center;
      border: 1px solid var(--fdd-line); border-left: 0;
      border-radius: 0 8px 8px 0;
      background: #fff; color: var(--fdd-ink-3);
      box-shadow: 2px 2px 12px rgba(28, 43, 51, 0.10); cursor: pointer;
      transition: color 0.15s;
    }
    .dev-handle:hover { color: var(--fdd-brand); }
    .dev-handle svg { display: block; }
    .dev-panel {
      position: absolute; left: 0; bottom: -8px;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px;
      border: 1px solid var(--fdd-line); border-left: 0;
      border-radius: 0 10px 10px 0;
      background: #fff;
      box-shadow: 4px 4px 20px rgba(28, 43, 51, 0.14);
      transform: translateX(calc(-100% - 24px));
      transition: transform 0.18s ease;
      pointer-events: none;
    }
    .dev-switchers:hover .dev-panel,
    .dev-switchers:focus-within .dev-panel {
      transform: translateX(22px);
      pointer-events: auto;
    }
    .skin-switcher {
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      font-size: 12px; color: var(--fdd-ink-2);
    }
    .skin-switcher strong { color: var(--fdd-ink); font-weight: 600; margin-right: 2px; min-width: 28px; flex-shrink: 0; }
    .skin-switcher button {
      height: 28px; padding: 0 10px; border: 1px solid var(--fdd-line);
      border-radius: 4px; background: #fff; color: var(--fdd-ink); font-size: 12px;
      white-space: nowrap; flex-shrink: 0;
    }
    .skin-switcher button.is-on {
      border-color: var(--fdd-brand); background: var(--fdd-brand); color: #fff;
    }
    /* 首页（#home）不显示切换器 */
    body[data-view="home"] .dev-switchers { display: none; }

    /*
     * LibraTech 壳层（data-shell=libra）：DocuSign 结构不变（字号 / 行高 / 布局尺寸保持），
     * 侧栏改为 app.libratech.ai 的「悬浮卡片」风格：
     * sunken 底色 + 圆角卡片 + 白底按钮卡 + 无左侧选中色条 + 通栏圆角选中。
     * 由 data-skin=notasign | libra-top | libra-rail 共用；libra-top 另叠加顶栏悬浮适配；libra-rail 收纳顶栏。
     * 仅视觉层（padding / 圆角 / 颜色 / 阴影），不改任何 font-size 与结构。
     */
    html[data-shell="libra"] {
      /* LibraTech 骨架 + 蓝调灰阶（灰中融一丝蓝，整体与法大大蓝和谐） */
      --fdd-brand: #161a1b;
      --fdd-brand-hover: #2f2b24;
      --fdd-brand-deep: #161a1b;
      --fdd-brand-soft: #f3f5f8;
      --fdd-accent: #04d79b;
      --fdd-ink: #14181d;                 /* 近黑带一点蓝 */
      --fdd-ink-2: #4e5560;
      --fdd-ink-3: #9aa1ab;
      --fdd-ink-muted: #7d8590;
      --fdd-line: #e6e9ee;
      --fdd-line-soft: #eef1f5;
      --fdd-line-strong: #d6dbe3;
      --fdd-bg: #ffffff;
      --fdd-bg-sidebar: #fafbfc;          /* 卡片底色：白中带一点蓝 */
      --fdd-bg-hover: #f3f5f8;            /* sunken：冷调浅灰蓝 */
      --fdd-bg-active: rgba(0, 89, 239, 0.1);
      --fdd-bg-muted: #f3f5f8;
      --fdd-danger: #e6555e;
      --fdd-success: #1b9275;
      --fdd-radius: 8px;
      --fdd-radius-pill: 9999px;
      --fdd-progress-h: 4px;
      --fdd-progress-radius: 17px;
      --fdd-shadow-dropdown: 0 0 0 1px #161a1b0d, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
      --fdd-shadow-menu: 0 0 0 1px #161a1b0d, 0 18px 47px 0 #161a1b08, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
      --lt-shadow-sm: 0 1px 2px 0 #161a1b0f;
      --lt-shadow-button: 0 0 0 1px #161a1b0d, 0 18px 47px 0 #161a1b08, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
    }
    /* —— LibraTech 卡片式骨架（结构不动，灰阶全部带蓝调） —— */
    html[data-shell="libra"] .page-shell { background: #f3f5f8; }
    html[data-shell="libra"] .contract-sidebar {
      margin: 6px 0 24px 10px;
      background: #fafbfc;
      border: 1px solid #e6e9ee;
      border-radius: 12px;
      box-shadow: var(--lt-shadow-sm);
      overflow: hidden;
      /* 高度不超出视口：吸附顶栏下方，上下留缝 6+24，内容超出内部滚动 */
      position: sticky; top: calc(var(--fdd-header-h) + 6px);
      align-self: flex-start;
      height: calc(100vh - var(--fdd-header-h) - 30px);
      max-height: calc(100vh - var(--fdd-header-h) - 30px);
    }
    html[data-shell="libra"] .contract-side-inner { height: 100%; }
    html[data-shell="libra"] .contract-nav-scroll { padding: 0 10px; }
    html[data-shell="libra"] .contract-start { height: 64px; flex-basis: 64px; padding: 12px 10px 8px; }
    html[data-shell="libra"] .contract-launch { border-radius: 8px; font-weight: 600; }
    html[data-shell="libra"] .nav-btn,
    html[data-shell="libra"] .nav-tool { border-radius: 8px; }
    html[data-shell="libra"] .nav-btn.active { background: rgba(0, 89, 239, 0.1); color: var(--fdd-brand); }
    html[data-shell="libra"] .nav-btn.active .aip-icon { color: var(--fdd-brand); }
    html[data-shell="libra"] .nav-btn.active .aip-icon__svg,
    html[data-shell="libra"] .folder-module-head.is-active .aip-icon__svg,
    html[data-shell="libra"] .folder-tree-row.active .aip-icon__svg {
      filter: invert(18%) sepia(99%) saturate(7000%) hue-rotate(217deg) brightness(96%) contrast(101%);
    }
    html[data-shell="libra"] .nav-btn.active::before,
    html[data-shell="libra"] .folder-tree-row.active::before,
    html[data-shell="libra"] .folder-module-head.is-active::before,
    html[data-shell="libra"] .folder-item.active::before { display: none; }
    html[data-shell="libra"] .nav-secondary.active { background: rgba(0, 89, 239, 0.1); color: var(--fdd-brand); }
    html[data-shell="libra"] .nav-section::before { left: 4px; right: 4px; background: #eef1f5; }
    html[data-shell="libra"] .folder-module-head { border-radius: 8px; }
    html[data-shell="libra"] .folder-module-head.is-active { background: rgba(0, 89, 239, 0.1); color: var(--fdd-brand); }
    html[data-shell="libra"] .folder-tree-row { border-radius: 8px; }
    html[data-shell="libra"] .folder-tree-row.active { background: rgba(0, 89, 239, 0.1); }
    html[data-shell="libra"] .folder-tree-row.active .folder-tree-item { color: var(--fdd-brand); }
    html[data-shell="libra"] .records-module-toggle { border-radius: 8px; }
    html[data-shell="libra"] .folder-more-menu,
    html[data-shell="libra"] .export-menu,
    html[data-shell="libra"] .row-menu,
    html[data-shell="libra"] .mini-popover {
      border-color: #e6e9ee;
      border-radius: 10px;
      box-shadow: var(--lt-shadow-button);
    }
    /* 筛选浮窗勿用 button 大投影（18px/47px blur 会形成半透明白雾遮罩） */
    html[data-shell="libra"] .filter-popover {
      border: 1px solid #e6e9ee;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(22, 26, 27, 0.05), 0 8px 24px rgba(22, 26, 27, 0.12);
    }
    html[data-shell="libra"] .ns-modal { border-radius: 12px; }
    html[data-shell="libra"] .contracts-page-content {
      margin: 6px 10px 24px 8px;
      background: #fff;
      border: 1px solid #e6e9ee;
      border-radius: 10px;
      box-shadow: var(--lt-shadow-sm);
      /* app-main 为纵向 flex：必须 stretch，否则卡片只跟内容宽，右侧大块灰底留白 */
      align-self: stretch;
      width: auto;
      min-width: 0;
      box-sizing: border-box;
      min-height: calc(100vh - var(--fdd-header-h) - 30px);
    }
    /* Libra 内容卡内工作区拉满，不再沿用 DocuSign 居中窄栏 */
    html[data-shell="libra"] .contracts-workspace {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 24px 28px 24px;
      box-sizing: border-box;
    }
    html[data-shell="libra"] .envelope-track { background: #e6e9ee; }
    html[data-shell="libra"] .scope-switch { background: #f3f5f8; }
    html[data-shell="libra"] .resend-button { border-radius: 8px; }
    html[data-shell="libra"] .filter-trigger,
    html[data-shell="libra"] .envelope-search,
    html[data-shell="libra"] .envelope-input { border-radius: 8px; }
    html[data-shell="libra"] .filter-chip { border-radius: 8px; }
    html[data-shell="libra"] .filter-popover__cancel,
    html[data-shell="libra"] .filter-popover__apply,
    html[data-shell="libra"] .ns-modal__foot .btn-ghost,
    html[data-shell="libra"] .ns-modal__foot .btn-solid,
    html[data-shell="libra"] .batch-bar button,
    html[data-shell="libra"] .page-size-trigger { border-radius: 8px; }
    html[data-shell="libra"] .envelope-search:focus-within,
    html[data-shell="libra"] .envelope-input:focus-within { outline: none; box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16); }

    html[data-shell="libra"] {
      --fdd-brand: #0059ef;
      --fdd-brand-hover: #004ed6;
      --fdd-brand-deep: #174ea6;
      --fdd-brand-soft: #e8f1ff;
    }
    /* LibraTech + 蓝色点缀：发起签署 / 实心按钮 / Tab / 进度条 / 强调链接走法大大蓝，其余保持蓝调灰 */
    html[data-shell="libra"] .contract-launch {
      background: var(--fdd-brand); color: #fff;
      border: 1px solid var(--fdd-brand);
      box-shadow: var(--lt-shadow-button);
    }
    html[data-shell="libra"] .contract-launch:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }
    /* LibraTech：顶栏直接复用 DocuSign 风格（通栏底条），仅"协议"选中项显示 */
    html[data-shell="libra"] .header-tabs button::after { background: transparent; }
    html[data-shell="libra"] .header-tabs button.active::after,
    html[data-shell="libra"] .header-tabs button[aria-current="page"]::after { background: var(--fdd-brand); }
    html[data-shell="libra"] .header-tabs button.active,
    html[data-shell="libra"] .header-tabs button[aria-current="page"] { color: var(--fdd-brand); }
    html[data-shell="libra"] .btn-upgrade {
      background: var(--fdd-brand); border-color: var(--fdd-brand);
    }
    html[data-shell="libra"] .btn-upgrade:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }
    html[data-shell="libra"] .resend-button.is-solid {
      border-color: var(--fdd-brand); background: var(--fdd-brand);
    }
    html[data-shell="libra"] .resend-button.is-solid:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }
    html[data-shell="libra"] .filter-popover__apply { background: var(--fdd-brand); }
    html[data-shell="libra"] .filter-popover__apply:hover { background: var(--fdd-brand-hover); }
    html[data-shell="libra"] .ns-modal__foot .btn-solid { background: var(--fdd-brand); }
    html[data-shell="libra"] .ns-modal__foot .btn-solid:hover { background: var(--fdd-brand-hover); }
    html[data-shell="libra"] .envelope-track i { background: var(--fdd-brand); }
    html[data-shell="libra"] .todo-text--mine { color: var(--fdd-brand); }
    html[data-shell="libra"] .todo-text--waiting { color: var(--fdd-brand); border-bottom-color: rgba(0, 89, 239, 0.45); }
    html[data-shell="libra"] .party-more-btn { color: var(--fdd-brand); }
    html[data-shell="libra"] .folder-link:hover { color: var(--fdd-brand); }
    html[data-shell="libra"] .envelope-name:hover { color: var(--fdd-brand); }
    html[data-shell="libra"] .applied-clearall,
    html[data-shell="libra"] .filter-popover__clear,
    html[data-shell="libra"] .filter-modal-clearall { color: var(--fdd-brand); }
    html[data-shell="libra"] .envelope-search:focus-within {
      border-color: var(--fdd-brand);
      box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16);
    }
    html[data-shell="libra"] .filter-popover__options input,
    html[data-shell="libra"] .party-dialog-table input { accent-color: var(--fdd-brand); }
    html[data-shell="libra"] .ns-modal__foot .btn-ghost { background: #f3f5f8; }
    html[data-shell="libra"] .ns-modal__foot .btn-ghost:hover { background: #e8ebef; }
    html[data-shell="libra"] .batch-bar {
      background: #fff;
      border-color: #e6e9ee;
      border-radius: 10px;
      box-shadow: var(--lt-shadow-button, var(--fdd-shadow-menu));
    }
    html[data-shell="libra"] .batch-bar .batch-btn {
      background: #f3f5f8; color: var(--fdd-ink); border-radius: 8px;
    }
    html[data-shell="libra"] .batch-bar .batch-btn:hover { background: #e8ebef; }
    html[data-shell="libra"] .avatar { background: var(--fdd-brand-soft); color: var(--fdd-brand-deep); }
    /* 顶栏 Tab 与页头按钮同步 LibraTech 深灰 */
    /* Tab / 升级按钮已在上方品牌蓝块定义 */
    /* 表格内实心按钮 / 图标 / 翻页选中 */
    html[data-shell="libra"] .page-size-menu button:hover,
    html[data-shell="libra"] .page-size-menu button.is-selected { background: #f3f5f8; }

    /*
     * Libra · 顶栏适配（data-skin=libra-top）：
     * 保留 Logo + 一级 Tab + 升级/工具/头像的产品结构，
     * 仅把通栏 DocuSign 顶栏收成与侧栏/内容卡同语汇的悬浮条。
     */
    html[data-skin="libra-top"] {
      --fdd-header-h: 56px;
      /* 顶栏卡 ↔ 侧栏/内容卡 竖直间距（原先仅 6px，过挤） */
      --libra-top-card-gap: 10px;
    }
    html[data-skin="libra-top"] body {
      background: #f3f5f8;
      /* fixed 顶栏脱离文档流，用 padding 占住原高度，避免内容上顶 */
      padding-top: calc(6px + var(--fdd-header-h));
    }
    html[data-skin="libra-top"] .app-header {
      position: fixed;
      top: 6px;
      left: 10px;
      right: 10px;
      margin: 0;
      width: auto;
      z-index: 50;
      height: var(--fdd-header-h);
      padding: 0 12px 0 16px;
      align-items: center;
      background: #fafbfc;
      border: 1px solid #e6e9ee;
      border-radius: 12px;
      box-shadow: var(--lt-shadow-sm, 0 1px 2px 0 #161a1b0f);
    }
    /* 仅 Libra · 顶栏：Logo 缩至 0.9，其它皮肤保持原尺寸 */
    html[data-skin="libra-top"] .brand {
      min-width: calc(58px * 0.9);
      height: calc(29px * 0.9);
    }
    html[data-skin="libra-top"] .brand img {
      height: calc(29px * 0.9);
      max-height: calc(29px * 0.9);
    }
    html[data-skin="libra-top"] .header-left,
    html[data-skin="libra-top"] .header-right {
      align-items: center;
      height: auto;
      align-self: center;
    }
    html[data-skin="libra-top"] .header-tabs {
      height: auto;
      align-items: center;
      gap: 2px;
      /* 悬浮顶栏内不再保留 DocuSign 分隔区大空档，Logo→导航收紧到 16px */
      margin-inline-start: 16px;
    }
    html[data-skin="libra-top"] .header-tabs li {
      height: auto;
      align-items: center;
    }
    html[data-skin="libra-top"] .header-tabs button {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: var(--fdd-ink-2);
    }
    html[data-skin="libra-top"] .header-tabs button::after {
      display: none;
    }
    html[data-skin="libra-top"] .header-tabs button:hover {
      color: var(--fdd-ink);
      background: #f3f5f8;
    }
    html[data-skin="libra-top"] .header-tabs button.active,
    html[data-skin="libra-top"] .header-tabs button[aria-current="page"] {
      color: var(--fdd-brand);
      background: rgba(0, 89, 239, 0.1);
      font-weight: 600;
    }
    html[data-skin="libra-top"] .btn-upgrade {
      height: 32px;
      margin-right: 6px;
      padding: 0 12px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: var(--lt-shadow-button, none);
    }
    html[data-skin="libra-top"] .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    html[data-skin="libra-top"] .icon-btn:hover {
      background: #f3f5f8;
    }
    html[data-skin="libra-top"] .avatar-wrap {
      width: auto;
      height: auto;
      padding: 0 4px 0 6px;
      display: flex;
      align-items: center;
    }
    html[data-skin="libra-top"] .avatar {
      width: 32px;
      height: 32px;
    }
    /* 悬浮顶栏后，侧栏吸顶位置 = 顶缝 + 顶栏高 + 卡间距 */
    html[data-skin="libra-top"] .contract-sidebar {
      margin-top: var(--libra-top-card-gap);
      top: calc(6px + var(--fdd-header-h) + var(--libra-top-card-gap));
      height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap) - 24px);
      max-height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap) - 24px);
    }
    html[data-skin="libra-top"] .contracts-page-content {
      margin-top: var(--libra-top-card-gap);
      min-height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap) - 24px);
    }
    /* 首页双卡：顶缝与协议内容卡一致（仅 libra-top-card-gap，勿再叠 6px） */
    html[data-skin="libra-top"] [data-aip-home] .ds-home {
      padding-top: var(--libra-top-card-gap);
      min-height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap));
    }
    html[data-skin="libra-top"] [data-aip-home] .ds-homeside {
      height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap) - 24px);
      max-height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap) - 24px);
    }
    html[data-skin="libra-top"] .page-shell {
      min-height: calc(100vh - 6px - var(--fdd-header-h) - var(--libra-top-card-gap));
    }

    /* [停用] Libra · 侧栏皮肤样式
    /*
     * Libra · 侧栏（data-skin=libra-rail）：
     * 顶栏收纳进左侧悬浮卡——Logo / 一级导航落侧栏顶，升级与用户区落侧栏底；
     * 主区只留内容卡，对齐 LibraTech 真源左右形态（无通栏顶栏）。
     * /
    html[data-skin="libra-rail"] {
      --fdd-header-h: 0px;
    }
    html[data-skin="libra-rail"] body {
      background: #f3f5f8;
    }
    html[data-skin="libra-rail"] .app-header {
      display: none !important;
    }
    html[data-skin="libra-rail"] .libra-rail-head,
    html[data-skin="libra-rail"] .libra-rail-primary,
    html[data-skin="libra-rail"] .libra-rail-foot {
      display: flex;
    }
    html[data-skin="libra-rail"] .libra-rail-sep {
      display: block;
    }
    html[data-skin="libra-rail"] .libra-rail-head {
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 8px 14px 4px;
      box-sizing: border-box;
    }
    html[data-skin="libra-rail"] .libra-rail-head .brand {
      min-width: calc(58px * 0.9);
      height: calc(29px * 0.9);
    }
    html[data-skin="libra-rail"] .libra-rail-head .brand img {
      height: calc(29px * 0.9);
      max-height: calc(29px * 0.9);
    }
    html[data-skin="libra-rail"] .libra-rail-primary {
      flex: 0 0 auto;
      flex-direction: column;
      padding: 0 10px 8px;
    }
    html[data-skin="libra-rail"] .libra-rail-primary > nav {
      /* 一级导航改由下拉承载，原 Tab 列表隐藏但保留 DOM 供逻辑复用 * /
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap;
    }
    html[data-skin="libra-rail"] .libra-rail-sep {
      display: block;
      height: 1px; margin: 2px 14px 8px;

  <script>
    /**
     * @typedef {{id:string,subject:string,parties:string,statusKey:string,statusText:string,progress:number,date:string,time:string,action:string}} TaskRow
     */

    const SKIN_KEY = 'contracts-v1-skin';

    /** @type {HTMLElement|null} */
    let sharedDateCalFloat = null;

    /**
     * 关闭共享日历浮窗。
     */
    function closeSharedDateCalFloat() {
      if (sharedDateCalFloat) {
        sharedDateCalFloat.remove();
        sharedDateCalFloat = null;
      }
      document.querySelectorAll('.libra-dp__field.is-open').forEach((el) => el.classList.remove('is-open'));
    }

    /**
     * @param {Date} d
     * @returns {string}
     */
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /**
     * @param {string} iso
     * @returns {string}
     */
    function formatDateDisplay(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      if (!y || !m || !d) return iso;
      return `${y} / ${m} / ${d}`;
    }

    /**
     * 在输入框上下弹出日历浮窗，选中即写入。
     * @param {HTMLElement} field
     * @param {HTMLInputElement} input
     */
    function openSharedDateCal(field, input) {
      closeSharedDateCalFloat();
      let selected = input.dataset.iso || '';
      let view = selected ? new Date(selected + 'T00:00:00') : new Date();
      if (Number.isNaN(view.getTime())) view = new Date();
      view = new Date(view.getFullYear(), view.getMonth(), 1);

      const floatEl = document.createElement('div');
      floatEl.className = 'libra-dp__float';
      floatEl.setAttribute('role', 'dialog');
      floatEl.setAttribute('aria-label', '选择日期');
      floatEl.innerHTML = `
        <div class="libra-dp__nav">
          <span class="libra-dp__month"></span>

        const firstDow = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const prevDays = new Date(y, m, 0).getDate();
        const todayISO = toISODate(new Date());
        const previewEnd = (!rangeEnd && rangeStart && hoverISO) ? hoverISO : '';
        const a = rangeStart;
        const b = rangeEnd || previewEnd;
        const cells = [];
        for (let i = 0; i < 42; i++) {
          let dayNum; let cellDate; let muted = false;
          if (i < firstDow) {
            dayNum = prevDays - firstDow + 1 + i;
            cellDate = new Date(y, m - 1, dayNum);

          const cls = ['libra-dp__day'];
          if (muted) cls.push('is-muted');
          if (iso === todayISO) cls.push('is-today');
          if (a && b) {
            const lo = a < b ? a : b;
            const hi = a < b ? b : a;
            if (iso === lo) cls.push('is-range-start');
            if (iso === hi) cls.push('is-range-end');
            if (isoInRange(iso, lo, hi)) cls.push('is-in-range');

        monthRight.textContent = `${right.getFullYear()}年${String(right.getMonth() + 1).padStart(2, '0')}月`;

          hoverISO = '';

          renderAll();
          closeSharedDateCalFloat();
          return;

        renderAll();

    /**
     * 绑定日期条件通栏（= / 介于 / 早于 / 晚于）及比较态日期输入。
     * @param {HTMLElement} root
     */
    function bindDateOpUI(root) {
      const wrap = /** @type {HTMLElement|null} */ (root.querySelector('[data-date-op-wrap]'));
      if (!wrap || wrap.dataset.bound === '1') return;
      wrap.dataset.bound = '1';
      wrap.dataset.op = wrap.dataset.op || 'eq';

      const trigger = /** @type {HTMLElement} */ (wrap.querySelector('[data-date-op-trigger]'));
      const menu = /** @type {HTMLElement} */ (wrap.querySelector('[data-date-op-menu]'));
      const labelEl = /** @type {HTMLElement} */ (wrap.querySelector('[data-date-op-label]'));
      const paneEq = /** @type {HTMLElement|null} */ (root.querySelector('[data-date-pane="eq"]'));
      const paneCompare = /** @type {HTMLElement|null} */ (root.querySelector('[data-date-pane="compare"]'));
      const singleRow = /** @type {HTMLElement|null} */ (root.querySelector('[data-date-compare-single]'));
      const rangeRow = /** @type {HTMLElement|null} */ (root.querySelector('[data-date-compare-range]'));

      /**
       * @param {string} op eq|between|before|after
       */
      function applyOp(op) {
        wrap.dataset.op = op;
        const item = wrap.querySelector(`[data-op="${op}"]`);
        labelEl.textContent = item?.getAttribute('data-op-label') || '=';
        wrap.querySelectorAll('.filter-popover__op-item').forEach((el) => {
          const on = el.getAttribute('data-op') === op;
          el.classList.toggle('is-selected', on);
          el.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        const isEq = op === 'eq';
        const isBetween = op === 'between';
        /* = → 相对时间单选；介于 → 起止两个日期框；早于/晚于 → 单日选择器 */
        if (paneEq) paneEq.hidden = !isEq;
        if (paneCompare) paneCompare.hidden = isEq;
        if (singleRow) singleRow.hidden = isEq || isBetween;
        if (rangeRow) rangeRow.hidden = !isBetween;
        const popShell = /** @type {HTMLElement|null} */ (
          root.closest('.filter-popover, .filter-inner-pop') || (root.classList.contains('filter-popover') || root.classList.contains('filter-inner-pop') ? root : null)
        );
        if (popShell) {
          /* = 保持文字自适应；其它条件为日期选择器加宽 */
          popShell.classList.toggle('is-date-picker', !isEq);
          popShell.classList.toggle('is-date-between', isBetween);
          const fieldEl = /** @type {HTMLElement|null} */ (popShell.closest('.filter-field'));
          if (fieldEl && !popShell.hidden && typeof window.__positionFilterPopover === 'function') {
            requestAnimationFrame(() => window.__positionFilterPopover(fieldEl, popShell));
          }
        }
        menu.hidden = true;
        trigger.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        closeSharedDateCalFloat();
      }

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = menu.hidden;
        menu.hidden = !open;
        trigger.classList.toggle('is-open', open);
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      menu.addEventListener('click', (e) => e.stopPropagation());
      menu.querySelectorAll('[data-op]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          applyOp(btn.getAttribute('data-op') || 'eq');
        });
      });

      root.querySelectorAll('.libra-dp__field').forEach((fieldEl) => {
        const field = /** @type {HTMLElement} */ (fieldEl);
        const input = /** @type {HTMLInputElement|null} */ (field.querySelector('.libra-dp__input'));
        if (!input) return;
        const open = (ev) => {

          if (sharedDateCalFloat && field.classList.contains('is-open')) {

            return;

          openSharedDateCal(field, input);

      wrap._applyDateOp = applyOp;
      applyOp(wrap.dataset.op || 'eq');

    function setAppView(view, opts) {

      document.body.setAttribute('data-view', next);
      document.querySelectorAll('#headerTabs button').forEach((btn) => {

      document.title = next === 'home'

        : '协议 · 签署任务列表结构调整 0.1（AIP）';

      if (next === 'home' && window.AipHome) {
        const host = /** @type {HTMLElement|null} */ (document.querySelector('[data-aip-home]'));
        if (host) window.AipHome.mount(host);
      }

      if (push) {
        const hash = next === 'home' ? '#home' : '#contracts';
        if (location.hash !== hash) history.pushState({ view: next }, '', hash);
      }
      syncRailProductLabel();
    }

        const view = btn.getAttribute('data-view');

          setAppView(/** @type {'home'|'contracts'} */ (view));
          return;

      document.querySelectorAll('[data-view-link="home"]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          setAppView('home');

      });

      window.addEventListener('popstate', () => {
        const fromHash = location.hash === '#home' ? 'home' : 'contracts';
        setAppView(fromHash, { push: false });

      setAppView(initial, { push: false });

    (function bindRailProductSelect() {

      const tabs = document.getElementById('headerTabs');
      if (!trigger || !menu || !tabs) return;

      const checkSvg = '<svg class="op-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7.5"/></svg>';

      /**
       * 根据顶栏 Tab 重建侧栏产品下拉选项。

      function rebuildMenu() {
        const buttons = [...tabs.querySelectorAll('button')];
        menu.innerHTML = buttons.map((btn, idx) => {

      function setOpen(open) {
