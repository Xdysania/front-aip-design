    const COL_KEY_PREFIX = 'aip-01-cols-';
    function colStorageKey() {
      return COL_KEY_PREFIX + 'member-cx-' + (currentFolder ? 'folder' : currentScope);
    }
    /** 当前生效列（有序、含固定首尾） */
    let activeCols = loadCols();
    let colDraft = null;
    function loadCols() {
      try {
        const raw = localStorage.getItem(colStorageKey());
        if (raw) {
          const ids = JSON.parse(raw);
          const valid = ids.filter((id) => COL_DEFS.some((d) => d.id === id));
          if (valid.length && valid[0] === 'subject' && valid[valid.length - 1] === 'actions') return valid;
        }
      } catch (_) { /* ignore */ }
      return DEFAULT_COL_IDS.slice();
    }
    function saveCols(ids) {
      try { localStorage.setItem(colStorageKey(), JSON.stringify(ids)); } catch (_) { /* ignore */ }
    }
    /** 排序：{ field, dir } 单字段排序；列显隐不改变排序 */
    let sortState = { field: 'updatedAt', dir: 'desc' };

    const LEGACY_META = {
      receiving: ['待我接收', '原页面 /work/task/manage/receiving。原接收状态、搜索、重置、分页保持不变；Demo 仅承载原有页面。'],
      batch: ['批量发送记录', '原批量发送记录页面。Demo 仅承载原有页面，不重建查询。'],
      scan: ['扫码签记录', '原扫码签记录页面。Demo 仅承载原有页面，不重建查询。'],
      processing: ['处理中心', '原处理中心页面，承接导出 / 下载作业结果。Demo 仅承载原有页面。'],
      statistics: ['数据统计', '原数据统计页面（/work/task/admin/dataStatistics）。Demo 仅承载原有页面。'],
      launch: ['发起签署', '原认证检查 → 原创建页面。Demo 仅承载原有页面，不模拟创建表单、认证、发送或用印。'],
    };

    /** @type {'mine'|'corp'} 访问范围（任务文件夹页不携带） */
    let currentScope = 'mine';
    /** @type {'all'|'draft'|'active'|'completed'|'folder'} */
    let currentNav = 'all';
    /** @type {string|null} 任务文件夹目录标识 */
    let currentFolder = null;
    /** @type {string|null} 记录与处理 / 发起签署的原有页面承载 */
    let currentLegacy = null;
    /** @type {string|null} */
    let openMenuId = null;
    /** @type {{key:string,taskId:string}|null} */
    let openPop = null;
    /** 进入任务文件夹前的固定列表范围，用于离开时恢复（PRD 4.6） */
    let scopeBeforeFolder = 'mine';
    /** 已应用筛选（模拟已提交条件；关键词不计数） */
    const activeFilters = { date: null, status: null, sender: null, quick: null };
    const FILTER_TITLES = { date: '时间', status: '状态', sender: '发起人', quick: '快捷筛选' };
    /** 当前已选任务（仅本页，不跨页累计） */
    const selectedIds = new Set();
    const openFolderIds = new Set();
    /** 汇总弹窗草稿（内层应用只写草稿，外层保存才提交一次查询） */
    let summaryDraft = null;
    /** 选择收件人上下文 */
    let partyDialogCtx = null;
    /** 导出资格（mock：有导出资格；无资格时隐藏导出按钮） */
    const canExport = true;

    /**
     * @param {string} msg
     */
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    /** 模态锁滚动：任一弹窗打开时 body 加 is-modal-open */
    function syncModalScrollLock() {
      const anyOpen = [...document.querySelectorAll('.ns-modal-mask')].some((m) => !m.hidden);
      document.body.classList.toggle('is-modal-open', anyOpen);
    }

    /** 侧栏「状态导航」与「任务文件夹 / 记录与处理」互斥选中 */
    function syncSidebarActive() {
      document.querySelectorAll('.nav-primary').forEach((el) => {
        el.classList.toggle('active', !currentFolder && !currentLegacy && currentNav === 'all');
      });
      document.querySelectorAll('.contract-secondary-items .nav-secondary').forEach((el) => {
        el.classList.toggle('active', !currentFolder && !currentLegacy && el.getAttribute('data-nav') === currentNav);
      });
      const head = document.getElementById('folderModuleHead');
      /* 只有目录本身高亮；模块头不因选中目录而高亮（同一时刻只一个选中项） */
      if (head) head.classList.remove('is-active');
      document.querySelectorAll('.folder-tree-row').forEach((el) => {
        const on = !!currentFolder && el.getAttribute('data-folder-row') === currentFolder;
        el.classList.toggle('active', on);
      });
      document.querySelectorAll('[data-record]').forEach((el) => {
        el.classList.toggle('active', !!currentLegacy && el.getAttribute('data-record') === currentLegacy);
      });
    }

    /** 文件夹树渲染（PRD 6.2：层级缩进 20px、结构父级、计数、按需展开） */
    function renderFolderTree(nodes, container, depth) {
      nodes.forEach((node) => {
        const hasKids = node.children && node.children.length > 0;
        const row = document.createElement('div');
        row.className = 'folder-tree-row' + (openFolderIds.has(node.id) ? ' is-open' : '');
        row.setAttribute('data-folder-row', node.id);
        row.style.paddingLeft = `${23 + depth * 20}px`;
        row.innerHTML = `
          <button class="folder-tree-caret${hasKids ? '' : ' is-leaf'}" type="button" aria-label="展开 ${node.name}" data-caret="${node.id}">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" fill="currentColor" focusable="false"><path d="m15 8.32-4.43 4.45c-.16.16-.37.23-.57.23s-.41-.07-.57-.23L5 8.32 6.32 7 10 10.66 13.68 7z"/></svg>
          </button>
          <button class="folder-tree-item${node.structural ? ' is-structural' : ''}" type="button" data-folder="${node.id}" title="${node.name}">
            <span>${node.name}</span><b>${node.count}</b>
          </button>
          ${node.structural ? '' : `<button class="folder-node-more" type="button" aria-label="${node.name} 更多操作" data-node-more="${node.id}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m2-10c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2m0 16c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2"/></svg>
          </button>`}`;
        container.appendChild(row);
        if (hasKids && openFolderIds.has(node.id)) renderFolderTree(node.children, container, depth + 1);
      });
    }

    function rebuildFolderTree() {
      const body = document.getElementById('folderModuleBody');
      if (!body) return;
      body.innerHTML = '';
      renderFolderTree(FOLDER_TREE, body, 0);
      syncSidebarActive();
    }

    /** @returns {any[]} */
    function filteredTasks() {
      const q = /** @type {HTMLInputElement} */ (document.getElementById('searchInput')).value.trim().toLowerCase();
      return TASKS.filter((task) => {
        if (currentFolder) {
          if (task.folder !== currentFolder && !(currentFolder === 'group' && task.folder === 'compliance')) return false;
        } else {
          if (!task.scope.includes(currentScope)) return false;
          const set = VIEW_STATE_SET[currentNav];
          if (set && !set.includes(task.statusCode)) return false;
        }
        /* 已应用状态条件（全部任务 / 文件夹单选附加状态） */
        if (activeFilters.status) {
          if (activeFilters.status.value === 'progress-set') {
            if (!PROGRESS_CODES.includes(task.statusCode)) return false;
          } else if (task.statusCode !== activeFilters.status.value) return false;
        }
        if (activeFilters.sender) {
          /* mock：关系条件不拆数据，仅演示计数与标签 */
        }
        if (activeFilters.quick) {
          if (activeFilters.quick.value === 'todo-me' && !(task.todo && task.todo.kind === 'mine')) return false;
          if (activeFilters.quick.value === 'todo-others' && !(task.todo && task.todo.kind === 'waiting')) return false;
          if (activeFilters.quick.value === 'todo-corp' && !(task.todo && (task.todo.kind === 'mine' || task.todo.kind === 'waiting'))) return false;
          if (activeFilters.quick.value === 'todo-add-member' && !(task.todo && task.todo.kind === 'add-member')) return false;
          if (activeFilters.quick.value === 'due-soon' && task.statusCode !== 'signing') return false;
        }
        if (!q) return true;
        const subject = (task.subject || '').toLowerCase();
        return subject.includes(q) || task.id.toLowerCase() === q;
      });
    }

    /** 收件人摘要：前两名 + 「+N」浮层（PRD 5.1） */
    function partiesSummaryHtml(task) {
      const list = task.parties || [];
      if (!list.length) return '<small>暂无收件人</small>';
      const first = list.slice(0, 2).join('、');
      if (list.length <= 2) return `<small>收件人：${first}</small>`;
      const rest = list.length - 2;
      return `<small>收件人：${first} <button type="button" class="party-more-btn" data-pop="parties" data-task="${task.id}" aria-haspopup="dialog">+${rest}</button></small>`;
    }

    /** 状态列：业务状态 + 当前待办说明 + 进度（PRD 5.2/5.3/5.4） */
    function stateCellHtml(task) {
      const statusText = STATUS_TEXT[task.statusCode] || '状态更新中';
      let todoHtml = '';
      if (task.todo) {
        if (task.todo.kind === 'mine') {
          todoHtml = `<span class="todo-text todo-text--mine">${task.todo.text}</span>`;
        } else if (task.todo.kind === 'waiting') {
          todoHtml = `<button type="button" class="todo-text todo-text--waiting" data-pop="waiting" data-task="${task.id}">${task.todo.text}</button>`;
        } else {
          todoHtml = `<span class="todo-text todo-text--plain">${task.todo.text}</span>`;
        }
      }
      if (task.statusCode === 'completed') {
        return `<div class="envelope-state is-completed">
          <svg class="status-check" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="currentColor" focusable="false">
            <path d="M8.39 12.74 6 10.35l1.34-1.34L9 10.67l3.66-3.66L14 8.35l-4.39 4.39c-.17.17-.39.26-.61.26s-.44-.1-.61-.26"/>
            <path d="M10 3.9c3.36 0 6.1 2.74 6.1 6.1s-2.74 6.1-6.1 6.1-6.1-2.74-6.1-6.1S6.64 3.9 10 3.9M10 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8"/>
          </svg>
          <span class="todo-text">${statusText}</span>
        </div>`;
      }
      const progressHtml = task.progress
        ? `<span class="envelope-track"><i style="width:${Math.round((task.progress.done / task.progress.total) * 100)}%"></i></span>`
        : '';
      const statusLine = task.progress
        ? `<span class="todo-text todo-text--plain">${statusText} <span style="color:var(--fdd-ink-3)">${task.progress.done}/${task.progress.total}</span></span>`
        : `<span class="todo-text todo-text--plain">${statusText}</span>`;
      return `<div class="envelope-state">${statusLine}${progressHtml}${todoHtml}</div>`;
    }

    /** 文件夹列：点击目录进入对应任务文件夹页；无归属显示未归类（PRD 5.1） */
    function folderCellHtml(task) {
      if (!task.folder) return '<span class="todo-text todo-text--plain">未归类</span>';
      return `<button type="button" class="folder-link" data-goto-folder="${task.folder}">${FOLDER_NAME_MAP[task.folder] || '文件夹'}</button>`;
    }

    /** 单元格渲染器（除主题/状态/更新/文件夹/操作外的可选列） */
    function cellHtml(task, colId) {
      const t = task;
      switch (colId) {
        case 'subject':
          return `<button class="envelope-name" type="button" data-toast="打开任务详情：${t.subject || '未命名签署任务'}（原有详情页）">${t.subject || '未命名签署任务'}</button>${partiesSummaryHtml(t)}`;
        case 'status': return stateCellHtml(t);
        case 'updatedAt': return `<span class="time-cell"><span>${t.date}</span><small>${t.time}</small></span>`;
        case 'folder': return folderCellHtml(t);
        case 'taskNo': return `<span class="col-aux">${t.id}</span>`;
        case 'approval': return `<span class="col-aux">${t.approvalStatus || '—'}</span>`;
        case 'initiator': return `<span class="col-aux">${t.initiatorName || '—'}</span>`;
        case 'recipients': return `<span class="col-aux">${(t.parties || []).slice(0, 2).join('、') || '—'}${(t.parties || []).length > 2 ? ` +${t.parties.length - 2}` : ''}</span>`;
        case 'finishedAt': return `<span class="col-aux">${t.statusCode === 'completed' ? t.date : '—'}</span>`;
        case 'deadline': return `<span class="col-aux">${t.deadline || '长期有效'}</span>`;
        case 'createdAt': return `<span class="col-aux">${t.createdAt || '—'}</span>`;
        case 'creator': return `<span class="col-aux">${t.creator || '—'}</span>`;
        case 'signTemplateId': return `<span class="col-aux">${t.signTemplateId || '—'}</span>`;
        case 'batchId': return `<span class="col-aux">${t.batchId || '—'}</span>`;
        case 'actions':
          return `<div class="row-actions">
            ${t.primary ? `<button class="resend-button${['签署', '填写', '定稿'].includes(t.primary) ? ' is-solid' : ''}" type="button" data-primary="${t.id}">${t.primary}</button>` : ''}
            ${(t.more && t.more.length) ? `
            <span class="more-wrap">
              <button class="more-button" type="button" aria-label="更多操作" data-more="${t.id}">
                <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m2-10c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2m0 16c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2 2-.9 2-2"/></svg>
              </button>

            </span>` : ''}
          </div>`;
        default: return '—';
      }
    }

    function renderHead() {
      const head = document.getElementById('taskHead');
      const ths = activeCols.map((id) => {
        const def = COL_DEFS.find((d) => d.id === id);
        if (id === 'subject') {
          return `<th><input id="checkAll" type="checkbox" aria-label="选择所有行" /></th><th>${def.label}</th>`;
        }
        if (id === 'actions') {
          return `<th class="col-settings-th" aria-label="操作与列设置">
            <button type="button" class="col-settings-btn" id="colSettingsBtn" aria-label="设置列表列" aria-haspopup="dialog">
              <svg class="ico" width="17" height="17" viewBox="0 0 20 20" fill="currentColor"><path d="M8 5.18V2H6v3.18A2.996 2.996 0 0 0 7 11c1.66 0 3-1.34 3-3 0-1.3-.84-2.4-2-2.82M7 9.1c-.61 0-1.1-.49-1.1-1.1S6.39 6.9 7 6.9s1.1.49 1.1 1.1S7.61 9.1 7 9.1m9 2.9c0-1.66-1.34-3-3-3s-3 1.34-3 3c0 1.3.84 2.4 2 2.82V18h2v-3.18c1.16-.41 2-1.51 2-2.82m-3 1.1c-.61 0-1.1-.49-1.1-1.1s.49-1.1 1.1-1.1 1.1.49 1.1 1.1-.49 1.1-1.1 1.1M8 18H6v-6h2zm6-10h-2V2h2z"/></svg>
            </button>
          </th>`;
        }
        const sortable = def.sortable;
        const isSortCol = sortState.field === id;
        const ico = isSortCol ? (sortState.dir === 'asc' ? '↑' : '↓') : '';
        const minW = { subject: 220, status: 150, updatedAt: 130, folder: 110, taskNo: 170, approval: 90, initiator: 90, recipients: 150, finishedAt: 110, deadline: 110, createdAt: 110, creator: 90, signTemplateId: 140, batchId: 110 }[id] || 100;
        return `<th${sortable ? ` data-sort="${id}" class="is-sortable"` : ''} style="min-width:${minW}px">${def.label}${sortable ? ` <span class="sort-ico">${ico}</span>` : ''}</th>`;
      }).join('');
      head.innerHTML = `<tr>${ths}</tr>`;
      /* 表头排序 */
      head.querySelectorAll('[data-sort]').forEach((th) => {
        th.addEventListener('click', () => {
          const field = th.getAttribute('data-sort');
          if (sortState.field === field) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
          else sortState = { field, dir: 'asc' };
          selectedIds.clear();
          render();
        });
      });
      head.querySelector('#colSettingsBtn')?.addEventListener('click', () => openColSettings());
      head.querySelector('#checkAll')?.addEventListener('change', (e) => {
        const on = e.target.checked;
        document.querySelectorAll('#taskBody [data-row-check]').forEach((c) => {
          c.checked = on;
          const rid = c.getAttribute('data-row-check');
          if (on) selectedIds.add(rid); else selectedIds.delete(rid);
        });
        syncBatchBar();
      });
    }

    function sortRows(rows) {
      const arr = rows.slice();
      const { field, dir } = sortState;
      arr.sort((a, b) => {
        const va = a[field] || a.date || '';
        const vb = b[field] || b.date || '';
        if (va === vb) return a.id < b.id ? -1 : 1;
        return (va < vb ? -1 : 1) * (dir === 'asc' ? 1 : -1);
      });
      return arr;
    }

    function render() {
      const rows = sortRows(filteredTasks());
      const body = document.getElementById('taskBody');
      let title = TITLE_MAP[currentNav] || '全部任务';
      if (currentFolder) title = FOLDER_NAME_MAP[currentFolder] || '任务文件夹';
      document.getElementById('pageTitle').textContent = title;

      /* 范围选择器：任务文件夹页不显示（PRD 2.1） */
      const scopeSwitch = document.getElementById('scopeSwitch');
      if (scopeSwitch) {
        scopeSwitch.hidden = !!currentFolder;
        scopeSwitch.querySelectorAll('[data-scope]').forEach((b) => {
          b.classList.toggle('is-on', b.getAttribute('data-scope') === currentScope);
        });
      }
      /* 搜索占位随列表变化 */
      const searchInput = /** @type {HTMLInputElement} */ (document.getElementById('searchInput'));
      searchInput.placeholder = currentFolder ? VIEW_SEARCH_PH.folder : (VIEW_SEARCH_PH[currentNav] || '搜索签署任务');

      document.getElementById('pageInfo').textContent = '第 1 页';
      document.getElementById('pageTotal').textContent = `共 ${rows.length} 条`;
      syncSidebarActive();
      renderAppliedRow();
      syncBatchBar();
      renderHead();

      body.innerHTML = rows.map((task) => `
        <tr data-id="${task.id}">
          ${activeCols.map((id) => {
            if (id === 'subject') return `<td><input type="checkbox" data-row-check="${task.id}" ${selectedIds.has(task.id) ? 'checked' : ''} aria-label="选择 ${task.subject || '未命名签署任务'}" /></td><td>${cellHtml(task, id)}</td>`;
            return `<td>${cellHtml(task, id)}</td>`;
          }).join('')}
        </tr>
      `).join('') || `<tr><td colspan="${activeCols.length + 1}" style="text-align:center;color:var(--fdd-ink-3);height:120px">没有符合条件的任务</td></tr>`;
      /* 行重渲染后同步表头全选勾选态 */
      const allChecked = rows.length > 0 && rows.every((t) => selectedIds.has(t.id));
      const headCheck = document.getElementById('checkAll');
      if (headCheck) headCheck.checked = allChecked;
    }

    /** 批量选择（PRD 6.1：本页选择，不跨页累计；未勾选不显示提示） */
    function syncBatchBar() {
      const bar = document.getElementById('batchBar');
      if (!bar) return;
      const n = selectedIds.size;
      bar.classList.toggle('is-on', n > 0);
      document.getElementById('batchCount').textContent = `已选择 ${n} 条`;
      const expSel = document.getElementById('exportSelected');
      if (expSel) expSel.disabled = n === 0;
    }

    document.getElementById('taskBody').addEventListener('change', (e) => {
      const cb = /** @type {HTMLElement} */ (e.target).closest('[data-row-check]');
      if (!cb) return;
      const id = cb.getAttribute('data-row-check');
      if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
      syncBatchBar();
    });

    /** 列表切换（PRD 4.6：切状态列表保留关键词与日期，清附加状态 / 发起人 / 快捷） */
    document.querySelectorAll('[data-nav]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-nav') || 'all';
        if (currentFolder) {
          /* 从任务文件夹回固定列表：恢复进入前的人员范围（PRD 4.6） */
          currentScope = scopeBeforeFolder;
        }
        currentNav = target;
        currentFolder = null;
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        openMenuId = null;
        openPop = null;
        selectedIds.clear();
        /* 切列表清空筛选状态（PRD 4.6：主动切换清空旧筛选） */
        ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
        render();
      });
    });

    /** 访问范围切换：进入目标范围全部任务，清空旧筛选（PRD 4.6） */
    document.getElementById('scopeSwitch').addEventListener('click', (e) => {
      const btn = /** @type {HTMLElement} */ (e.target).closest('[data-scope]');
      if (!btn) return;
      const scope = btn.getAttribute('data-scope');
      if (scope === currentScope) return;
      currentScope = scope;
      currentNav = 'all';
      currentFolder = null;
      currentLegacy = null;
      document.body.removeAttribute('data-page-mode');
      ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
      selectedIds.clear();
      toast(scope === 'corp' ? '已切换：全部签署（清空旧筛选，默认过去 6 个月）' : '已切换：我的签署');
      render();
    });

    /** 任务文件夹（PRD 6.2：独立页面，无人员范围；目录切换保留关键词 / 日期 / 状态） */
    (function bindFolderModule() {
      const moduleEl = document.getElementById('folderModule');
      const moduleToggle = document.getElementById('folderModuleToggle');
      if (!moduleEl || !moduleToggle) return;

      moduleToggle.addEventListener('click', () => {

      });

      const moreBtn = document.getElementById('folderMoreBtn');
      const moreMenu = document.getElementById('folderMoreMenu');
      moreBtn.addEventListener('click', (e) => {
        e.stopPropagation();

        if (!moreMenu.hidden && !moreMenu.contains(/** @type {Node} */ (e.target)) && e.target !== moreBtn) moreMenu.hidden = true;

      /* 全部收起：折叠整棵目录树（保留模块展开） */
      moreMenu.querySelectorAll('[data-toast="演示：全部收起"]').forEach((b) => {
        b.removeAttribute('data-toast');

          moreMenu.hidden = true;

          rebuildFolderTree();
          toast('已收起全部文件夹');
        });
      });

      /* 新建文件夹：打开新建弹窗 */
      moreMenu.querySelectorAll('[data-toast="演示：新建文件夹（原有流程）"]').forEach((b) => {
        b.removeAttribute('data-toast');
        b.addEventListener('click', () => {
          moreMenu.hidden = true;
          openNewFolderModal();
        });
      });

      /* 查找文件夹：打开"选择要查看的文件夹"弹窗 */
      document.getElementById('folderSearchBtn').addEventListener('click', () => {
        moreMenu.hidden = true;
        openFolderPicker();
      });
      document.getElementById('folderSearchInput').addEventListener('input', (e) => {
        const q = /** @type {HTMLInputElement} */ (e.target).value.trim();
        const body = document.getElementById('folderModuleBody');
        if (!q) { rebuildFolderTree(); return; }
        body.innerHTML = '';
        const flat = [];
        (function walk(nodes, path) {
          nodes.forEach((n) => {
            const full = path ? `${path} / ${n.name}` : n.name;
            if (n.name.includes(q)) flat.push({ ...n, full });
            if (n.children) walk(n.children, full);
          });
        })(FOLDER_TREE, '');
        if (!flat.length) {
          body.innerHTML = '<p class="folder-tree-empty">没有符合条件的文件夹</p>';
          return;
        }
        flat.forEach((n) => {
          const row = document.createElement('div');
          row.className = 'folder-tree-row';
          row.setAttribute('data-folder-row', n.id);
          row.style.paddingLeft = '23px';
          row.innerHTML = `<button class="folder-tree-item" type="button" data-folder="${n.id}" title="${n.full}"><span>${n.full}</span><b>${n.count}</b></button>`;
          body.appendChild(row);
        });
      });

      document.getElementById('folderModuleBody').addEventListener('click', (e) => {
        const t = /** @type {HTMLElement} */ (e.target);
        const caret = t.closest('[data-caret]');
        if (caret) {
          e.stopPropagation();
          const id = caret.getAttribute('data-caret');
          if (openFolderIds.has(id)) openFolderIds.delete(id); else openFolderIds.add(id);
          rebuildFolderTree();
          return;
        }
        const nodeMore = t.closest('[data-node-more]');
        if (nodeMore) {
          e.stopPropagation();
          openFolderNodeMenu(nodeMore, nodeMore.getAttribute('data-node-more'));
          return;
        }
        const item = t.closest('[data-folder]');
        if (!item) return;
        enterFolder(item.getAttribute('data-folder'));
      });

      /* 节点操作菜单（重命名 / 删除 / 移动 / 新子文件夹） */
      let openNodeMenu = null;
      function openFolderNodeMenu(btn, folderId) {
        closeNodeMenu();
        const name = FOLDER_NAME_MAP[folderId] || '文件夹';
        const menu = document.createElement('div');
        menu.className = 'folder-node-menu';
        menu.id = 'folderNodeMenu';
        menu.setAttribute('role', 'menu');
        menu.innerHTML = `
          <button type="button" role="menuitem" data-node-act="rename">重命名</button>
          <button type="button" role="menuitem" data-node-act="delete">删除</button>
          <button type="button" role="menuitem" data-node-act="move">移动</button>
          <button type="button" role="menuitem" data-node-act="new-sub">新子文件夹</button>`;
        document.body.appendChild(menu);
        const rect = btn.getBoundingClientRect();
        menu.style.top = `${Math.min(rect.bottom + 4, window.innerHeight - menu.offsetHeight - 12)}px`;
        menu.style.left = `${Math.min(rect.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 12)}px`;
        btn.classList.add('is-open');
        openNodeMenu = { btn, menu };
        menu.addEventListener('click', (ev) => {
          const actBtn = /** @type {HTMLElement} */ (ev.target).closest('[data-node-act]');
          if (!actBtn) return;
          const act = actBtn.getAttribute('data-node-act');
          const labels = { rename: '重命名', delete: '删除', move: '移动', 'new-sub': '新子文件夹' };
          toast(`演示：${labels[act]}「${name}」（原有目录管理流程，资格由服务端裁决）`);
          closeNodeMenu();
        });
        /* 点外部 / Esc 关闭 */
        setTimeout(() => {
          document.addEventListener('click', nodeMenuOutside, { capture: true });
          document.addEventListener('keydown', nodeMenuEsc);
        }, 0);
      }
      function nodeMenuOutside(ev) {
        if (openNodeMenu && !openNodeMenu.menu.contains(/** @type {Node} */ (ev.target)) && ev.target !== openNodeMenu.btn && !openNodeMenu.btn.contains(/** @type {Node} */ (ev.target))) {
          closeNodeMenu();
        }
      }
      function nodeMenuEsc(ev) {
        if (ev.key === 'Escape') closeNodeMenu();
      }
      function closeNodeMenu() {
        if (!openNodeMenu) return;
        openNodeMenu.btn.classList.remove('is-open');
        openNodeMenu.menu.remove();
        openNodeMenu = null;
        document.removeEventListener('click', nodeMenuOutside, { capture: true });
        document.removeEventListener('keydown', nodeMenuEsc);
      }

      function enterFolder(id) {
        if (!currentFolder) scopeBeforeFolder = currentScope;
        currentFolder = id;
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        openMenuId = null;
        openPop = null;
        selectedIds.clear();
        /* 目录切换：保留关键词、日期、状态；人员范围条件由 renderAppliedRow 清除（PRD 4.6） */
        render();
      }

      rebuildFolderTree();
    })();

    /** 记录与处理：原页面站内承载（PRD 3.7 / FR-AIP-014） */

    /** 发起签署：hover 展开原菜单分支（PRD 2.4：直接 / 模板 / 批量创建） */
    (function bindLaunchMenu() {
      const wrap = document.getElementById('launchWrap');
      const btn = document.getElementById('launchBtn');
      if (!wrap || !btn) return;

      const LEGACY_LAUNCH = {

    /** 行内小浮层（收件人 +N / 等待名单）：fixed 定位，不被行投影遮挡 */
    let miniPopEl = null;
    function closeMiniPop() {
      if (miniPopEl) { miniPopEl.remove(); miniPopEl = null; }
      openPop = null;
    }
    function openMiniPop(btn, key, taskId) {
      closeMiniPop();
      openPop = { key, taskId };
      const task = TASKS.find((x) => x.id === taskId);
      if (!task) return;
      let title = '', items = '';
      if (key === 'parties') {
        title = '收件人';
        items = (task.parties || []).map((n) => `<span class="mini-popover__item"><span class="p-name">${n}</span></span>`).join('');
      } else if (key === 'waiting') {
        title = '等待处理';
        items = ((task.todo && task.todo.waiting) || []).map((w) => `<span class="mini-popover__item"><span class="p-name">${w.name}</span><span class="p-time">发送于 ${w.time}</span></span>`).join('');
      } else return;
      const pop = document.createElement('span');
      pop.className = 'mini-popover';
      pop.setAttribute('role', 'dialog');
      pop.innerHTML = `
        <span class="mini-popover__head">${title}
          <button type="button" class="mini-popover__close" data-pop-close aria-label="关闭">×</button>
        </span>
        <span class="mini-popover__list">${items}</span>`;
      document.body.appendChild(pop);
      miniPopEl = pop;
      const rect = btn.getBoundingClientRect();
      const ph = pop.offsetHeight, pw = pop.offsetWidth;
      let top = rect.bottom + 6;
      if (top + ph > window.innerHeight - 12) top = rect.top - ph - 6;
      let left = rect.left;
      if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
      pop.style.top = Math.max(12, top) + 'px';
      pop.style.left = Math.max(12, left) + 'px';
      pop.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (/** @type {HTMLElement} */ (ev.target).closest('[data-pop-close]')) closeMiniPop();
      });
    }

    /** 行更多菜单：fixed 定位锚定 ⋯ 按钮（不被 sticky 操作列遮挡/裁剪） */
    let rowMenuEl = null;
    function closeRowMenu() {
      if (rowMenuEl) { rowMenuEl.remove(); rowMenuEl = null; }
      openMenuId = null;
      const shell = document.querySelector('.envelope-table-shell');
      if (shell) shell.classList.remove('is-pop-locked');
      document.removeEventListener('click', rowMenuOutside, true);
      document.removeEventListener('keydown', rowMenuEsc);
    }
    function rowMenuOutside(ev) {
      if (rowMenuEl && !rowMenuEl.contains(/** @type {Node} */ (ev.target)) && !ev.target.closest('[data-more]')) closeRowMenu();
    }
    function rowMenuEsc(ev) { if (ev.key === 'Escape') closeRowMenu(); }
    function openRowMenu(btn, taskId) {
      closeRowMenu();
      openMenuId = taskId;
      const shell = document.querySelector('.envelope-table-shell');
      if (shell) shell.classList.add('is-pop-locked');
      const task = TASKS.find((x) => x.id === taskId);
      if (!task || !task.more || !task.more.length) return;
      const menu = document.createElement('span');
      menu.className = 'row-menu';
      menu.setAttribute('role', 'menu');
      menu.innerHTML = task.more.map((m) => `<button type="button" class="${m === '删除' ? 'danger' : ''}" data-toast="演示：${m}（原有流程，资格由服务端裁决）">${m}</button>`).join('');
      document.body.appendChild(menu);
      rowMenuEl = menu;
      const rect = btn.getBoundingClientRect();
      const mh = menu.offsetHeight, mw = menu.offsetWidth;
      let top = rect.bottom + 4;
      if (top + mh > window.innerHeight - 12) top = rect.top - mh - 4;
      menu.style.top = `${Math.max(12, top)}px`;
      menu.style.left = `${Math.max(12, Math.min(rect.right - mw, window.innerWidth - mw - 12))}px`;
      menu.addEventListener('click', () => closeRowMenu());
      setTimeout(() => {
        document.addEventListener('click', rowMenuOutside, true);
        document.addEventListener('keydown', rowMenuEsc);
      }, 0);
    }

    /** 行内交互统一委托（PRD 5.1/5.3/5.4/5.5） */
    document.getElementById('taskBody').addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      const popBtn = t.closest('[data-pop]');
      if (popBtn) {
        e.stopPropagation();
        const key = popBtn.getAttribute('data-pop');
        const taskId = popBtn.getAttribute('data-task');
        if (openPop && openPop.taskId === taskId && openPop.key === key) { closeMiniPop(); }
        else openMiniPop(popBtn, key, taskId);
        return;
      }
      if (t.closest('[data-pop-close]')) {
        closeMiniPop();
        return;
      }
      const goto = t.closest('[data-goto-folder]');
      if (goto) {
        if (!currentFolder) scopeBeforeFolder = currentScope;
        currentFolder = goto.getAttribute('data-goto-folder');
        currentLegacy = null;
        document.body.removeAttribute('data-page-mode');
        selectedIds.clear();
        openFolderIds.add('group');
        const moduleEl = document.getElementById('folderModule');
        moduleEl.classList.add('is-open');
        rebuildFolderTree();
        render();
        return;
      }
      const moreBtn = t.closest('[data-more]');
      if (moreBtn) {
        const id = moreBtn.getAttribute('data-more');
        if (openMenuId === id) { closeRowMenu(); return; }
        openRowMenu(moreBtn, id);
        return;
      }
      const primaryBtn = t.closest('[data-primary]');
      if (primaryBtn) {
        const id = primaryBtn.getAttribute('data-primary');
        const task = TASKS.find((x) => x.id === id);
        if (!task) return;
        if (task.candidates && task.candidates.length >= 2) {
          openPartyDialog(task);
          return;
        }
        toast(`${task.primary}：${task.subject || '未命名签署任务'}（原有流程）`);
        return;
      }
      /* 点浮层外部关闭 */
      if (!t.closest('.mini-popover') && openPop) {
        closeMiniPop();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (openPop) closeMiniPop();
      if (openMenuId) closeRowMenu();
    });

    /** 选择收件人对话框（默认不选、保存禁用；取消不改变列表） */

    /** 筛选汇总（PRD 4.5：查找筛选项 + 已应用 + 可用项；内层编辑写草稿，外层保存一次查询） */
    (function bindFilterSummary() {
      const modal = document.getElementById('filterSummaryModal');

      /** 各列表允许的汇总字段（PRD 3.1-3.6）；key、显示名、描述 */
      function availableFields() {
        const caret = '<span class="aip-icon aip-icon--sm" aria-hidden="true"><img class="aip-icon__svg" src="assets/icons/phosphor/regular/caret-down.svg" alt="" /></span>';
        const base = [
          ['date', '日期', '签署任务日期筛选'],
          ['status', '状态', '签署任务状态筛选'],
          ['sender', '发起人', '签署任务发件人筛选'],
          ['quick', '快捷筛选', '签署任务快捷筛选'],
          ['created-at', '发起时间', '按发起时间筛选'],
          ['deadline', '截止时间', '按截止时间筛选'],
          ['finished-at', '完成时间', '按完成时间筛选'],
          ['subject', '任务主题', '任务主题包含关键词'],
          ['task-id', '任务编号', '任务编号完整匹配'],

        ];
        const caretPill = (label) => `${label} ${caret}`;
        const rows = base.map(([k, label, desc]) => [k, caretPill(label), desc]);
        if (currentNav === 'draft' || currentNav === 'completed') {
          /* 草稿 / 已完成：去掉状态与快捷 */
          return rows.filter(([k]) => !['status', 'quick'].includes(k));
        }
        if (currentNav === 'active') return rows.filter(([k]) => k !== 'status');
        if (currentNav === 'folder') return rows.filter(([k]) => !['sender', 'quick'].includes(k));
        return rows;
      }

      function renderSummary() {
        const q = /** @type {HTMLInputElement} */ (document.getElementById('filterSummarySearch')).value.trim();
        /* 已应用 chips */
        const appliedEntries = Object.keys(summaryDraft).filter((k) => summaryDraft[k]);
        appliedCard.hidden = appliedEntries.length === 0;
        appliedCount.textContent = `已应用的数量 (${appliedEntries.length})`;
        appliedBox.innerHTML = appliedEntries.map((k) => `

        /* 可用项 */

          const text = (pill + desc).replace(/<[^>]+>/g, '');

        availBox.innerHTML = `<h3 style="margin:0 0 6px;font-size:13px;font-weight:600;color:var(--fdd-ink-3)">可用 (${fields.length})</h3>` + (fields.length

              <span class="filter-avail-row__desc">${desc}</span>

      openBtn.addEventListener('click', (e) => {

      /* 可用项行点击：打开该字段的内层编辑浮层（应用写入草稿，外层保存统一查询） */
      let innerPop = null;
      function closeInnerPop() {
        if (innerPop) { innerPop.remove(); innerPop = null; }
      }
      const FIELD_OPTS = {
        date: { title: '日期', type: 'radio', opts: [['12m', '过去 12 个月'], ['6m', '过去 6 个月'], ['30d', '过去 30 天'], ['7d', '过去 7 天'], ['24h', '过去 24 小时']] },
        status: { title: '状态', type: 'radio', opts: [['progress-set', '进行中'], ['creating', '创建中'], ['created', '已创建'], ['filling', '填写中'], ['to-finalize', '待定稿'], ['signing', '签署中'], ['signed', '已签署'], ['completed', '已完成'], ['overdue', '已逾期'], ['revoked', '已撤销']] },
        sender: { title: '发起人', type: 'radio', scopeOpts: true },
        quick: { title: '快捷筛选', type: 'radio', quickOpts: true },
        'created-at': { title: '发起时间', type: 'date' },
        'deadline': { title: '截止时间', type: 'date' },
        'finished-at': { title: '完成时间', type: 'date' },
        'subject': { title: '任务主题', type: 'text', ph: '主题包含关键词' },
        'task-id': { title: '任务编号', type: 'text', ph: '完整任务编号' },
        'biz-type': { title: '业务类型', type: 'text', ph: '业务类型' },
        'recipient': { title: '收件人', type: 'text', ph: '名称 / 手机号 / 证件号' },
        'creator': { title: '创建成员', type: 'text', ph: '成员姓名' },
        'sign-template': { title: '关联签署模板 ID', type: 'text', ph: '签署模板 ID' },
      };
      function fieldOpts(key) {
        const f = FIELD_OPTS[key];
        if (!f) return null;
        if (f.scopeOpts) {
          f.opts = currentScope === 'corp' ? [['corp-sent', '我方发起的'], ['corp-received', '我方收到的']] : [['me-created', '我创建的'], ['me-received', '我收到的']];
        }
        if (f.quickOpts) {
          f.opts = currentScope === 'corp'
            ? [['todo-corp', '待我方处理'], ['todo-other-side', '待他方处理'], ['todo-add-member', '待添加成员'], ['due-soon', '即将截止']]
            : [['todo-me', '待我处理'], ['todo-others', '待他人处理'], ['due-soon', '即将截止']];
        }
        return f;
      }
      function openInnerPop(row, key) {
        closeInnerPop();
        const f = fieldOpts(key);
        if (!f) { toast(`编辑「${row.querySelector('.filter-avail-row__desc').textContent}」（原有字段编辑器）`); return; }
        const pop = document.createElement('div');
        pop.className = 'filter-inner-pop';
        const applied = summaryDraft[key];
        let body = `<h4 class="filter-inner-pop__title">${f.title}</h4>`;
        if (f.type === 'radio') {
          body += `<div class="filter-popover__options" role="radiogroup">` + f.opts.map(([v, label]) =>
            `<label><input type="radio" name="inner-${key}" value="${v}" data-label="${label}" ${applied && applied.value === v ? 'checked' : ''} /> ${label}</label>`).join('') + `</div>`;
        } else {
          body += `<input type="text" class="filter-inner-pop__input" id="innerInput" placeholder="${f.ph || ''}" value="${applied ? applied.raw || '' : ''}" />`;
        }
        body += `<div class="filter-inner-pop__actions">
          <button type="button" class="filter-inner-pop__cancel">取消</button>
          <button type="button" class="filter-inner-pop__apply">应用</button>
        </div>`;
        pop.innerHTML = body;
        pop.style.position = 'fixed';
        document.body.appendChild(pop);
        /* 默认出现在行下方（fixed 锚定行位置），空间不够再翻转到上方 */
        const rect = row.getBoundingClientRect();
        const pw = 260;
        pop.style.width = pw + 'px';
        let top = rect.bottom + 6;
        pop.style.visibility = 'hidden';
        pop.style.top = '0px';
        pop.style.left = '0px';
        const ph = pop.offsetHeight;
        if (top + ph > window.innerHeight - 12) top = rect.top - ph - 6;
        let left = rect.left;
        if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
        pop.style.top = Math.max(12, top) + 'px';
        pop.style.left = Math.max(12, left) + 'px';
        pop.style.visibility = 'visible';
        innerPop = pop;
        pop.addEventListener('click', (ev) => ev.stopPropagation());
        pop.querySelector('.filter-inner-pop__cancel').addEventListener('click', closeInnerPop);
        pop.querySelector('.filter-inner-pop__apply').addEventListener('click', () => {
          if (f.type === 'radio') {
            const checked = pop.querySelector(`input[name="inner-${key}"]:checked`);
            if (!checked) { closeInnerPop(); return; }
            const label = checked.getAttribute('data-label');
            summaryDraft[key] = { value: checked.value, label: `${f.title}：${label}` };
          } else {
            const val = pop.querySelector('#innerInput').value.trim();
            if (!val) { summaryDraft[key] = null; }
            else summaryDraft[key] = { value: val, raw: val, label: `${f.title}：${val}` };
          }
          closeInnerPop();
          renderSummary();
        });
        /* 点外部关闭 */
        setTimeout(() => document.addEventListener('click', closeInnerPop, { once: true }), 0);
      }
      availBox.addEventListener('click', (e) => {
        const row = /** @type {HTMLElement} */ (e.target).closest('[data-avail-field]');
        if (!row) return;
        if (innerPop && row.contains(innerPop)) return;
        openInnerPop(row, row.getAttribute('data-avail-field'));
      });

      /* 全部清除 */

        Object.keys(summaryDraft).forEach((k) => { summaryDraft[k] = null; });
        renderSummary();
        toast('已清空草稿中的可编辑筛选（保存后生效）');
      });

      /* 保存：只提交一次查询 */

        summaryDraft = null;
        syncModalScrollLock();
        toast('已保存筛选并查询一次');

      });
    })();

    /** 列设置弹窗：草稿式编辑（勾选 + 上下移动），保存才应用并持久化（PRD 5.6） */
    function openColSettings() {

    function renderColModal() {
      const list = document.getElementById('colModalList');
      const q = (document.getElementById('colModalSearch').value || '').trim();
      /* 所有可编辑列位置固定（按当前列顺序），勾选只改选中态不挪动 */
      const fixedOrder = COL_DEFS.filter((d) => !d.fixed).map((d) => d.id);
      /* 已选列（colDraft 顺序）在前排？不，保持定义顺序；但要把用户已调过的顺序反映出来 */
      /* 展示顺序 = 当前生效列顺序（subject/actions 之间）+ 未选的按定义顺序排在其后 */
      const middle = colDraft.filter((id) => id !== 'subject' && id !== 'actions');
      const unselected = fixedOrder.filter((id) => !middle.includes(id));
      let order = [...middle, ...unselected];
      if (q) order = order.filter((id) => COL_DEFS.find((d) => d.id === id).label.includes(q));
      const dragSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
      const showFixed = !q;
      list.innerHTML = `
        ${showFixed ? `<li class="col-modal-item col-modal-item--fixed">
          <input type="checkbox" checked disabled aria-label="任务主题（固定）" />
          <span class="col-name">任务主题</span><span class="col-fixed-note">固定</span>
        </li>` : ''}
        ${order.length === 0 ? '<li class="col-modal-empty" style="padding:24px 0;text-align:center;color:var(--fdd-ink-3);font-size:13px">没有匹配的列</li>' : ''}
        ${order.map((id) => {
          const def = COL_DEFS.find((d) => d.id === id);
          const on = colDraft.includes(id);
          return `<li class="col-modal-item" data-col="${id}" draggable="true">
            <input type="checkbox" ${on ? 'checked' : ''} aria-label="${def.label}" />
            <span class="col-name">${def.label}</span>
            <span class="col-modal-drag" title="拖动排序" aria-hidden="true">${dragSvg}</span>
          </li>`;
        }).join('')}
        ${showFixed ? `<li class="col-modal-item col-modal-item--fixed">
          <input type="checkbox" checked disabled aria-label="操作（固定）" />
          <span class="col-name">操作</span><span class="col-fixed-note">固定</span>
        </li>` : ''}`;
    }

    document.getElementById('colModalSearch').addEventListener('input', () => renderColModal());

    document.getElementById('colModalList').addEventListener('change', (e) => {
      const cb = /** @type {HTMLInputElement} */ (e.target).closest('input[type="checkbox"]');
      if (!cb || cb.disabled) return;
      const item = /** @type {HTMLElement} */ (cb.closest('[data-col]'));
      const id = item.getAttribute('data-col');
      if (cb.checked) {
        if (!colDraft.includes(id)) colDraft.splice(colDraft.length - 1, 0, id);
        item.setAttribute('draggable', 'true');
      } else {
        colDraft = colDraft.filter((x) => x !== id);
        item.setAttribute('draggable', 'false');
      }
      /* 不重渲染，保持行位置固定 */
    });

    /* 拖拽排序（HTML5 DnD）：只能拖动可编辑列，落在可编辑区之间 */
    (function bindColDrag() {
      const list = document.getElementById('colModalList');
      let dragId = null;

      list.addEventListener('dragstart', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item) { e.preventDefault(); return; }
        dragId = item.getAttribute('data-col');
        item.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId);
        /* 用空 drag image，避免整行半透重影乱飘（指示线已足够表达落点） */
        const img = document.createElement('span');
        img.style.cssText = 'position:absolute;top:-9999px;';
        document.body.appendChild(img);
        e.dataTransfer.setDragImage(img, 0, 0);
        setTimeout(() => img.remove(), 0);
      });

      list.addEventListener('dragend', () => {
        list.querySelectorAll('.col-modal-item').forEach((el) => el.classList.remove('is-dragging', 'is-drop-target', 'is-drop-target-below'));
        dragId = null;
      });

      list.addEventListener('dragover', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item || !dragId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        list.querySelectorAll('.col-modal-item').forEach((el) => el.classList.remove('is-drop-target', 'is-drop-target-below'));
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        item.classList.add(before ? 'is-drop-target' : 'is-drop-target-below');
      });

      list.addEventListener('dragleave', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (item) item.classList.remove('is-drop-target', 'is-drop-target-below');
      });

      list.addEventListener('drop', (e) => {
        e.preventDefault();
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item || !dragId) return;
        const targetId = item.getAttribute('data-col');
        if (targetId === dragId) return;
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        const editable = colDraft.filter((x) => x !== 'subject' && x !== 'actions');
        const from = editable.indexOf(dragId);
        if (from >= 0) editable.splice(from, 1);
        let to = editable.indexOf(targetId);
        if (to < 0) to = before ? 0 : editable.length;
        else if (!before) to += 1;
        editable.splice(to, 0, dragId);
        colDraft = ['subject', ...editable, 'actions'];
        renderColModal();
      });
    })();

    document.getElementById('colModalReset').addEventListener('click', () => {
      colDraft = DEFAULT_COL_IDS.slice();

    /** 新建文件夹弹窗 */
    function openNewFolderModal() {
      const sel = document.getElementById('newFolderParent');
      /* 填充上级目录候选（根目录 + 所有非结构目录） */
      const flat = [];
      (function walk(nodes, path) {
        nodes.forEach((n) => {
          if (!n.structural) flat.push({ id: n.id, name: path ? `${path} / ${n.name}` : n.name });
          if (n.children) walk(n.children, path ? `${path} / ${n.name}` : n.name);
        });
      })(FOLDER_TREE, '');
      sel.innerHTML = '<option value="">（根目录）</option>' + flat.map((f) => `<option value="${f.id}">${f.name}</option>`).join('');
      const nameInput = document.getElementById('newFolderName');
      nameInput.value = '';
      document.getElementById('newFolderError').hidden = true;
      document.getElementById('newFolderSave').disabled = true;
      document.getElementById('newFolderModal').hidden = false;
      syncModalScrollLock();
      setTimeout(() => nameInput.focus(), 50);
    }
    document.getElementById('newFolderName').addEventListener('input', (e) => {
      document.getElementById('newFolderSave').disabled = !e.target.value.trim();
      document.getElementById('newFolderError').hidden = true;
    });
    document.getElementById('newFolderSave').addEventListener('click', () => {
      const name = document.getElementById('newFolderName').value.trim();
      const parentId = document.getElementById('newFolderParent').value;
      const err = document.getElementById('newFolderError');
      if (!name) return;
      /* 同级重名校验（原规则） */
      const siblings = parentId ? (findFolderNode(parentId)?.children || []) : FOLDER_TREE;
      if (siblings.some((n) => n.name === name)) {
        err.textContent = '同级目录下已存在同名文件夹';
        err.hidden = false;
        return;
      }
      const newNode = { id: 'folder-' + Date.now(), name, count: 0, children: [] };
      if (parentId) {
        const parent = findFolderNode(parentId);
        if (parent) {
          parent.children = parent.children || [];
          parent.children.push(newNode);
          openFolderIds.add(parentId);
        }
      } else {
        FOLDER_TREE.push(newNode);
      }
      document.getElementById('newFolderModal').hidden = true;
      syncModalScrollLock();
      const moduleEl = document.getElementById('folderModule');
      moduleEl.classList.add('is-open');
      rebuildFolderTree();
      toast(`已新建文件夹「${name}」`);
    });
    function findFolderNode(id) {
      let found = null;
      (function walk(nodes) {
        nodes.forEach((n) => {
          if (n.id === id) found = n;
          if (n.children) walk(n.children);
        });
      })(FOLDER_TREE);
      return found;
    }

    /** 查找文件夹：选择要查看的文件夹弹窗 */
    let folderPickerSelected = null;
    function openFolderPicker() {
      folderPickerSelected = null;
      document.getElementById('folderPickerSearch').value = '';
      document.getElementById('folderPickerConfirm').disabled = true;
      renderFolderPicker();
      document.getElementById('folderPickerModal').hidden = false;
      syncModalScrollLock();
      setTimeout(() => document.getElementById('folderPickerSearch').focus(), 50);
    }
    function renderFolderPicker() {
      const tree = document.getElementById('folderPickerTree');
      const q = document.getElementById('folderPickerSearch').value.trim();
      const flat = [];
      (function walk(nodes, depth, path) {
        nodes.forEach((n) => {
          if (!n.structural) flat.push({ id: n.id, name: n.name, depth, full: path ? `${path} / ${n.name}` : n.name });
          if (n.children) walk(n.children, depth + 1, path ? `${path} / ${n.name}` : n.name);
        });
      })(FOLDER_TREE, 0, '');
      const items = q ? flat.filter((f) => f.name.includes(q) || f.full.includes(q)) : flat;
      if (!items.length) {
        tree.innerHTML = '<p class="folder-picker-empty">没有符合条件的文件夹</p>';
        return;
      }
      tree.innerHTML = items.map((f) => `
        <button type="button" class="folder-picker-item${folderPickerSelected === f.id ? ' is-selected' : ''}" data-pick-folder="${f.id}" style="padding-left:${8 + f.depth * 18}px" title="${f.full}">
          <span class="aip-icon aip-icon--sm" aria-hidden="true"><img class="aip-icon__svg" src="assets/icons/phosphor/regular/folder.svg" alt="" /></span>
          <span>${q ? f.full : f.name}</span>
        </button>`).join('');
    }
    document.getElementById('folderPickerSearch').addEventListener('input', renderFolderPicker);
    document.getElementById('folderPickerTree').addEventListener('click', (e) => {
      const item = /** @type {HTMLElement} */ (e.target).closest('[data-pick-folder]');
      if (!item) return;
      folderPickerSelected = item.getAttribute('data-pick-folder');
      document.querySelectorAll('.folder-picker-item').forEach((el) => el.classList.toggle('is-selected', el === item));
      document.getElementById('folderPickerConfirm').disabled = false;
    });
    document.getElementById('folderPickerConfirm').addEventListener('click', () => {
      if (!folderPickerSelected) return;
      const name = FOLDER_NAME_MAP[folderPickerSelected] || '文件夹';
      document.getElementById('folderPickerModal').hidden = true;

      const moduleEl = document.getElementById('folderModule');

      /* 展开到该目录的父链 */
      (function expandPath(nodes, target, trail) {
        nodes.forEach((n) => {
          if (n.id === target) trail.forEach((p) => openFolderIds.add(p));
          if (n.children) expandPath(n.children, target, [...trail, n.id]);
        });
      })(FOLDER_TREE, folderPickerSelected, []);
      rebuildFolderTree();
      if (!currentFolder) scopeBeforeFolder = currentScope;
      currentFolder = folderPickerSelected;
      currentLegacy = null;

      selectedIds.clear();
      render();
      toast(`已进入文件夹「${name}」`);

    /** 通用 data-toast 提示（整站契约） */
    document.body.addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      const toastBtn = t.closest('[data-toast]');
      if (toastBtn) toast(toastBtn.getAttribute('data-toast') || '');
      if (!t.closest('.row-menu') && !t.closest('[data-more]') && openMenuId) {
        closeRowMenu();
      }
    });

    render();
  </script>
  <script>
    /* 防御：主脚本若未能完成首次渲染（缓存/热更导致的状态错乱），自动无缓存重载一次 */
    window.addEventListener('load', function () {
      setTimeout(function () {
        var rows = document.querySelectorAll('#taskBody tr').length;
        var headCols = document.querySelectorAll('#taskHead th').length;
        if (rows === 0 && headCols === 0 && !sessionStorage.getItem('aip-reloaded')) {
          sessionStorage.setItem('aip-reloaded', '1');
          location.reload();
        } else {
          sessionStorage.removeItem('aip-reloaded');
        }
      }, 800);
    });
  </script>
</body>
</html>
