<!DOCTYPE html>
<html lang="zh-CN" data-skin="docusign">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>协议 · 签署任务列表结构调整 0.1（AIP）</title>
  <!--
    AIP 0.1 · 签署任务列表结构调整（r21）。
    在 AIP v1 典型页面基础上实现：一级导航“协议”；全部任务 / 草稿 / 进行中 / 已完成状态入口；
    访问范围（我的签署 / 全部签署）；日期、状态、发起人、快捷筛选与筛选汇总；任务文件夹独立页；
    记录与处理五项原页面归集。默认皮肤 DocuSign 风（法大大蓝）；可切 LibraTech 悬浮侧栏风。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/components/fdd-home/home.css" />
  <style>
    :root {
      --fdd-brand: #0059ef;
      --fdd-brand-hover: #004ed6;
      --fdd-brand-deep: #174ea6;
      --fdd-brand-soft: #e8f1ff;
      --fdd-accent: #42c5ff;
      --fdd-ink: rgba(28, 43, 51, 0.9);
      --fdd-ink-2: rgba(28, 43, 51, 0.7);
      --fdd-ink-3: rgba(28, 43, 51, 0.5);
      --fdd-ink-muted: rgba(28, 43, 51, 0.62);
      --fdd-line: rgba(28, 43, 51, 0.14);
      --fdd-line-soft: rgba(28, 43, 51, 0.08);
      --fdd-line-strong: rgba(28, 43, 51, 0.5);
      --fdd-bg: #ffffff;
      --fdd-bg-sidebar: #f5f7f8;
      --fdd-bg-hover: rgba(28, 43, 51, 0.05);
      --fdd-bg-active: rgba(28, 43, 51, 0.1);
      --fdd-bg-muted: rgba(28, 43, 51, 0.05);
      --fdd-danger: #c4313b;
      --fdd-success: #00875c;
      --fdd-font: "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      --fdd-header-h: 64px;
      --fdd-sidebar-w: 280px;
      --fdd-radius: 4px;
      --fdd-radius-pill: 9999px;
      --fdd-tab-indicator: 3px;
      --fdd-table-head-h: 44px;
      --fdd-table-row-h: 67px;
      --fdd-progress-h: 3px;
      --fdd-progress-radius: 0;
      --fdd-shadow-dropdown: none;
      --fdd-shadow-menu: none;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--fdd-font);
      color: var(--fdd-ink);
      background: var(--fdd-bg);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.4;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    .ico { flex-shrink: 0; display: block; }

    /* AIP v0 Icon（docs/icons.md · Phosphor） */
    .aip-icon {
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; line-height: 1; color: var(--fdd-ink-2);
    }
    .aip-icon__svg { display: block; width: 1em; height: 1em; }
    .aip-icon--sm { font-size: 16px; width: 16px; height: 16px; }
    .aip-icon--md { font-size: 20px; width: 20px; height: 20px; }
    .nav-btn .aip-icon,
    .nav-tool .aip-icon,
    .folder-head .aip-icon { color: inherit; }

    /* —— Header（对齐 DocuSign 顶栏：logo + 分隔 + 全高 Tab 下划线） —— */
    .app-header {
      position: sticky; top: 0; z-index: 40;
      height: var(--fdd-header-h);
      display: flex; align-items: stretch; justify-content: space-between;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--fdd-line);
    }
    .header-left {
      display: flex; align-items: stretch; min-width: 0; height: 100%;
    }
    .brand {
      display: flex; align-items: center;
      align-self: center;
      min-width: 58px; height: 29px;
      text-decoration: none; flex: none;
    }
    .brand img {
      display: block; border: 0;
      width: auto; height: 29px; max-height: 29px; /* 原 36px × 80% */
    }
    .header-tabs {
      display: flex; list-style: none; margin: 0; padding: 0; height: 100%;
      margin-inline-start: 64px; /* 原分隔线前 40px + 再加大 24px */
    }
    .header-tabs li { display: flex; height: 100%; }
    .header-tabs button {
      position: relative;
      display: flex; align-items: center;
      height: 100%; padding: 0 24px; border: 0; border-radius: 0;
      background: transparent;
      color: var(--fdd-ink-2);
      font-size: 16px; font-weight: 600; line-height: 24px;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s;
    }
    .header-tabs button::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0;
      height: var(--fdd-tab-indicator); width: 100%; margin: auto;
      background: transparent;
      transition: background-color 0.2s;
    }
    .header-tabs button:hover {
      color: var(--fdd-ink); background: var(--fdd-bg-hover); text-decoration: none;
    }
    .header-tabs button.active { color: var(--fdd-brand); }
    .header-tabs button.active::after { background: var(--fdd-brand); }
    .header-right { display: flex; align-items: center; gap: 0; height: 100%; }
    .btn-upgrade {
      height: 32px; margin-right: 8px; padding: 4px 8px; border: 0; border-radius: var(--fdd-radius-pill);
      background: var(--fdd-brand); color: #fff;
      font-size: 14px; font-weight: 500; line-height: 20px;
    }
    .btn-upgrade:hover { background: var(--fdd-brand-hover); }
    .icon-btn {
      width: 44px; height: 100%; display: grid; place-items: center;
      border: 0; border-radius: 0; background: transparent; color: var(--fdd-ink-2);
      transition: background-color 0.2s, color 0.2s;
    }
    .icon-btn:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .avatar-wrap { position: relative; }
    .avatar {
      width: 32px; height: 32px; padding: 0;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: #e8f1ff; color: var(--fdd-brand);
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .avatar-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 80;
      width: 248px; padding: 6px;
      border: 0; border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(28, 43, 51, 0.06), 0 12px 32px rgba(28, 43, 51, 0.16), 0 24px 64px rgba(28, 43, 51, 0.12);
      animation: nsPopoverIn 0.15s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: top right;
    }
    .avatar-menu[hidden] { display: none !important; }
    .avatar-menu__head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px 12px; border-bottom: 1px solid var(--fdd-line-soft);
    }
    .avatar--lg { width: 40px; height: 40px; font-size: 15px; }
    .avatar-menu__info b { display: block; font-size: 14px; font-weight: 600; color: var(--fdd-ink); line-height: 20px; }
    .avatar-menu__info small { display: block; font-size: 12px; color: var(--fdd-ink-3); line-height: 16px; }
    .avatar-menu__list { padding: 4px 0; }
    .avatar-menu__list button,
    .avatar-menu__foot button {
      width: 100%; height: 34px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 13px; text-align: left; cursor: pointer;
    }
    .avatar-menu__list button:hover,
    .avatar-menu__foot button:hover { background: var(--fdd-bg-hover); }
    .avatar-menu__foot { padding: 4px 0 2px; border-top: 1px solid var(--fdd-line-soft); }
    .avatar-menu__foot button { color: var(--fdd-danger); }
      width: 64px; height: 100%; padding: 0 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 9999px;
      display: grid; place-items: center;
      background: #caf4fc; color: #035a6c; font-size: 14px; font-weight: 600;
    }
    @media (max-width: 1100px) {
      .header-tabs button { padding: 0 12px; }
      .header-tabs { margin-inline-start: 40px; }
    }

    /* —— Shell —— */
    .page-shell { display: flex; min-height: calc(100vh - var(--fdd-header-h)); }
    .view-home {
      display: none;
      min-height: calc(100vh - var(--fdd-header-h));
      overflow: auto;
    }
    body[data-view="home"] .page-shell { display: none; }
    body[data-view="home"] .view-home { display: flex; }
    body[data-view="contracts"] .view-home { display: none; }
    body[data-view="contracts"] .page-shell { display: flex; }
    .contract-sidebar {
      width: var(--fdd-sidebar-w); flex: 0 0 var(--fdd-sidebar-w);
      background: var(--fdd-bg-sidebar);
      border-right: 1px solid var(--fdd-line-soft);
    }
    .contract-side-inner {
      height: calc(100vh - var(--fdd-header-h));
      display: flex; flex-direction: column;
    }
    .contract-start { height: 72px; flex: 0 0 72px; padding: 16px; }
    .contract-launch {
      width: 100%; height: 40px; padding: 0 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-brand); color: #fff;
      font-size: 16px; font-weight: 500; line-height: 24px;
    }
    .contract-launch:hover { background: var(--fdd-brand-hover); }
    /* —— 发起签署 hover 菜单（PRD 2.4：直接创建 / 模板创建 / 批量创建） —— */
    .launch-wrap { position: relative; width: 100%; height: 100%; }
    .contract-launch .launch-caret { margin-left: 0; transition: transform 0.15s; }
    .launch-wrap:hover .launch-caret,
    .launch-wrap.is-open .launch-caret { transform: rotate(180deg); }
    .launch-menu {
      position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 60;
      padding: 6px;
      border: 0; border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(28, 43, 51, 0.06), 0 12px 32px rgba(28, 43, 51, 0.16), 0 24px 64px rgba(28, 43, 51, 0.12);
      opacity: 0; visibility: hidden; transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
    }
    .launch-wrap:hover .launch-menu,
    .launch-wrap.is-open .launch-menu {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .launch-menu button {
      width: 100%; padding: 8px 10px;
      display: flex; align-items: center; gap: 10px;
      border: 0; border-radius: 8px; background: transparent;
      color: var(--fdd-ink); text-align: left; cursor: pointer;
    }
    .launch-menu button:hover { background: var(--fdd-bg-hover); }
    .launch-item-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .launch-item-text b { font-size: 14px; font-weight: 600; line-height: 20px; }
    .launch-item-text small { font-size: 12px; color: var(--fdd-ink-3); line-height: 16px; }
    .launch-menu .aip-icon { color: var(--fdd-ink); }
    .launch-menu button:hover .aip-icon { color: var(--fdd-brand); }
    .contract-nav-scroll {
      flex: 1; min-height: 0; overflow: auto;
      /* 对齐 DocuSign：细滚动条 + 浅色滑块，避免系统默认粗黑条 */
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 43, 51, 0.18) transparent;
    }
    .contract-nav-scroll::-webkit-scrollbar { width: 6px; }
    .contract-nav-scroll::-webkit-scrollbar-track { background: transparent; }
    .contract-nav-scroll::-webkit-scrollbar-thumb {
      background: rgba(28, 43, 51, 0.18);
      border-radius: 999px;
    }
    .contract-nav-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(28, 43, 51, 0.28);
    }

    .nav-btn {
      position: relative; width: 100%;
      display: flex; align-items: center; gap: 12px;
      border: 1px solid transparent; background: transparent;
      text-align: left; color: var(--fdd-ink); font-size: 14px; line-height: 19.6px;
    }
    .nav-btn:hover { background: var(--fdd-bg-hover); }
    .nav-btn.active { background: var(--fdd-bg-active); font-weight: 600; }
    .nav-btn.active::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      border-radius: 0; background: var(--fdd-brand);
    }
    .nav-primary { height: 48px; padding: 11px 15px 11px 23px; font-weight: 600; }
    .nav-secondary {
      height: 41.5px; padding: 11px 15px 11px 59px;
      color: var(--fdd-ink); font-weight: 400;
    }
    .nav-secondary.active { font-weight: 600; }

    /* DocuSign 式「文件夹」模块：折叠后只显示模块头，展开才出子项 */
    .folder-module {
      position: relative;
    }
    .folder-module-head {
      position: relative;
      height: 48px; padding: 0;
      display: flex; align-items: center;
      width: 100%;
    }
    .folder-module-head:hover { background: var(--fdd-bg-hover); }
    /* 点「文件夹」一级选中：与 .nav-btn.active 同款 */
    .folder-module-head.is-active {
      background: var(--fdd-bg-active);
    }
    .folder-module-head.is-active::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--fdd-brand);
    }
    .folder-module-toggle {
      flex: 1; min-width: 0; height: 100%; padding: 0 4px 0 23px;
      display: inline-flex; align-items: center; gap: 12px;
      border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 14px; font-weight: 600; text-align: left;
    }
    .folder-module-toggle:hover { background: transparent; }
    .folder-module-more {
      width: 48px; height: 100%; flex-shrink: 0;
      display: grid; place-items: center;
      border: 0; border-radius: 0; background: transparent; color: var(--fdd-ink-2);
    }
    .folder-module-more:hover { background: transparent; color: var(--fdd-ink); }
    .folder-module-body { display: none; }
    .folder-module.is-open .folder-module-body { display: block; }
    .folder-item {
      position: relative;
      width: 100%; height: 40px; margin-left: 0;
      padding: 0 15px 0 59px;
      display: flex; align-items: center; gap: 8px;
      border: 0; background: transparent; color: var(--fdd-ink); font-size: 14px; text-align: left;
      box-sizing: border-box;
    }
    .folder-item:hover { background: var(--fdd-bg-hover); }
    /* 二级文件夹选中：与 .nav-btn.active 一致 */
    .folder-item.active {
      background: var(--fdd-bg-active);
      font-weight: 600;
    }
    .folder-item.active::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      border-radius: 0; background: var(--fdd-brand);
    }
    .folder-item span {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .folder-item b {
      margin-left: auto; flex-shrink: 0;
      min-width: 24px; height: 20px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      border-radius: 2px; background: rgba(28, 43, 51, 0.08);
      color: var(--fdd-ink-2); font-size: 11px; font-weight: 500;
      line-height: 1; text-align: center;
    }

    /* —— AIP 0.1：任务文件夹树（子级缩进 20px / 结构父级 / 查找 / 更多菜单） —— */
    .folder-more-menu {
      position: absolute; top: 44px; right: 8px; z-index: 40;
      width: 168px; padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 6px;
      background: #fff; box-shadow: 0 4px 16px rgba(28, 43, 51, 0.18);
    }
    .folder-more-menu[hidden] { display: none !important; }
    .folder-more-menu button {
      width: 100%; height: 32px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; font-size: 13px; color: var(--fdd-ink);
    }
    .folder-more-menu button:hover { background: var(--fdd-bg-hover); }
    .folder-search {
      display: flex; align-items: center; gap: 6px;
      margin: 8px 12px 4px 23px; padding: 0 8px;
      height: 30px; border: 1px solid var(--fdd-line); border-radius: var(--fdd-radius);
      background: #fff;
    }
    .folder-search[hidden] { display: none !important; }
    .folder-search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px;
    }
    .folder-tree-row {
      display: flex; align-items: center; width: 100%;
      position: relative;
    }
    .folder-tree-row:hover { background: var(--fdd-bg-hover); }
    .folder-tree-row.active { background: var(--fdd-bg-active); }
    .folder-tree-row.active::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--fdd-brand);
    }
    .folder-tree-caret {
      width: 20px; height: 40px; flex-shrink: 0;
      display: grid; place-items: center;
      border: 0; background: transparent; color: var(--fdd-ink-3);
    }
    .folder-tree-caret svg { transition: transform 0.15s; }
    .folder-tree-row.is-open > .folder-tree-caret svg { transform: rotate(180deg); }
    .folder-tree-caret.is-leaf { visibility: hidden; }
    .folder-tree-item {
      flex: 1; min-width: 0; height: 40px; padding-right: 8px;
      display: flex; align-items: center; gap: 8px;
      border: 0; background: transparent; color: var(--fdd-ink); font-size: 14px; text-align: left;
    }
    .folder-tree-row.active .folder-tree-item { font-weight: 600; }
    .folder-tree-item span {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .folder-tree-item b {
      margin-left: auto; flex-shrink: 0;
      min-width: 24px; height: 20px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      border-radius: 2px; background: rgba(28, 43, 51, 0.08);
      color: var(--fdd-ink-2); font-size: 11px; font-weight: 500;
      line-height: 1; text-align: center;
    }
    .folder-tree-item.is-structural span { color: var(--fdd-ink-3); }
    /* 文件夹行 ⋯ 节点操作按钮（hover 显示） */
    .folder-node-more {
      width: 28px; height: 28px; margin-right: 6px; flex-shrink: 0;
      display: none; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink-2);
      cursor: pointer;
    }
    .folder-tree-row:hover .folder-node-more,
    .folder-node-more.is-open { display: grid; }
    .folder-node-more:hover { background: var(--fdd-bg-hover-strong, #e8ebef); color: var(--fdd-ink); }
    /* 节点操作菜单 */
    .folder-node-menu {
      position: fixed; z-index: 90;
      min-width: 140px; padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 8px;
      background: #fff; box-shadow: var(--fdd-shadow-menu, 0 4px 16px rgba(28, 43, 51, 0.16));
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .folder-node-menu[hidden] { display: none !important; }
    .folder-node-menu button {
      width: 100%; height: 32px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; font-size: 13px; color: var(--fdd-ink);
    }
    .folder-node-menu button:hover { background: var(--fdd-bg-hover); }
    .folder-tree-empty {
      margin: 0; padding: 8px 15px 12px 59px;
      color: var(--fdd-ink-3); font-size: 13px; line-height: 18px;
    }

    /* —— AIP 0.1：记录与处理折叠分组 —— */
    .records-module { }
    .records-module-toggle {
      width: 100%; height: 48px; padding: 0 15px 0 23px;
      display: flex; align-items: center; gap: 12px;
      border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 14px; font-weight: 600; text-align: left;
    }
    .records-module-toggle:hover { background: var(--fdd-bg-hover); }
    .records-caret { margin-left: auto; flex-shrink: 0; color: var(--fdd-ink-3); transition: transform 0.15s; }
    .records-module.is-collapsed .records-caret { transform: rotate(-90deg); }
    .records-module.is-collapsed .records-module-body { display: none; }
    .records-module-body .nav-secondary { padding-left: 59px; }

    .nav-section {
      margin-top: 8px; padding-top: 8px;
      position: relative;
    }
    .nav-section::before {
      content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
      background: var(--fdd-line-soft);
    }
    .nav-tool {
      width: 100%; height: 48px; padding: 11px 15px 11px 23px;
      display: flex; align-items: center; gap: 12px;
      border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 14px; text-align: left;
    }
    .nav-tool:hover { background: var(--fdd-bg-hover); }
    .nav-tool .badge-new {
      margin-left: auto; flex-shrink: 0;
      min-width: 24px; height: 20px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      border-radius: 2px; background: rgba(28, 43, 51, 0.08);
      color: var(--fdd-ink-2); font-size: 11px; font-weight: 500;
      line-height: 1; text-align: center;
    }

    /* —— Main（扁平内容区，无装饰渐变） —— */
    .contracts-page-content {
      flex: 1; min-width: 0; background: #fff;
    }
    .contracts-workspace {
      position: relative;
      width: calc(100% - 80px); max-width: 1448px;
      margin: 0 auto; padding: 32px 0 24px;
    }
    .contracts-titlebar {
      height: 40px; display: flex; align-items: center;
      margin-bottom: 24px;
    }
    .contracts-titlebar h1 {
      margin: 0; font-size: 32px; font-weight: 400; line-height: 40px;
      letter-spacing: -0.32px; color: var(--fdd-ink);
    }
    .title-meta { display: none; }

    .envelope-controls {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 0;
      margin-bottom: 8px; min-height: 44px;
      position: relative; z-index: 5;
    }
    .envelope-search {
      position: relative;
      width: 284px; min-width: 160px; flex-shrink: 1; height: 32px; margin: 6px 16px 6px 0; padding: 0 8px 0 10px;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff;
    }
    .envelope-search:focus-within { border-color: var(--fdd-brand); outline: 2px solid var(--fdd-brand-soft); outline-offset: 0; }
    .envelope-search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px;
    }
    .envelope-search input::-webkit-search-cancel-button { appearance: none; }
    .envelope-search__clear {
      display: none; flex-shrink: 0;
      width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: var(--fdd-ink-3); font-size: 14px; line-height: 1; cursor: pointer;
    }
    .envelope-search__clear:not([hidden]) { display: grid; place-items: center; }
    .envelope-search__clear:hover { color: var(--fdd-ink); }
    .envelope-filters {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; flex: 1; min-width: 0;
    }
    .filter-triggers { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 8px; min-width: 0; }
    /* 折叠态：隐藏的触发器完全占位 */
    .filter-field.is-collapsed { display: none !important; }
    .filter-collapse-btn { flex-shrink: 0; }
    /* hidden 属性强制隐藏（.filter-trigger 的 display:flex 会覆盖默认 [hidden]） */
    #filterSummaryBtn[hidden] { display: none !important; }
    .filter-chips {
      display: none; align-items: center; flex-wrap: wrap; gap: 0;
    }
    .filter-chips:not(:empty) { display: inline-flex; }
    .filter-chips:not(:empty) + .filter-sep { display: block; }
    .filter-chip {
      height: 32px; margin-right: 0;
      display: inline-flex; align-items: stretch;
      border-radius: var(--fdd-radius); overflow: hidden;
      background: var(--fdd-bg-muted); color: var(--fdd-ink); font-size: 14px; white-space: nowrap;
    }
    .filter-chip + .filter-chip { margin-left: 8px; }
    .filter-chip__label {
      display: inline-flex; align-items: center; padding: 0 8px 0 12px;
      font-weight: 500;
    }
    .filter-chip__remove {
      width: 32px; border: 0; background: transparent; color: var(--fdd-ink);
      display: grid; place-items: center; cursor: pointer; font-size: 16px; line-height: 1;
    }
    .filter-chip__remove:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .filter-sep {
      display: none; width: 1px; height: 26px; margin: 0 8px 0 8px;
      background: var(--fdd-line); flex-shrink: 0;
    }
    .filter-triggers {
      display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .filter-field {
      position: relative;
    }
    .filter-field[hidden] { display: none !important; }
    .filter-trigger {
      height: 32px; padding: 0 10px 0 12px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 14px; white-space: nowrap;
      cursor: pointer;
    }
    .filter-trigger:hover { background: var(--fdd-bg-hover); }
    .filter-field.is-open .filter-trigger {
      background: var(--fdd-bg-muted); border-color: var(--fdd-line-strong);
    }
    .filter-trigger .aip-icon { color: var(--fdd-ink-2); }
    /* 已应用：触发按钮变灰底 chip（对齐典型页"状态：所选值 ×"） */
    .filter-field.is-applied .filter-trigger {
      border-color: transparent; background: var(--fdd-bg-muted); font-weight: 500;
      gap: 0; padding: 0;
    }
    .filter-field.is-applied .filter-trigger__label { padding: 0 10px 0 12px; }
    /* 文案与清除 × 之间的竖向分割线（对齐典型页） */
    .filter-trigger__clear {
      display: inline-grid; place-items: center;
      width: 32px; height: 100%; margin-left: 0;
      border-radius: 0; color: var(--fdd-ink); font-size: 16px; line-height: 1;
      cursor: pointer;
      border-left: 1px solid var(--fdd-line);
    }
    .filter-trigger__clear:hover { background: var(--fdd-bg-hover-strong, #e8ebef); color: var(--fdd-ink); }
    .filter-trigger__clear[hidden] { display: none !important; }
    .filter-trigger .aip-icon[hidden] { display: none !important; }
    /* 已应用筛选与未应用下拉之间的竖向分割线 */
    .filter-sep-applied {
      display: inline-block; width: 1px; height: 22px; margin: 0 8px 0 0;
      background: var(--fdd-line); align-self: center; flex-shrink: 0;
    }
    .filter-popover {
      position: absolute; top: calc(100% + 10px); left: 0; z-index: 50;
      width: 248px; padding: 14px 14px 10px;
      border-radius: 6px; background: #fff;
      box-shadow: 0 4px 16px rgba(28, 43, 51, 0.18);
      color: var(--fdd-ink);
    }
    .filter-popover[hidden] { display: none !important; }
    .filter-popover::before {
      content: ""; position: absolute; top: -6px; left: 28px;
      width: 10px; height: 10px;
      background: #fff;
      border-left: 1px solid rgba(28, 43, 51, 0.08);
      border-top: 1px solid rgba(28, 43, 51, 0.08);
      transform: rotate(45deg);
    }
    .filter-popover__title {
      margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;
    }
    .filter-popover__sub {
      margin: 2px 0 10px; font-size: 12px; color: var(--fdd-ink-3); line-height: 16px;
    }
    .filter-popover__op {
      width: 72px; height: 32px; margin-bottom: 10px; padding: 0 8px;
      display: inline-flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; font-size: 14px; color: var(--fdd-ink);
    }
    .filter-popover__options {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
    }
    .filter-popover__options label {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; cursor: pointer; line-height: 20px;
    }
    .filter-popover__options input {
      width: 16px; height: 16px; margin: 0; accent-color: var(--fdd-brand);
    }
    .filter-popover__actions {
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .filter-popover__cancel {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-bg-muted); color: var(--fdd-ink); font-size: 14px; font-weight: 600;
    }
    .filter-popover__cancel:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .filter-popover__apply {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-brand); color: #fff; font-size: 14px; font-weight: 600;
    }
    .filter-popover__apply:hover { background: var(--fdd-brand-hover); }
    .filter-popover__clear {
      height: 32px; padding: 0 10px; margin-right: auto; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; cursor: pointer;
    }
    .filter-popover__clear:hover { text-decoration: underline; }
    .filter-popover__options--scroll { max-height: 264px; overflow: auto; padding-right: 4px; }

    /* —— AIP 0.1：范围选择器 / 应用条件行 / 导出刷新 / 批量工具条 —— */
    .contracts-titlebar .scope-switch { margin-left: auto; }
    .scope-switch {
      padding: 2px;
      display: inline-flex; align-items: center; gap: 2px;
      border-radius: var(--fdd-radius); background: var(--fdd-bg-muted);
    }
    .scope-switch[hidden] { display: none !important; }
    .scope-switch button {
      height: 28px; padding: 0 12px; border: 0; border-radius: 3px;
      background: transparent; color: var(--fdd-ink-2);
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    }
    .scope-switch button.is-on {
      background: #fff; color: var(--fdd-ink); font-weight: 600;
      box-shadow: 0 1px 2px rgba(28, 43, 51, 0.12);
    }
    .toolbar-icon-btn {
      width: 32px; height: 32px; margin-left: 4px;
      display: inline-grid; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink-2);
    }
    .toolbar-icon-btn:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .toolbar-icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
      width: 184px; padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 6px;
      background: #fff; box-shadow: 0 4px 16px rgba(28, 43, 51, 0.18);
    }
    .export-menu[hidden] { display: none !important; }
    .export-menu button {
      width: 100%; height: 32px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; font-size: 13px; color: var(--fdd-ink);
    }
    .export-menu button:hover { background: var(--fdd-bg-hover); }
    .export-menu button:disabled { color: var(--fdd-ink-3); cursor: not-allowed; background: transparent; }
    .export-wrap { position: relative; display: inline-flex; }

    .applied-row {
      display: none; align-items: center; flex-wrap: wrap; gap: 8px;
      margin: 8px 0 12px; font-size: 13px; color: var(--fdd-ink-3);
    }
    .applied-row:not(:empty) { display: flex; }
    .applied-row .filter-chip { height: 28px; }
    .applied-row .filter-chip__remove { width: 28px; }
    .applied-chip--fixed .filter-chip__remove { display: none; }
    .applied-clearall {
      height: 28px; padding: 0 4px; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .applied-clearall:hover { text-decoration: underline; }

    /* 批量操作：悬浮在列表上方的同风格投影卡片 */
    /* 批量操作：出现在表头上方的横条（DocuSign 式），替换筛选行 */
    .batch-bar {
      display: none; align-items: center; gap: 8px;
      position: absolute; bottom: calc(100% + 8px); left: 0; right: 0;
      z-index: 30;
      padding: 8px 14px;
      border: 1px solid var(--fdd-line); border-radius: 10px;
      background: #fff; color: var(--fdd-ink); font-size: 13px;
      box-shadow: var(--fdd-shadow-menu);
      animation: nsBatchIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes nsBatchIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .batch-bar.is-on { display: flex; }
    /* 批量条出现时，表格下移让出空间（批量条出现在表头上方，与筛选行并存） */
    .envelope-table-shell:has(.batch-bar.is-on) { margin-top: 56px; }
    #batchCount { color: var(--fdd-ink-2); font-weight: 500; margin-right: 4px; }
    .batch-bar button {
      height: 30px; padding: 0 12px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 13px; font-weight: 500;
    }
    .batch-bar button:hover { background: var(--fdd-bg-hover); }
    .batch-bar .batch-primary {
      border-color: var(--fdd-brand); background: var(--fdd-brand); color: #fff;
    }
    .batch-bar .batch-primary:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }

    /* —— AIP 0.1：状态列待办 / 等待 / 进度 —— */
    .envelope-state { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .todo-text {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 12px; line-height: 17px;
    }
    .todo-text--mine { color: var(--fdd-brand); font-weight: 600; }
    .todo-text--waiting {
      color: var(--fdd-brand);
      border-bottom: 1px dashed rgba(0, 89, 239, 0.5); cursor: pointer;
    }
    .todo-text--plain { color: var(--fdd-ink-2); }
    .envelope-progress-label {
      display: flex; justify-content: space-between; width: 100%;
      color: var(--fdd-ink-3); font-size: 11px; line-height: 14px;
    }
    .envelope-state.is-completed .status-check {
      flex-shrink: 0; width: 20px; height: 20px; color: var(--fdd-success);
    }
    .envelope-state.is-completed .todo-text { border-bottom: 0; font-size: 14px; line-height: 20px; }

    /* —— AIP 0.1：行内浮层（收件人名单 / 等待名单） —— */
    .pop-wrap { position: relative; display: inline-block; max-width: 100%; z-index: 5; }
    .mini-popover {
      position: fixed; z-index: 95;
      width: 264px; padding: 12px 0 8px;
      border: 1px solid var(--fdd-line); border-radius: 6px;
      background: #fff; box-shadow: 0 4px 16px rgba(28, 43, 51, 0.18);
      animation: nsPopoverIn 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: top left;
    }
    @keyframes nsPopoverIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .mini-popover[hidden] { display: none !important; }
    .mini-popover__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px 8px; border-bottom: 1px solid var(--fdd-line-soft);
      font-size: 13px; font-weight: 600; color: var(--fdd-ink);
    }
    .mini-popover__close {
      width: 24px; height: 24px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-3); font-size: 14px; cursor: pointer;
    }
    .mini-popover__close:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .mini-popover__list {
      max-height: 260px; overflow: auto; padding: 8px 12px 0;
      scrollbar-width: thin; scrollbar-color: rgba(28, 43, 51, 0.18) transparent;
    }
    .mini-popover__item { padding: 6px 0; border-bottom: 1px solid var(--fdd-line-soft); }
    .mini-popover__item:last-child { border-bottom: 0; }
    .mini-popover__item .p-name { display: block; color: var(--fdd-ink); font-size: 13px; line-height: 18px; }
    .mini-popover__item .p-time { display: block; color: var(--fdd-ink-3); font-size: 12px; line-height: 16px; margin-top: 2px; }
    .party-more-btn {
      padding: 0 2px; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .party-more-btn:hover { text-decoration: underline; }
    .folder-link {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink-2); font-size: 14px; cursor: pointer;
    }
    .folder-link:hover { color: var(--fdd-brand); text-decoration: underline; }

    /* —— AIP 0.1：筛选汇总模态 / 选择收件人 / 原有页面承载 —— */
    body.is-modal-open { overflow: hidden; }
    .envelope-table-shell.is-pop-locked { overflow: hidden !important; }
    .ns-modal-mask {
      position: fixed; inset: 0; z-index: 80;
      display: grid; place-items: center;
      background: rgba(28, 43, 51, 0.42);
      animation: nsMaskIn 0.16s ease;
    }
    .ns-modal-mask[hidden] { display: none !important; }
    @keyframes nsMaskIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .ns-modal {
      width: 560px; max-width: calc(100vw - 48px); max-height: calc(100vh - 96px);
      display: flex; flex-direction: column;
      border-radius: 8px; background: #fff;
      box-shadow: 0 12px 40px rgba(28, 43, 51, 0.24);
      animation: nsModalIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes nsModalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ns-modal--wide { width: 640px; }
    .ns-modal__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .ns-modal__head h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 26px; }
    .ns-modal__close {
      width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink-3); font-size: 16px; cursor: pointer;
    }
    .ns-modal__close:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .ns-modal__body { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 8px; }
    .ns-modal__foot {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px;
      padding: 12px 20px 16px; border-top: 1px solid var(--fdd-line-soft);
    }
    .ns-modal__foot--split { justify-content: space-between; }
    .ns-modal__foot-right { display: inline-flex; gap: 8px; }
    .ns-modal__foot .btn-ghost {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-bg-muted); color: var(--fdd-ink); font-size: 14px; font-weight: 600;
    }
    .ns-modal__foot .btn-ghost:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .ns-modal__foot .btn-solid {
      height: 32px; padding: 0 14px; border: 0; border-radius: var(--fdd-radius);
      background: var(--fdd-brand); color: #fff; font-size: 14px; font-weight: 600;
    }
    .ns-modal__foot .btn-solid:hover { background: var(--fdd-brand-hover); }
    .ns-modal__foot .btn-solid:disabled { opacity: 0.45; cursor: not-allowed; }

    .ns-modal--filter { width: 480px; }
    .filter-applied-card {
      margin-bottom: 14px; padding: 12px 14px;
      border-radius: 8px; background: var(--fdd-bg-muted);
    }
    .filter-applied-card__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; font-size: 14px; font-weight: 600; color: var(--fdd-ink);
    }
    .filter-applied-card__clearall {
      height: 30px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 13px; cursor: pointer;
    }
    .filter-applied-card__clearall:hover { background: var(--fdd-bg-hover-strong, #e8ebef); }
    .filter-applied-card__chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-applied-chip {
      height: 30px; padding: 0 0 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: var(--fdd-radius); background: #fff;
      border: 1px solid var(--fdd-line); color: var(--fdd-ink); font-size: 13px;
      overflow: hidden;
    }
    .filter-applied-chip button {
      width: 28px; height: 100%; border: 0; border-radius: 0;
      background: transparent; color: var(--fdd-ink); font-size: 14px; cursor: pointer;
      display: grid; place-items: center;
      border-left: 1px solid var(--fdd-line);
    }
    .filter-applied-chip button:hover { background: var(--fdd-bg-hover-strong, #e8ebef); color: var(--fdd-ink); }
    .filter-avail-row {
      width: 100%; padding: 8px 10px;
      display: flex; align-items: center; gap: 14px;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; cursor: pointer;
    }
    .filter-avail-row:hover { background: var(--fdd-bg-hover); }
    .filter-avail-row__pill {
      flex-shrink: 0; height: 32px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 13px;
    }
    .filter-avail-row__pill .aip-icon { color: var(--fdd-ink-2); }
    .filter-avail-row__desc { color: var(--fdd-ink-3); font-size: 13px; }
    /* 筛选面板内层编辑浮层 */
    .filter-inner-pop {
      position: absolute; z-index: 20;
      min-width: 240px; padding: 14px 14px 10px;
      border: 1px solid var(--fdd-line); border-radius: 8px;
      background: #fff; box-shadow: 0 8px 28px rgba(28, 43, 51, 0.2);
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .filter-inner-pop[hidden] { display: none !important; }
    .filter-inner-pop__title { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
    .filter-inner-pop .filter-popover__options { margin-bottom: 12px; }
    .filter-inner-pop__input {
      width: 100%; height: 34px; padding: 0 10px; box-sizing: border-box;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      font-size: 14px; color: var(--fdd-ink); outline: none; margin-bottom: 12px;
    }
    .filter-inner-pop__input:focus { border-color: var(--fdd-brand); box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16); }
    .filter-inner-pop__actions { display: flex; justify-content: flex-end; gap: 8px; }
    .filter-inner-pop__actions button {
      height: 30px; padding: 0 12px; border: 0; border-radius: var(--fdd-radius);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .filter-inner-pop__cancel { background: var(--fdd-bg-muted); color: var(--fdd-ink); }
    .filter-inner-pop__apply { background: var(--fdd-brand); color: #fff; }
    .filter-inner-pop__apply:hover { background: var(--fdd-brand-hover); }
    .filter-modal-search {
      position: relative; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 10px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
    }
    .filter-modal-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; }
    .filter-modal-group { margin-bottom: 12px; }
    .filter-modal-group > h3 {
      margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--fdd-ink-3);
    }
    .filter-modal-item {
      width: 100%; min-height: 34px; height: auto; padding: 6px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 14px; text-align: left; cursor: pointer;
    }
    .filter-modal-item:hover { background: var(--fdd-bg-hover); }
    .filter-modal-item .val { color: var(--fdd-ink-3); font-size: 13px; }
    .filter-modal-empty { margin: 24px 0; text-align: center; color: var(--fdd-ink-3); font-size: 13px; }
    .filter-modal-clearall {
      border: 0; background: transparent; color: var(--fdd-brand);
      font-size: 13px; cursor: pointer; padding: 0;
    }
    .filter-modal-clearall:hover { text-decoration: underline; }

    .party-dialog-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .party-dialog-table th, .party-dialog-table td {
      padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--fdd-line-soft);
    }
    .party-dialog-table th { color: var(--fdd-ink-3); font-weight: 500; }
    .party-dialog-table input { width: 16px; height: 16px; margin: 0; accent-color: var(--fdd-brand); }
    .party-dialog-scroll { max-height: 320px; overflow: auto; }

    .legacy-page {
      display: none; padding: 64px 0; text-align: center;
    }
    body[data-page-mode="legacy"] .contracts-workspace { display: none; }
    .legacy-page.is-on { display: block; }
    .legacy-page h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; color: var(--fdd-ink); }
    .legacy-page p { margin: 0 auto 20px; max-width: 520px; color: var(--fdd-ink-3); font-size: 14px; line-height: 22px; }
    .legacy-page .legacy-back {
      height: 32px; padding: 0 14px; border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-size: 14px; font-weight: 600;
    }
    .legacy-page .legacy-back:hover { background: var(--fdd-bg-hover); }
    #pageTotal { color: var(--fdd-ink-3); margin-right: 8px; }
    /* —— 列设置（PRD 5.6） —— */
    .col-settings-th { text-align: right; }
    .col-settings-btn {
      width: 32px; height: 32px; margin-left: auto;
      display: inline-grid; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink-2);
      cursor: pointer;
    }
    .col-settings-btn:hover { background: var(--fdd-bg-hover); color: var(--fdd-ink); }
    .ns-modal--col { width: 460px; }
    .col-modal-tip { margin: 0 0 12px; color: var(--fdd-ink-3); font-size: 13px; line-height: 20px; }
    .ns-modal--sm { width: 420px; }
    .ns-field { display: block; margin-bottom: 14px; }
    .ns-field__label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--fdd-ink-2); }
    .ns-field__input {
      width: 100%; height: 36px; padding: 0 10px; box-sizing: border-box;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      font-size: 14px; color: var(--fdd-ink); background: #fff; outline: none;
    }
    .ns-field__input:focus { border-color: var(--fdd-brand); box-shadow: 0 0 0 2px rgba(0, 89, 239, 0.16); }
    .ns-field__error { margin: 4px 0 0; color: var(--fdd-danger); font-size: 12px; }
    .folder-picker-tree {
      max-height: 300px; overflow: auto; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: rgba(28, 43, 51, 0.18) transparent;
    }
    .folder-picker-item {
      width: 100%; height: 36px; padding: 0 8px;
      display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      color: var(--fdd-ink); font-size: 14px; text-align: left; cursor: pointer;
    }
    .folder-picker-item:hover { background: var(--fdd-bg-hover); }
    .folder-picker-item.is-selected { background: rgba(0, 89, 239, 0.1); color: var(--fdd-brand); font-weight: 600; }
    .folder-picker-item .aip-icon { color: var(--fdd-ink-3); flex-shrink: 0; }
    .folder-picker-item.is-selected .aip-icon { color: var(--fdd-brand); }
    .folder-picker-empty { padding: 24px 0; text-align: center; color: var(--fdd-ink-3); font-size: 13px; }
    .col-modal-search { margin-bottom: 10px; }
    .col-modal-list { list-style: none; margin: 0; padding: 0; }
    .col-modal-item {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 8px;
      border-radius: var(--fdd-radius);
    }
    .col-modal-item:hover { background: var(--fdd-bg-hover); }
    .col-modal-item input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--fdd-brand); }
    .col-modal-item .col-name { flex: 1; font-size: 14px; color: var(--fdd-ink); }
    .col-modal-item .col-fixed-note { font-size: 12px; color: var(--fdd-ink-3); }
    .col-modal-drag {
      width: 24px; height: 24px; margin-left: auto; flex-shrink: 0;
      display: inline-grid; place-items: center;
      border: 0; background: transparent; color: var(--fdd-ink-3);
      cursor: grab; border-radius: var(--fdd-radius);
      touch-action: none;
    }
    .col-modal-item:hover .col-modal-drag { color: var(--fdd-ink); }
    .col-modal-drag:active { cursor: grabbing; }
    .col-modal-item.is-dragging { opacity: 0.35; }
    .col-modal-item.is-drop-target { box-shadow: inset 0 2px 0 0 var(--fdd-brand); }
    .col-modal-item.is-drop-target-below { box-shadow: inset 0 -2px 0 0 var(--fdd-brand); }
    /* 禁止文本/链接被当成拖拽内容（避免文字重影） */
    .col-modal-item, .col-modal-item * { user-select: none; -webkit-user-drag: none; }
    .col-modal-item[draggable="true"] { -webkit-user-drag: element; }
    .col-modal-reset {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-brand); font-size: 13px; cursor: pointer;
    }
    .col-modal-reset:hover { text-decoration: underline; }
    .col-aux { color: var(--fdd-ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 160px; }
    th.is-sortable { cursor: pointer; user-select: none; }
    th .sort-ico { display: inline-block; width: 12px; font-size: 10px; color: var(--fdd-ink-3); }

    /* —— Table：贴合 DocuSign 列表，无投影、无卡片圆角 —— */
    .envelope-table-shell {
      position: relative;
      width: 100%;
      border: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: none;
      overflow: auto;
      max-height: clamp(300px, calc(100vh - 320px), 620px);
      border-bottom: 1px solid var(--fdd-line);
    }
    .envelope-table {
      width: 100%; min-width: 100%; border-collapse: separate; border-spacing: 0;
      background: #fff; font-size: 14px; line-height: 19.6px;
    }
    .envelope-table thead { position: sticky; top: 0; z-index: 2; background: #fff; }
    .envelope-table th,
    .envelope-table td {
      padding: 0 16px; text-align: left;
      border-bottom: 1px solid var(--fdd-line);
      vertical-align: middle;
    }
    .envelope-table thead tr { height: var(--fdd-table-head-h); }
    .envelope-table tbody tr { height: var(--fdd-table-row-h); }
    /* 行 hover：整行作为一个整体浮起（底色 + 投影），操作区随行一起 */
    .envelope-table tbody tr { transition: background-color 0.12s, box-shadow 0.12s; }
    .envelope-table tbody tr:hover {
      background: var(--fdd-bg-hover);
    }
    .envelope-table tbody tr:hover td:last-child { background: transparent; }
    .envelope-table th {
      font-weight: 500; color: var(--fdd-table-head-color, var(--fdd-ink)); background: #fff;
    }
    .envelope-table th:first-child,
    .envelope-table td:first-child { width: 48px; min-width: 48px; }
    /* 操作列固定吸附右侧，内容区横向滚动 */
    .envelope-table th:last-child,
    .envelope-table td:last-child {
      width: 130px; min-width: 130px; text-align: right;
      position: sticky; right: 0;
      background: #fff;
    }
    /* 操作列左侧用渐变遮罩自然过渡（替代生硬投影），滚动时才显现 */
    .envelope-table th:last-child::before,
    .envelope-table td:last-child::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -16px; width: 16px;
      background: linear-gradient(to right, rgba(255,255,255,0), #fff);
      pointer-events: none;
      opacity: 0; transition: opacity 0.15s;
    }
    .envelope-table-shell.is-scrolled-x .envelope-table th:last-child::before,
    .envelope-table-shell.is-scrolled-x .envelope-table td:last-child::before { opacity: 1; }
    .envelope-table thead th:last-child { background: #fff; z-index: 3; }
    .envelope-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .envelope-table td:nth-child(2) { white-space: normal; }

    .envelope-name {
      max-width: 100%; padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-weight: 500; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .envelope-name:hover { text-decoration: underline; }
    .envelope-table td small {
      display: block; margin-top: 2px;
      color: var(--fdd-ink-muted); font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .envelope-state { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .envelope-track {
      position: relative; width: 100%; height: var(--fdd-progress-h);
      border-radius: var(--fdd-progress-radius); background: rgba(28, 43, 51, 0.24); overflow: hidden;
    }
    .envelope-track i {
      position: absolute; inset: 0 auto 0 0; background: var(--fdd-brand);
    }
    .envelope-state button {
      padding: 0; border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 12px; line-height: 17px;
      border-bottom: 1px dashed rgba(28, 43, 51, 0.5);
    }
    .time-cell span { display: block; }
    .time-cell small { margin-top: 0; }
    .row-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 0; }
    /* 默认：空心（催办 / 继续编辑 / 查看） */
    .resend-button {
      height: 32px; padding: 0 12px;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink); font-weight: 600; font-size: 14px;
    }
    .resend-button:hover { background: var(--fdd-bg-hover); }
    /* 仅「处理」：实心主按钮 */
    .resend-button.is-solid {
      border-color: var(--fdd-brand);
      background: var(--fdd-brand); color: #fff;
    }
    .resend-button.is-solid:hover { background: var(--fdd-brand-hover); border-color: var(--fdd-brand-hover); }
    /* 状态列：已完成（对齐 agreements.html：绿勾 + 文案，无进度条） */
    .envelope-state.is-completed {
      flex-direction: row; align-items: center; gap: 8px;
    }
    .envelope-state.is-completed .status-check {
      flex-shrink: 0; width: 20px; height: 20px; color: var(--fdd-success);
    }
    .envelope-state.is-completed button {
      border-bottom: 0; font-size: 14px; line-height: 20px; font-weight: 400;
    }
    .more-wrap { position: relative; }
    .more-button {
      width: 32px; height: 32px; margin-left: 4px;
      display: inline-grid; place-items: center;
      border: 0; border-radius: var(--fdd-radius); background: transparent; color: var(--fdd-ink);
    }
    .more-button:hover { background: var(--fdd-bg-hover); }
    .row-menu {
      position: fixed; z-index: 90;
      width: 168px; padding: 4px;
      border: 1px solid var(--fdd-line); border-radius: 6px;
      background: #fff;
      box-shadow: var(--fdd-shadow-menu);
      animation: nsPopoverIn 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .row-menu button {
      width: 100%; height: 32px; padding: 0 10px;
      display: flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--fdd-radius); background: transparent;
      text-align: left; font-size: 13px;
    }
    .row-menu button:hover { background: #f1f4f6; }
    .row-menu button.danger { color: var(--fdd-danger); }

    .envelope-pagination {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; color: var(--fdd-ink); font-size: 13px;
    }
    /* 分页下拉：缩小，放左侧 */
    .page-size {
      position: relative; display: inline-flex; align-items: center; order: 0;
    }
    .page-size-trigger {
      appearance: none; -webkit-appearance: none;
      height: 28px; min-width: 84px; margin: 0;
      padding: 0 28px 0 10px;
      display: inline-flex; align-items: center;
      border: 1px solid var(--fdd-line-strong); border-radius: var(--fdd-radius);
      background: #fff; color: var(--fdd-ink);
      font-size: 13px; font-weight: 400; line-height: 20px;
      white-space: nowrap; cursor: pointer; text-align: left;
    }
    .page-size-trigger:hover { border-color: var(--fdd-ink); }
    .page-size-trigger:focus-visible {
      outline: 2px solid var(--fdd-brand); outline-offset: 2px;
    }
    .page-size > .caret {
      position: absolute; right: 6px; top: 50%;
      width: 16px; height: 16px; margin-top: -8px;
      color: var(--fdd-ink); pointer-events: none;
    }
    .page-size.is-open .page-size-trigger {
      border-color: var(--fdd-brand);
      box-shadow: var(--fdd-shadow-dropdown);
    }
    .page-size-menu {
      position: absolute; left: 0; right: auto; bottom: calc(100% + 4px); z-index: 30;
      min-width: 100%; padding: 4px 0;
      border: 1px solid var(--fdd-line); border-radius: var(--fdd-radius);
      background: #fff;
      box-shadow: var(--fdd-shadow-menu);
      display: none;
    }
    .page-size.is-open .page-size-menu { display: block; }
    .page-size-menu button {
      width: 100%; height: 28px; padding: 0 10px;
      display: flex; align-items: center;
      border: 0; background: transparent;
      color: var(--fdd-ink); font-size: 13px; line-height: 20px; text-align: left;
      white-space: nowrap; cursor: pointer;
    }
    .page-size-menu button:hover { background: var(--fdd-brand-soft); }
    .page-size-menu button.is-selected { background: var(--fdd-brand-soft); font-weight: 500; }
    .pager-btns { display: inline-flex; gap: 4px; align-items: center; order: 0; margin-left: auto; }
    .pager-btns button {
      width: 28px; height: 28px; border: 0; border-radius: var(--fdd-radius);
      background: transparent; color: var(--fdd-ink);
    }
    .pager-btns button:disabled { opacity: 0.25; cursor: not-allowed; }
    .pager-btns button:not(:disabled):hover { background: var(--fdd-bg-hover); }

    .toast {
      position: fixed; right: 24px; bottom: 24px; z-index: 50;
      padding: 10px 14px; border-radius: var(--fdd-radius);
      border: 1px solid var(--fdd-line);
      background: #fff; color: var(--fdd-ink); font-size: 13px;
      box-shadow: var(--fdd-shadow-menu); opacity: 0; transform: translateY(6px);
      transition: 0.15s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    /* —— 皮肤比对切换器 —— */
    /* —— 皮肤 / 场景切换：吸附屏幕左缘的把手，悬浮滑出面板 —— */
    .dev-switchers {
      position: fixed; left: 0; bottom: 88px; z-index: 60;
    }
    .dev-handle {
      width: 22px; height: 64px;
      display: grid; place-items: center;
      border: 1px solid var(--fdd-line); border-left: 0;
      border-radius: 0 8px 8px 0;
      background: #fff; color: var(--fdd-ink-3);
      box-shadow: 2px 2px 12px rgba(28, 43, 51, 0.10); cursor: pointer;
      transition: color 0.15s;
    }
    .dev-handle:hover { color: var(--fdd-brand); }
    .dev-handle svg { display: block; }
    .dev-panel {
      position: absolute; left: 0; bottom: -8px;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px;
      border: 1px solid var(--fdd-line); border-left: 0;
      border-radius: 0 10px 10px 0;
      background: #fff;
      box-shadow: 4px 4px 20px rgba(28, 43, 51, 0.14);
      transform: translateX(calc(-100% - 24px));
      transition: transform 0.18s ease;
      pointer-events: none;
    }
    .dev-switchers:hover .dev-panel,
    .dev-switchers:focus-within .dev-panel {
      transform: translateX(22px);
      pointer-events: auto;
    }
    .skin-switcher {
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      font-size: 12px; color: var(--fdd-ink-2);
    }
    .skin-switcher strong { color: var(--fdd-ink); font-weight: 600; margin-right: 2px; min-width: 28px; flex-shrink: 0; }
    .skin-switcher button {
      height: 28px; padding: 0 10px; border: 1px solid var(--fdd-line);
      border-radius: 4px; background: #fff; color: var(--fdd-ink); font-size: 12px;
      white-space: nowrap; flex-shrink: 0;
    }
    .skin-switcher button.is-on {
      border-color: var(--fdd-brand); background: var(--fdd-brand); color: #fff;
    }
    /* 首页（#home）不显示切换器 */
    body[data-view="home"] .dev-switchers { display: none; }

    /*
     * LibraTech 风：DocuSign 结构不变（字号 / 行高 / 布局尺寸保持），
     * 侧栏改为 app.libratech.ai 的「悬浮卡片」风格：
     * sunken 底色 + 圆角卡片 + 白底按钮卡 + 无左侧选中色条 + 通栏圆角选中。
     * 仅视觉层（padding / 圆角 / 颜色 / 阴影），不改任何 font-size 与结构。
     */
    html[data-skin="notasign"] {
      /* LibraTech 骨架 + 蓝调灰阶（灰中融一丝蓝，整体与法大大蓝和谐） */
      --fdd-brand: #161a1b;
      --fdd-brand-hover: #2f2b24;
      --fdd-brand-deep: #161a1b;
      --fdd-brand-soft: #f3f5f8;
      --fdd-accent: #04d79b;
      --fdd-ink: #14181d;                 /* 近黑带一点蓝 */
      --fdd-ink-2: #4e5560;
      --fdd-ink-3: #9aa1ab;
      --fdd-ink-muted: #7d8590;
      --fdd-line: #e6e9ee;
      --fdd-line-soft: #eef1f5;
      --fdd-line-strong: #d6dbe3;
      --fdd-bg: #ffffff;
      --fdd-bg-sidebar: #fafbfc;          /* 卡片底色：白中带一点蓝 */
      --fdd-bg-hover: #f3f5f8;            /* sunken：冷调浅灰蓝 */
      --fdd-bg-active: rgba(0, 89, 239, 0.1);
      --fdd-bg-muted: #f3f5f8;
      --fdd-danger: #e6555e;
      --fdd-success: #1b9275;
      --fdd-radius: 8px;
      --fdd-radius-pill: 9999px;
      --fdd-progress-h: 4px;
      --fdd-progress-radius: 17px;
      --fdd-shadow-dropdown: 0 0 0 1px #161a1b0d, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
      --fdd-shadow-menu: 0 0 0 1px #161a1b0d, 0 18px 47px 0 #161a1b08, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
      --lt-shadow-sm: 0 1px 2px 0 #161a1b0f;
      --lt-shadow-button: 0 0 0 1px #161a1b0d, 0 18px 47px 0 #161a1b08, 0 7.5px 19px 0 #161a1b05, 0 4px 10.5px 0 #161a1b05;
    }
    /* —— LibraTech 卡片式骨架（结构不动，灰阶全部带蓝调） —— */
    html[data-skin="notasign"] .page-shell { background: #f3f5f8; }
    html[data-skin="notasign"] .contract-sidebar {
      margin: 6px 0 24px 10px;
      background: #fafbfc;
      border: 1px solid #e6e9ee;
      border-radius: 12px;
      box-shadow: var(--lt-shadow-sm);
      overflow: hidden;
      min-height: calc(100vh - var(--fdd-header-h) - 30px);
      align-self: stretch;
    }
    html[data-skin="notasign"] .contract-side-inner { height: 100%; }
    html[data-skin="notasign"] .contract-nav-scroll { padding: 0 10px; }
    html[data-skin="notasign"] .contract-start { height: 64px; flex-basis: 64px; padding: 12px 10px 8px; }
    html[data-skin="notasign"] .contract-launch { border-radius: 8px; font-weight: 600; }

  <script src="assets/components/fdd-home/home-mount.js"></script>
  <script>
    /**
     * @typedef {{id:string,subject:string,parties:string,statusKey:string,statusText:string,progress:number,date:string,time:string,action:string}} TaskRow
     */

    const SKIN_KEY = 'contracts-v1-skin';

    /**
     * 顶栏 Tab：首页 / 合同（首页复用 components/home）
     * @param {'home'|'contracts'} view
     * @param {{push?:boolean}} [opts]
     */
    function setAppView(view, opts) {
      const next = view === 'home' ? 'home' : 'contracts';
      const push = !opts || opts.push !== false;
      document.body.setAttribute('data-view', next);
      document.querySelectorAll('#headerTabs [data-view]').forEach((btn) => {
        const on = btn.getAttribute('data-view') === next;
        btn.classList.toggle('active', on);
        if (on) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
      });

      document.title = next === 'home'
        ? '首页 · 法大大 AIP'
        : '协议 · 签署任务列表结构调整 0.1（AIP）';

      if (next === 'home' && window.AipHome) {
        const host = /** @type {HTMLElement|null} */ (document.querySelector('[data-aip-home]'));
        if (host) window.AipHome.mount(host);
      }

      if (push) {
        const hash = next === 'home' ? '#home' : '#contracts';
        if (location.hash !== hash) history.pushState({ view: next }, '', hash);
      }
    }

    (function bindHeaderTabs() {
      const tabs = document.getElementById('headerTabs');
      if (!tabs) return;

      tabs.addEventListener('click', (e) => {
        const btn = /** @type {HTMLElement} */ (e.target).closest('button');
        if (!btn || !tabs.contains(btn)) return;
        const view = btn.getAttribute('data-view');
        const link = btn.getAttribute('data-view-link');
        if (view === 'home' || view === 'contracts') {
          setAppView(/** @type {'home'|'contracts'} */ (view));
          return;
        }
        /* AIP 0.1：其余一级 Tab 为演示占位，提示后停留本页 */
      });

      document.querySelectorAll('[data-view-link="home"]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          setAppView('home');
        });
      });

      window.addEventListener('popstate', () => {
        const fromHash = location.hash === '#home' ? 'home' : 'contracts';
        setAppView(fromHash, { push: false });
      });

      const initial = location.hash === '#home' ? 'home' : 'contracts';
      setAppView(initial, { push: false });
    })();

    /**
     * 切换 DocuSign 风 / LibraTech 风（同结构，仅视觉层）
     * @param {'docusign'|'notasign'} skin
     */
    function applySkin(skin) {
      const next = skin === 'notasign' ? 'notasign' : 'docusign';
      document.documentElement.setAttribute('data-skin', next);
      try { localStorage.setItem(SKIN_KEY, next); } catch (_) { /* ignore */ }
      document.querySelectorAll('#skinSwitcher [data-skin-set]').forEach((btn) => {
        btn.classList.toggle('is-on', btn.getAttribute('data-skin-set') === next);
      });
    }

    /* 面板由 CSS :hover 驱动滑出，无需 JS 展开/收起 */

    (function bindSkinSwitcher() {
      let saved = 'docusign';
      try { saved = localStorage.getItem(SKIN_KEY) || 'docusign'; } catch (_) { /* ignore */ }
      applySkin(saved);
      document.getElementById('skinSwitcher')?.addEventListener('click', (e) => {
        const btn = /** @type {HTMLElement} */ (e.target).closest('[data-skin-set]');
        if (!btn) return;
        applySkin(btn.getAttribute('data-skin-set') || 'docusign');
      });
    })();

    /** 列表筛选：触发器 → 浮窗（应用才查询）→ 已应用标签（PRD 4.1/4.3/4.4） */
    (function bindListFilters() {
      const root = document.getElementById('envelopeFilters');
      if (!root) return;

      function closeAll(except) {
        root.querySelectorAll('.filter-field').forEach((field) => {
          if (field === except) return;
          field.classList.remove('is-open');
          const trigger = field.querySelector('.filter-trigger');
          const pop = field.querySelector('.filter-popover');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
          if (pop) pop.hidden = true;
        });
        const exportMenu = document.getElementById('exportMenu');
        if (exportMenu) exportMenu.hidden = true;
      }
      window.__closeFilterPops = closeAll;

      root.querySelectorAll('.filter-field').forEach((field) => {
        const key = field.getAttribute('data-filter') || '';
        const trigger = field.querySelector('.filter-trigger');
        const pop = field.querySelector('.filter-popover');
        if (!trigger || !pop) return;

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = !field.classList.contains('is-open');
          closeAll(open ? field : null);
          field.classList.toggle('is-open', open);
          trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
          pop.hidden = !open;
          if (open) {
            const checked = pop.querySelector(`input[name="filter-${key}"]:checked`);
            const applied = activeFilters[key];
            if (applied) {
              const input = pop.querySelector(`input[name="filter-${key}"][value="${applied.value}"]`);
              if (input) input.checked = true;
            } else if (checked) checked.checked = false;
          }
        });

        pop.addEventListener('click', (e) => e.stopPropagation());

        pop.querySelector('.filter-popover__cancel')?.addEventListener('click', () => closeAll(null));
        pop.querySelector('.filter-popover__clear')?.addEventListener('click', () => {
          activeFilters[key] = null;
          closeAll(null);
          toast(`已清除「${FILTER_TITLES[key]}」筛选`);
          render();
        });
        pop.querySelector('.filter-popover__apply')?.addEventListener('click', () => {
          const checked = /** @type {HTMLInputElement|null} */ (pop.querySelector(`input[name="filter-${key}"]:checked`));
          closeAll(null);
          if (!checked) return;
          const label = checked.getAttribute('data-label') || checked.value;
          activeFilters[key] = { value: checked.value, label: `${FILTER_TITLES[key]}：${label}` };
          toast(`已应用「${FILTER_TITLES[key]}：${label}」`);
          selectedIds.clear();
          render();
        });
      });

      document.addEventListener('click', () => closeAll(null));
    })();

    /** 已应用条件行 + 筛选计数（PRD 4.1：按钮已展示的条件不重复；计数不含关键词与固定条件） */
    function renderAppliedRow() {
      const row = document.getElementById('appliedRow');
      /* 当前视图不支持的附加条件直接清掉（PRD 4.6 切列表规则） */
      const allowMap = {
        all: ['date', 'status', 'sender', 'quick'],
        draft: ['date'],
        active: ['date', 'sender', 'quick'],
        completed: ['date', 'sender'],
        folder: ['date', 'status'],
      };
      const allow = allowMap[currentFolder ? 'folder' : currentNav] || ['date'];
      Object.keys(activeFilters).forEach((key) => {
        if (!allow.includes(key)) activeFilters[key] = null;
      });
      /* 触发按钮直接呈现已应用条件（典型页样式：状态：所选值 ×）；未应用则恢复默认文案 */
      const defaultLabels = { date: '日期', status: '状态', sender: '发起人', quick: '快捷筛选' };
      document.querySelectorAll('#filterTriggers .filter-field').forEach((field) => {
        const key = field.getAttribute('data-filter');
        const trigger = field.querySelector('.filter-trigger');
        if (!trigger) return;
        const applied = activeFilters[key];
        field.hidden = !allow.includes(key);
        field.classList.toggle('is-applied', !!applied);
        let labelEl = trigger.querySelector('.filter-trigger__label');
        if (!labelEl) {
          /* 首次：把按钮里原始文字（如"日期"）包进 label span，避免与新 label 并存重复 */
          const textNode = [...trigger.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim());
          labelEl = document.createElement('span');
          labelEl.className = 'filter-trigger__label';
          if (textNode) {
            trigger.insertBefore(labelEl, textNode);
            labelEl.appendChild(textNode);
          } else {
            trigger.insertBefore(labelEl, trigger.firstChild);
          }
        }
        labelEl.textContent = applied ? applied.label : defaultLabels[key];
        let clearEl = trigger.querySelector('.filter-trigger__clear');
        if (applied) {
          if (!clearEl) {
            clearEl = document.createElement('span');
            clearEl.className = 'filter-trigger__clear';
            clearEl.setAttribute('role', 'button');
            clearEl.setAttribute('aria-label', `清除${FILTER_TITLES[key]}`);
            clearEl.textContent = '×';
            clearEl.addEventListener('click', (e) => {
              e.stopPropagation();
              activeFilters[key] = null;
              toast(`已清除「${FILTER_TITLES[key]}」筛选`);
              render();
            });
            trigger.appendChild(clearEl);
          }
          clearEl.hidden = false;
          const caret = trigger.querySelector('.aip-icon');
          if (caret) caret.hidden = true;
        } else if (clearEl) {
          clearEl.hidden = true;
          const caret = trigger.querySelector('.aip-icon');
          if (caret) caret.hidden = false;
        }
      });
      /* 清除所有：放进筛选行尾部（和典型页一致），有任一条件时出现 */
      const count = Object.keys(activeFilters).filter((k) => activeFilters[k]).length;
      let clearAll = document.getElementById('appliedClearAll');
      if (!clearAll) {
        clearAll = document.createElement('button');
        clearAll.type = 'button';
        clearAll.className = 'applied-clearall';
        clearAll.id = 'appliedClearAll';
        clearAll.textContent = '清除所有';
        document.getElementById('filterTriggers').appendChild(clearAll);
      }
      clearAll.hidden = count === 0;
      if (row) row.innerHTML = '';
      const badge = document.getElementById('filterSummaryCount');
      if (badge) {
        badge.hidden = count === 0;
        badge.textContent = count ? ` ${count}` : '';
        badge.style.fontWeight = '600';
      }
      /* 已应用筛选与未应用下拉之间插一根分割线（第一个未应用字段前） */
      let sep = document.getElementById('filterSepApplied');
      const firstUnapplied = [...document.querySelectorAll('#filterTriggers .filter-field')]
        .find((f) => !f.hidden && !f.classList.contains('is-applied'));
      const anyApplied = [...document.querySelectorAll('#filterTriggers .filter-field')]
        .some((f) => f.classList.contains('is-applied'));
      if (firstUnapplied && anyApplied) {
        if (!sep) {
          sep = document.createElement('span');
          sep.className = 'filter-sep-applied';
          sep.id = 'filterSepApplied';
          sep.setAttribute('aria-hidden', 'true');
        }
        firstUnapplied.parentNode.insertBefore(sep, firstUnapplied);
      } else if (sep) {
        sep.remove();
      }
      /* 布局稳定后检测是否需要折叠（不换行，超宽折进"筛选条件"） */
      requestAnimationFrame(() => updateFilterCollapse());
    }

    /** 筛选行超宽时把右侧触发器折叠进"筛选条件"按钮（DocuSign 式）；已应用条件仍保留在按钮上可见 */
    function updateFilterCollapse() {
      const collapseBtn = document.getElementById('filterCollapseBtn');
      const search = document.querySelector('.envelope-search');
      if (!collapseBtn || !search) return;
      const fields = [...document.querySelectorAll('#filterTriggers .filter-field')].filter((f) => !f.hidden);
      /* 筛选组预算 = 行宽 - 搜索框 - 右侧筛选汇总/导出/刷新组（它们由 margin-left:auto 顶到最右，但和触发器共享一行空间） */
      const controls = document.querySelector('.envelope-controls');
      const controlsWidth = controls.getBoundingClientRect().width;
      const searchW = search.getBoundingClientRect().width + 16;
      /* 右侧固定组：导出 + 刷新图标（筛选汇总按钮在筛选组内，不另占预算） */
      let rightGroupW = 0;
      ['exportBtn', 'refreshBtn'].forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.offsetParent !== null) rightGroupW += el.getBoundingClientRect().width + 8;
      });
      const budget = controlsWidth - searchW - rightGroupW - 24;
      /* 展开全部测量总宽 */
      fields.forEach((f) => f.classList.remove('is-collapsed'));
      collapseBtn.hidden = true;
      const totalW = fields.reduce((sum, f) => sum + f.querySelector('.filter-trigger').getBoundingClientRect().width + 8, 0);
      if (totalW <= budget) {
        collapseBtn.hidden = true;
        const summaryBtn = document.getElementById('filterSummaryBtn');
        if (summaryBtn) summaryBtn.hidden = false;
        const cb = document.getElementById('filterCollapseCount');
        if (cb) cb.hidden = true;
        return;
      }
      /* 需要折叠：显示折叠按钮，并把"筛选汇总"也一起收纳（只留"筛选条件"一个入口） */
      collapseBtn.hidden = false;
      const summaryBtn = document.getElementById('filterSummaryBtn');
      if (summaryBtn) summaryBtn.hidden = true;
      const budget2 = budget - (collapseBtn.getBoundingClientRect().width + 8);
      let used = totalW;
      let collapsed = 0;
      for (let i = fields.length - 1; i >= 0 && used > budget2; i--) {
        const w = fields[i].querySelector('.filter-trigger').getBoundingClientRect().width + 8;
        fields[i].classList.add('is-collapsed');
        used -= w;
        collapsed++;
      }
      const cb = document.getElementById('filterCollapseCount');
      if (cb) {
        cb.hidden = collapsed === 0;
        cb.textContent = collapsed ? ` ${collapsed}` : '';
      }
    }

    window.addEventListener('resize', () => updateFilterCollapse());
    document.getElementById('filterCollapseBtn').addEventListener('click', () => {
      document.getElementById('filterSummaryBtn').click();
    });
