                </button>
              </div>
              <input type="hidden" id="innerInput" value="${init}" />
            </div>`;
        } else {
          body += `<input type="text" class="filter-inner-pop__input" id="innerInput" placeholder="${f.ph || ''}" value="${applied ? applied.raw || '' : ''}" />`;
        }
        body += `<div class="filter-inner-pop__actions">
          <button type="button" class="filter-inner-pop__cancel">取消</button>
          <button type="button" class="filter-inner-pop__apply">应用</button>
        </div>`;
        pop.innerHTML = body;
        pop.setAttribute('data-inner-field', key);
        document.body.appendChild(pop);
        /* 回填已选值 */
        if (applied && applied.value && f.type === 'radio' && key !== 'date') {
          const radio = /** @type {HTMLInputElement|null} */ (pop.querySelector(`input[name="inner-${key}"][value="${CSS.escape(applied.value)}"]`));
          if (radio) radio.checked = true;
        }
        if (key === 'date') {
          const wrap = /** @type {HTMLElement|null} */ (pop.querySelector('[data-date-op-wrap]'));
          if (wrap && applied?.op) wrap.dataset.op = applied.op;
          bindDateOpUI(pop);
          /* 克隆后 radio name 已改为 inner-date；比较态回填 ISO */
          if (applied?.op === 'eq' && applied.value) {
            const radio = /** @type {HTMLInputElement|null} */ (pop.querySelector(`input[name="inner-date"][value="${CSS.escape(applied.value)}"]`));
            if (radio) radio.checked = true;
          } else if (applied?.op === 'between' && applied.value) {
            const [a, b] = String(applied.value).split('~');
            const start = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-start]'));
            const end = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-end]'));
            if (start && a) { start.dataset.iso = a; start.value = formatDateDisplay(a); }
            if (end && b) { end.dataset.iso = b; end.value = formatDateDisplay(b); }
          } else if (applied?.value && applied.op && applied.op !== 'eq') {
            const one = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-one]'));
            if (one) { one.dataset.iso = applied.value; one.value = formatDateDisplay(applied.value); }
          }
        } else if (f.type === 'date') {
          mountLibraDatePicker(pop, applied ? (applied.raw || applied.value || '') : '');
        }
        /* 锚定到行位置，空间不够翻到上方 */
        const rect = row.getBoundingClientRect();
        const pw = (key === 'date' || f.type === 'date') ? 320 : (key === 'status' ? 240 : 260);
        pop.style.width = pw + 'px';
        /**
         * 按当前浮层高度重算位置。
         */
        function repositionInnerPop() {
          let nextTop = rect.bottom + 6;
          const ph = pop.offsetHeight;
          if (nextTop + ph > window.innerHeight - 12) nextTop = rect.top - ph - 6;
          let nextLeft = rect.left;
          if (nextLeft + pw > window.innerWidth - 12) nextLeft = window.innerWidth - pw - 12;
          pop.style.top = Math.max(12, nextTop) + 'px';
          pop.style.left = Math.max(12, nextLeft) + 'px';
        }
        pop.style.visibility = 'hidden';
        pop.style.top = '0px';
        pop.style.left = '0px';
        repositionInnerPop();
        pop.style.visibility = 'visible';
        innerPop = pop;
        pop.addEventListener('click', (ev) => ev.stopPropagation());
        pop.querySelector('.filter-inner-pop__cancel').addEventListener('click', (ev) => {
          ev.stopPropagation();
          closeInnerPop();
        });
        pop.querySelector('.filter-inner-pop__apply').addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (key === 'date') {
            const wrap = pop.querySelector('[data-date-op-wrap]');
            const op = wrap?.getAttribute('data-op') || 'eq';
            const opLabel = wrap?.querySelector('[data-date-op-label]')?.textContent || '=';
            if (op === 'eq') {
              const checked = pop.querySelector('input[name="inner-date"]:checked');
              if (!checked) { closeInnerPop(); return; }
              const label = checked.getAttribute('data-label');
              summaryDraft.date = { value: checked.value, op: 'eq', label: `日期：${label}` };
            } else if (op === 'between') {
              const a = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-start]'))?.dataset.iso || '';
              const b = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-end]'))?.dataset.iso || '';
              if (!a || !b) { toast('请选择开始与结束日期'); return; }
              summaryDraft.date = { value: `${a}~${b}`, op: 'between', label: `日期：介于 ${formatDateDisplay(a)} ~ ${formatDateDisplay(b)}` };
            } else {
              const iso = /** @type {HTMLInputElement|null} */ (pop.querySelector('[data-date-one]'))?.dataset.iso || '';
              if (!iso) { toast('请选择日期'); return; }
              summaryDraft.date = { value: iso, op, label: `日期：${opLabel} ${formatDateDisplay(iso)}` };
            }
            closeInnerPop();
            renderSummary();
            return;
          }
          if (f.type === 'radio') {
            const checked = pop.querySelector(`input[name="inner-${key}"]:checked`);
            if (!checked) { closeInnerPop(); return; }
            const label = checked.getAttribute('data-label');
            summaryDraft[key] = { value: checked.value, label: `${f.title}：${label}` };
          } else {
            const val = pop.querySelector('#innerInput').value.trim();
            if (!val) { summaryDraft[key] = null; }
            else {
              const display = f.type === 'date' ? formatDateDisplay(val) : val;
              summaryDraft[key] = { value: val, raw: val, label: `${f.title}：${display}` };
            }
          }
          closeInnerPop();
          renderSummary();
        });
        /* 下一拍再监听外部点击；点日历浮窗不算外部 */
        innerDocClose = (ev) => {
          const t = /** @type {Node} */ (ev.target);
          if (sharedDateCalFloat && sharedDateCalFloat.contains(t)) return;
          if (innerPop && !innerPop.contains(t)) closeInnerPop();
          else if (sharedDateCalFloat && innerPop && innerPop.contains(t) && !/** @type {HTMLElement} */ (ev.target).closest('.libra-dp__field, [data-date-op-wrap]')) {
            closeSharedDateCalFloat();
          }
        };
        setTimeout(() => {
          if (innerDocClose) document.addEventListener('click', innerDocClose);
        }, 0);
      }
      availBox.addEventListener('click', (e) => {
        e.stopPropagation();
        /* 仅下拉 pill 可点（操作热区收窄，描述区不可点） */
        const pill = /** @type {HTMLElement} */ (e.target).closest('[data-avail-pill]');
        if (!pill) return;
        const row = /** @type {HTMLElement} */ (pill.closest('[data-avail-field]'));
        if (!row) return;
        const key = row.getAttribute('data-avail-field');
        /* 已在该字段开着则关闭（toggle）；否则打开新浮层 */
        if (innerPop && innerPop.getAttribute('data-inner-field') === key) {
          closeInnerPop();
          return;
        }
        openInnerPop(row, key);
      });

      /* 全部清除 */
      document.getElementById('filterSummaryClearAll').addEventListener('click', () => {
        Object.keys(summaryDraft).forEach((k) => { summaryDraft[k] = null; });
        renderSummary();
        toast('已清空草稿中的可编辑筛选（保存后生效）');
      });

      /* 保存：只提交一次查询 */
      document.getElementById('filterSummarySave').addEventListener('click', () => {
        ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = summaryDraft[k] || null; });
        closeInnerPop();
        modal.hidden = true;
        summaryDraft = null;
        syncModalScrollLock();
        toast('已保存筛选并查询一次');
        render();
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal || /** @type {HTMLElement} */ (e.target).closest('[data-modal-close]')) {
          closeInnerPop();
        }
      });
    })();

    /** 列设置弹窗：草稿式编辑（勾选 + 上下移动），保存才应用并持久化（PRD 5.6） */
    function openColSettings() {
      colDraft = activeCols.slice();
      renderColModal();
      document.getElementById('colSettingsModal').hidden = false;
      syncModalScrollLock();
    }

    function renderColModal() {
      const list = document.getElementById('colModalList');
      const q = (document.getElementById('colModalSearch').value || '').trim();
      /* 所有可编辑列位置固定（按当前列顺序），勾选只改选中态不挪动 */
      const fixedOrder = COL_DEFS.filter((d) => !d.fixed).map((d) => d.id);
      /* 已选列（colDraft 顺序）在前排？不，保持定义顺序；但要把用户已调过的顺序反映出来 */
      /* 展示顺序 = 当前生效列顺序（subject/actions 之间）+ 未选的按定义顺序排在其后 */
      const middle = colDraft.filter((id) => id !== 'subject' && id !== 'actions');
      const unselected = fixedOrder.filter((id) => !middle.includes(id));
      let order = [...middle, ...unselected];
      if (q) order = order.filter((id) => COL_DEFS.find((d) => d.id === id).label.includes(q));
      const dragSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
      const showFixed = !q;
      list.innerHTML = `
        ${showFixed ? `<li class="col-modal-item col-modal-item--fixed">
          <input type="checkbox" checked disabled aria-label="任务主题（固定）" />
          <span class="col-name">任务主题</span><span class="col-fixed-note">固定</span>
        </li>` : ''}
        ${order.length === 0 ? '<li class="col-modal-empty" style="padding:24px 0;text-align:center;color:var(--fdd-ink-3);font-size:13px">没有匹配的列</li>' : ''}
        ${order.map((id) => {
          const def = COL_DEFS.find((d) => d.id === id);
          const on = colDraft.includes(id);
          return `<li class="col-modal-item" data-col="${id}" draggable="true">
            <input type="checkbox" ${on ? 'checked' : ''} aria-label="${def.label}" />
            <span class="col-name">${def.label}</span>
            <span class="col-modal-drag" title="拖动排序" aria-hidden="true">${dragSvg}</span>
          </li>`;
        }).join('')}
        ${showFixed ? `<li class="col-modal-item col-modal-item--fixed">
          <input type="checkbox" checked disabled aria-label="操作（固定）" />
          <span class="col-name">操作</span><span class="col-fixed-note">固定</span>
        </li>` : ''}`;
    }

    document.getElementById('colModalSearch').addEventListener('input', () => renderColModal());

    document.getElementById('colModalList').addEventListener('change', (e) => {
      const cb = /** @type {HTMLInputElement} */ (e.target).closest('input[type="checkbox"]');
      if (!cb || cb.disabled) return;
      const item = /** @type {HTMLElement} */ (cb.closest('[data-col]'));
      const id = item.getAttribute('data-col');
      if (cb.checked) {
        if (!colDraft.includes(id)) colDraft.splice(colDraft.length - 1, 0, id);
        item.setAttribute('draggable', 'true');
      } else {
        colDraft = colDraft.filter((x) => x !== id);
        item.setAttribute('draggable', 'false');
      }
      /* 不重渲染，保持行位置固定 */
    });

    /* 拖拽排序（HTML5 DnD）：只能拖动可编辑列，落在可编辑区之间 */
    (function bindColDrag() {
      const list = document.getElementById('colModalList');
      let dragId = null;
      /** @type {HTMLElement|null} */
      let dragGhost = null;

      /**
       * 清理拖拽幽灵节点。
       */
      function clearDragGhost() {
        if (dragGhost && dragGhost.parentNode) dragGhost.parentNode.removeChild(dragGhost);
        dragGhost = null;
      }

      list.addEventListener('dragstart', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item) { e.preventDefault(); return; }
        dragId = item.getAttribute('data-col');
        item.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId || '');

        /* 用整行克隆作为拖拽预览，让用户看到正在拖的内容 */
        clearDragGhost();
        const ghost = /** @type {HTMLElement} */ (item.cloneNode(true));
        ghost.classList.remove('is-dragging', 'is-drop-target', 'is-drop-target-below');
        ghost.classList.add('col-modal-drag-ghost');
        ghost.removeAttribute('draggable');
        ghost.removeAttribute('data-col');
        ghost.setAttribute('aria-hidden', 'true');
        const rect = item.getBoundingClientRect();
        ghost.style.position = 'absolute';
        ghost.style.top = '-9999px';
        ghost.style.left = '0';
        ghost.style.width = `${rect.width}px`;
        document.body.appendChild(ghost);
        dragGhost = ghost;
        const offsetX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        const offsetY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
        e.dataTransfer.setDragImage(ghost, offsetX, offsetY);
        /* 浏览器截取快照后再移除节点 */
        requestAnimationFrame(() => clearDragGhost());
      });

      list.addEventListener('dragend', () => {
        list.querySelectorAll('.col-modal-item').forEach((el) => el.classList.remove('is-dragging', 'is-drop-target', 'is-drop-target-below'));
        clearDragGhost();
        dragId = null;
      });

      list.addEventListener('dragover', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item || !dragId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        list.querySelectorAll('.col-modal-item').forEach((el) => el.classList.remove('is-drop-target', 'is-drop-target-below'));
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        item.classList.add(before ? 'is-drop-target' : 'is-drop-target-below');
      });

      list.addEventListener('dragleave', (e) => {
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (item) item.classList.remove('is-drop-target', 'is-drop-target-below');
      });

      list.addEventListener('drop', (e) => {
        e.preventDefault();
        const item = /** @type {HTMLElement} */ (e.target).closest('[data-col]');
        if (!item || !dragId) return;
        const targetId = item.getAttribute('data-col');
        if (targetId === dragId) return;
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        const editable = colDraft.filter((x) => x !== 'subject' && x !== 'actions');
        const from = editable.indexOf(dragId);
        if (from >= 0) editable.splice(from, 1);
        let to = editable.indexOf(targetId);
        if (to < 0) to = before ? 0 : editable.length;
        else if (!before) to += 1;
        editable.splice(to, 0, dragId);
        colDraft = ['subject', ...editable, 'actions'];
        renderColModal();
      });
    })();

    document.getElementById('colModalReset').addEventListener('click', () => {
      colDraft = DEFAULT_COL_IDS.slice();
      renderColModal();
      toast('已恢复默认列（保存后生效）');
    });

    document.getElementById('colModalSave').addEventListener('click', () => {
      activeCols = colDraft.slice();
      saveCols(activeCols);
      colDraft = null;
      document.getElementById('colSettingsModal').hidden = true;
      syncModalScrollLock();
      toast('已保存列设置');
      render();
    });

    /** 新建文件夹弹窗 */
    function openNewFolderModal() {
      const sel = document.getElementById('newFolderParent');
      /* 填充上级目录候选（根目录 + 所有非结构目录） */
      const flat = [];
      (function walk(nodes, path) {
        nodes.forEach((n) => {
          if (!n.structural) flat.push({ id: n.id, name: path ? `${path} / ${n.name}` : n.name });
          if (n.children) walk(n.children, path ? `${path} / ${n.name}` : n.name);
        });
      })(FOLDER_TREE, '');
      sel.innerHTML = '<option value="">（根目录）</option>' + flat.map((f) => `<option value="${f.id}">${f.name}</option>`).join('');
      sel.value = '';
      renderNewFolderParentPop(flat);
      syncNewFolderParentTrigger();
      const nameInput = document.getElementById('newFolderName');
      nameInput.value = '';
      document.getElementById('newFolderError').hidden = true;
      document.getElementById('newFolderSave').disabled = true;
      document.getElementById('newFolderModal').hidden = false;
      syncModalScrollLock();
      setTimeout(() => nameInput.focus(), 50);
    }

    /** 上级目录自定义下拉（LibraTech 风）：渲染选项弹层 */
    function renderNewFolderParentPop(flat) {
      const pop = document.getElementById('newFolderParentPop');
      const folderIcon = '<span class="aip-icon aip-icon--sm" aria-hidden="true"><img class="aip-icon__svg" src="assets/icons/phosphor/regular/folder.svg" alt="" /></span>';
      const checkIcon = '<svg class="opt-check" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" focusable="false"><path d="m16.7 5.3-7.4 7.4-3-3-1.4 1.4 4.4 4.4 8.8-8.8z"/></svg>';
      const mkOpt = (value, label, icon) =>
        `<button type="button" class="libra-select__opt" role="option" data-value="${value}" aria-selected="${value === '' ? 'true' : 'false'}">${icon}<span class="opt-label">${label}</span>${checkIcon}</button>`;
      pop.innerHTML = mkOpt('', '（根目录）', folderIcon) + flat.map((f) => mkOpt(f.id, f.name, folderIcon)).join('');
    }

    /** 同步 trigger 显示的当前值 */
    function syncNewFolderParentTrigger() {
      const sel = document.getElementById('newFolderParent');
      const valueEl = document.getElementById('newFolderParentValue');
      const text = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '（根目录）';
      valueEl.textContent = text;
      valueEl.classList.toggle('is-placeholder', sel.value === '');
      /* 同步弹层选中态 */
      document.querySelectorAll('#newFolderParentPop .libra-select__opt').forEach((opt) => {
        const on = opt.getAttribute('data-value') === sel.value;
        opt.classList.toggle('is-selected', on);
        opt.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    /* 上级目录自定义下拉交互 */
    (function bindNewFolderParentSelect() {
      const wrap = document.getElementById('newFolderParentSelect');
      const trigger = document.getElementById('newFolderParentTrigger');
      const pop = document.getElementById('newFolderParentPop');
      const sel = document.getElementById('newFolderParent');
      if (!wrap || !trigger || !pop || !sel) return;

      const closePop = () => {
        pop.hidden = true;
        wrap.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      };
      const openPop = () => {
        pop.hidden = false;
        wrap.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      };

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if (pop.hidden) openPop(); else closePop();
      });

      pop.addEventListener('click', (e) => {
        const opt = e.target.closest('.libra-select__opt');
        if (!opt) return;
        sel.value = opt.getAttribute('data-value');
        syncNewFolderParentTrigger();
        closePop();
        trigger.focus();
      });

      /* 点击弹层外关闭 */
      document.addEventListener('click', (e) => {
        if (!pop.hidden && !wrap.contains(e.target)) closePop();
      });
      /* Esc 关闭 */
      trigger.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePop();
      });
    })();

    document.getElementById('newFolderName').addEventListener('input', (e) => {
      document.getElementById('newFolderSave').disabled = !e.target.value.trim();
      document.getElementById('newFolderError').hidden = true;
    });
    document.getElementById('newFolderSave').addEventListener('click', () => {
      const name = document.getElementById('newFolderName').value.trim();
      const parentId = document.getElementById('newFolderParent').value;
      const err = document.getElementById('newFolderError');
      if (!name) return;
      /* 同级重名校验（原规则） */
      const siblings = parentId ? (findFolderNode(parentId)?.children || []) : FOLDER_TREE;
      if (siblings.some((n) => n.name === name)) {
        err.textContent = '同级目录下已存在同名文件夹';
        err.hidden = false;
        return;
      }
      const newNode = { id: 'folder-' + Date.now(), name, count: 0, children: [] };
      if (parentId) {
        const parent = findFolderNode(parentId);
        if (parent) {
          parent.children = parent.children || [];
          parent.children.push(newNode);
          openFolderIds.add(parentId);
        }
      } else {
        FOLDER_TREE.push(newNode);
      }
      document.getElementById('newFolderModal').hidden = true;
      syncModalScrollLock();
      const moduleEl = document.getElementById('folderModule');
      moduleEl.classList.add('is-open');
      rebuildFolderTree();
      toast(`已新建文件夹「${name}」`);
    });
    function findFolderNode(id) {
      let found = null;
      (function walk(nodes) {
        nodes.forEach((n) => {
          if (n.id === id) found = n;
          if (n.children) walk(n.children);
        });
      })(FOLDER_TREE);
      return found;
    }

    /** 查找文件夹：选择要查看的文件夹弹窗 */
    let folderPickerSelected = null;
    function openFolderPicker() {
      folderPickerSelected = null;
      document.getElementById('folderPickerSearch').value = '';
      document.getElementById('folderPickerConfirm').disabled = true;
      renderFolderPicker();
      document.getElementById('folderPickerModal').hidden = false;
      syncModalScrollLock();
      setTimeout(() => document.getElementById('folderPickerSearch').focus(), 50);
    }
    function renderFolderPicker() {
      const tree = document.getElementById('folderPickerTree');
      const q = document.getElementById('folderPickerSearch').value.trim();
      const flat = [];
      (function walk(nodes, depth, path) {
        nodes.forEach((n) => {
          if (!n.structural) flat.push({ id: n.id, name: n.name, depth, full: path ? `${path} / ${n.name}` : n.name });
          if (n.children) walk(n.children, depth + 1, path ? `${path} / ${n.name}` : n.name);
        });
      })(FOLDER_TREE, 0, '');
      const items = q ? flat.filter((f) => f.name.includes(q) || f.full.includes(q)) : flat;
      if (!items.length) {
        tree.innerHTML = '<p class="folder-picker-empty">没有符合条件的文件夹</p>';
        return;
      }
      tree.innerHTML = items.map((f) => `
        <button type="button" class="folder-picker-item${folderPickerSelected === f.id ? ' is-selected' : ''}" data-pick-folder="${f.id}" style="padding-left:${8 + f.depth * 18}px" title="${f.full}">
          <span class="aip-icon aip-icon--sm" aria-hidden="true"><img class="aip-icon__svg" src="assets/icons/phosphor/regular/folder.svg" alt="" /></span>
          <span>${q ? f.full : f.name}</span>
        </button>`).join('');
    }
    document.getElementById('folderPickerSearch').addEventListener('input', renderFolderPicker);
    document.getElementById('folderPickerTree').addEventListener('click', (e) => {
      const item = /** @type {HTMLElement} */ (e.target).closest('[data-pick-folder]');
      if (!item) return;
      folderPickerSelected = item.getAttribute('data-pick-folder');
      document.querySelectorAll('.folder-picker-item').forEach((el) => el.classList.toggle('is-selected', el === item));
      document.getElementById('folderPickerConfirm').disabled = false;
    });
    document.getElementById('folderPickerConfirm').addEventListener('click', () => {
      if (!folderPickerSelected) return;
      const name = FOLDER_NAME_MAP[folderPickerSelected] || '文件夹';
      document.getElementById('folderPickerModal').hidden = true;
      syncModalScrollLock();
      /* 进入所选目录的独立任务文件夹页 */
      const moduleEl = document.getElementById('folderModule');
      moduleEl.classList.add('is-open');
      /* 展开到该目录的父链 */
      (function expandPath(nodes, target, trail) {
        nodes.forEach((n) => {
          if (n.id === target) trail.forEach((p) => openFolderIds.add(p));
          if (n.children) expandPath(n.children, target, [...trail, n.id]);
        });
      })(FOLDER_TREE, folderPickerSelected, []);
      rebuildFolderTree();
      if (!currentFolder) scopeBeforeFolder = currentScope;
      currentFolder = folderPickerSelected;
      currentLegacy = null;
      document.body.removeAttribute('data-page-mode');
      selectedIds.clear();
        pageState.page = 1;
      render();
      toast(`已进入文件夹「${name}」`);
    });

    /** 通用模态关闭（取消 / Esc / 点外部放弃草稿） */
    document.querySelectorAll('.ns-modal-mask').forEach((mask) => {
      mask.addEventListener('click', (e) => {
        if (e.target === mask || /** @type {HTMLElement} */ (e.target).closest('[data-modal-close]')) {
          mask.hidden = true;
          const parentPop = mask.querySelector('#newFolderParentPop');
          if (parentPop) { parentPop.hidden = true; mask.querySelector('#newFolderParentSelect')?.classList.remove('is-open'); }
          if (mask.id === 'filterSummaryModal') summaryDraft = null;
          if (mask.id === 'partyDialog') partyDialogCtx = null;
          if (mask.id === 'colSettingsModal') colDraft = null;
          syncModalScrollLock();
        }
      });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.ns-modal-mask').forEach((mask) => {
        mask.hidden = true;
        const parentPop = mask.querySelector('#newFolderParentPop');
        if (parentPop) { parentPop.hidden = true; mask.querySelector('#newFolderParentSelect')?.classList.remove('is-open'); }
      });
      syncModalScrollLock();
    });

    /** 导出（PRD 2.1：零勾选可导出当前筛选结果；选中任务需有有效选择） */
    (function bindExport() {
      const btn = document.getElementById('exportBtn');
      const menu = document.getElementById('exportMenu');
      if (!btn || !menu) return;
      if (!canExport) btn.hidden = true;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.hidden = !menu.hidden;
        btn.setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
      });
      document.getElementById('exportFiltered').addEventListener('click', () => {
        menu.hidden = true;
        const n = filteredTasks().length;
        if (n === 0) { toast('当前筛选无结果，无法导出'); return; }
        toast(`演示：导出当前筛选结果（${n} 条，含全部查询条件，不只当前页）`);
      });
      document.getElementById('exportSelected').addEventListener('click', () => {
        menu.hidden = true;
        toast(`演示：导出选中任务（${selectedIds.size} 条）`);
      });
      document.addEventListener('click', (e) => {
        if (!menu.hidden && !menu.contains(/** @type {Node} */ (e.target)) && e.target !== btn) menu.hidden = true;
      });
    })();

    /* 横向滚动时，操作列左侧渐变遮罩显现 */
    document.querySelector('.envelope-table-shell').addEventListener('scroll', (e) => {
      e.currentTarget.classList.toggle('is-scrolled-x', e.currentTarget.scrollLeft > 2);
    });

    /** 分页：左每页条数 · 右「第 N 页」+ 左右切换（保留真实切片） */
    (function bindPager() {
      const wrap = document.getElementById('pageSize');
      const trigger = document.getElementById('pageSizeTrigger');
      const menu = document.getElementById('pageSizeMenu');
      const label = document.getElementById('pageSizeLabel');
      if (!wrap || !trigger || !menu || !label) return;
      function setOpen(open) {
        wrap.classList.toggle('is-open', open);
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        setOpen(!wrap.classList.contains('is-open'));
      });
      menu.querySelectorAll('[data-value]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const next = Number(btn.getAttribute('data-value') || '10');
          pageState.pageSize = next;
          pageState.page = 1;
          label.textContent = `${next} / 页`;
          menu.querySelectorAll('[data-value]').forEach((el) => {
            const on = Number(el.getAttribute('data-value')) === next;
            el.classList.toggle('is-selected', on);
            el.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          setOpen(false);
          selectedIds.clear();
        pageState.page = 1;
          toast(`已切换为每页 ${next} 条`);
          render();
        });
      });
      document.addEventListener('click', (e) => {
        if (!wrap.contains(/** @type {Node} */ (e.target))) setOpen(false);
      });
      const prevBtn = document.getElementById('pagePrev');
      const nextBtn = document.getElementById('pageNext');
      function goPage(delta) {
        const total = Math.max(1, Math.ceil(sortRows(filteredTasks()).length / pageState.pageSize));
        const next = Math.min(total, Math.max(1, pageState.page + delta));
        if (next === pageState.page) return;
        pageState.page = next;
        selectedIds.clear();
        render();
      }
      prevBtn?.addEventListener('click', () => goPage(-1));
      nextBtn?.addEventListener('click', () => goPage(1));
    })();

    /** 头像浮窗：点击展开，点外部 / Esc 关闭 */
    (function bindAvatarMenu() {
      const btn = document.getElementById('avatarBtn');
      const menu = document.getElementById('avatarMenu');
      if (!btn || !menu) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = menu.hidden;
        menu.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', (e) => {
        if (!menu.hidden && !menu.contains(/** @type {Node} */ (e.target)) && e.target !== btn) {
          menu.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !menu.hidden) {
          menu.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
          btn.focus();
        }
      });
    })();

    /** 刷新列表（保留已应用条件，重算相对日期，回第 1 页并清勾选） */
    document.getElementById('refreshBtn').addEventListener('click', () => {
      selectedIds.clear();
      pageState.page = 1;
      toast('已刷新列表（保留当前筛选与排序）');
      render();
    });

    /** 场景切换（原型验收：我的签署-全部任务 / 全部签署-进行中 / 任务文件夹 / 选择收件人） */
    document.getElementById('scenarioSwitcher').addEventListener('click', (e) => {
      const btn = /** @type {HTMLElement} */ (e.target).closest('[data-scenario]');
      if (!btn) return;
      document.querySelectorAll('#scenarioSwitcher [data-scenario]').forEach((b) => b.classList.toggle('is-on', b === btn));
      const key = btn.getAttribute('data-scenario');
      ['date', 'status', 'sender', 'quick'].forEach((k) => { activeFilters[k] = null; });
      selectedIds.clear();
        pageState.page = 1;
      currentLegacy = null;
      document.body.removeAttribute('data-page-mode');
      if (key === 'mine-all') {
        currentScope = 'mine'; currentNav = 'all'; currentFolder = null;
        render();
      } else if (key === 'corp-progress') {
        currentScope = 'corp'; currentNav = 'active'; currentFolder = null;
        render();
      } else if (key === 'folder') {
        scopeBeforeFolder = currentScope;
        currentFolder = 'sales'; openFolderIds.add('sales');
        const moduleEl = document.getElementById('folderModule');
        moduleEl.classList.add('is-open');
        rebuildFolderTree();
        render();
      } else if (key === 'multi-party') {
        currentScope = 'mine'; currentNav = 'all'; currentFolder = null;
        render();
        const task = TASKS.find((x) => x.id === '1000234567890123457');
        if (task) openPartyDialog(task);
      }
    });

    /** 通用 data-href 站内跳转（如合同库设计稿） */
    document.body.addEventListener('click', (e) => {
      const linkBtn = /** @type {HTMLElement} */ (e.target).closest('[data-href]');
      if (linkBtn) window.location.href = linkBtn.getAttribute('data-href');
    });

    /** 通用 data-toast 提示（整站契约） */
    document.body.addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      const toastBtn = t.closest('[data-toast]');
      if (toastBtn) toast(toastBtn.getAttribute('data-toast') || '');
      if (!t.closest('.row-menu') && !t.closest('[data-more]') && openMenuId) {
        closeRowMenu();
      }
    });

    render();
  </script>
  <script>
    /* 防御：主脚本若未能完成首次渲染（缓存/热更导致的状态错乱），自动无缓存重载一次 */
    window.addEventListener('load', function () {
      setTimeout(function () {
        var rows = document.querySelectorAll('#taskBody tr').length;
        var headCols = document.querySelectorAll('#taskHead th').length;
        if (rows === 0 && headCols === 0 && !sessionStorage.getItem('aip-reloaded')) {
          sessionStorage.setItem('aip-reloaded', '1');
          location.reload();
        } else {
          sessionStorage.removeItem('aip-reloaded');
        }
      }, 800);
    });
  </script>
</body>
</html>
