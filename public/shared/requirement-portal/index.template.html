<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><!-- {{PAGE_TITLE}} --></title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />

<body>
  <div class="cursor is-hidden" aria-hidden="true">

    <a class="topbar__brand topbar__brand--back" href="../../../#versions" aria-label="返回" data-cursor="hover">

      <p class="hero__eyebrow"><!-- {{EYEBROW}} --></p>
      <h1 id="portal-title" class="hero__title"><!-- {{TITLE}} --></h1>

      <div class="portal-cards">

        <a class="portal-card" href="demo-path/" data-updated-at="2026-07-14T10:00:00" data-cursor="hover">

  <script src="../../../shared/portal-home.js"></script>
