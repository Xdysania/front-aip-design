<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIP 设计稿</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #f5f7fb; color: #17223b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 680px); padding: 56px; background: white; border: 1px solid #e7ebf2; border-radius: 24px; }
    .label { color: #4263eb; font-size: 13px; font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 20px 0 16px; font-size: clamp(32px, 6vw, 46px); letter-spacing: -1px; }
    p { color: #657087; font-size: 16px; line-height: 1.8; margin: 0; }
    footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #edf0f5; font-size: 13px; color: #7c879c; }
    @media (max-width: 480px) { body { padding: 20px; } main { padding: 32px 24px; } }
  </style>
</head>
<body>
  <main>
    <span class="label">AIP DESIGN</span>
    <h1>AIP 设计稿</h1>
    <p>这里将集中展示 AIP 产品的页面设计与交互原型。</p>
    <p>设计稿整理中，敬请期待。</p>
    <footer>设计预览 · 仅供内部交流</footer>
  </main>
</body>
</html>
